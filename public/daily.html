<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily report - Sauron</title>
<!--
  The morning report, exactly as it will be sent. Previewed here first so the
  figures can be checked against the dashboard and the Monday board before the
  message reaches anybody's phone. WhatsApp sending is not connected yet.

  modulepreload for the same reason as every other page: a dynamic import() is
  invisible to the preload scanner.
-->
<link rel="modulepreload" href="/vendor/supabase.js">
<!--SAURON_CONFIG-->
<link rel="modulepreload" href="/terms-gate.js">
<script>
/* Light or dark, decided before anything draws so there is no flash: this
   browser's choice from the menu switch if it made one, else the device's own
   setting, followed live. theme.css holds both palettes. */
(function () {
  var d = document.documentElement, chosen = null, m = window.matchMedia ? matchMedia('(prefers-color-scheme: dark)') : null;
  try { chosen = localStorage.getItem('sauron.theme'); } catch (e) {}
  function system() { return m && m.matches ? 'dark' : 'light'; }
  function apply() { d.setAttribute('data-theme', chosen || system()); }
  apply();
  if (m && m.addEventListener) m.addEventListener('change', function () { if (!chosen) apply(); });
  window.sauronTheme = {
    current: function () { return d.getAttribute('data-theme'); },
    toggle: function () {
      var next = d.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      chosen = next === system() ? null : next;   // matching the device again means "follow the device"
      try { chosen ? localStorage.setItem('sauron.theme', chosen) : localStorage.removeItem('sauron.theme'); } catch (e) {}
      apply();
    },
  };
})();
</script>
<link rel="preload" href="/vendor/fonts/inter-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/theme.css?v=2">
<link rel="modulepreload" href="/brief-badge.js">
<link rel="icon" href="/brand/sauron-eye.svg" type="image/svg+xml">
<link rel="icon" href="/brand/icon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/brand/apple-touch-icon.png">
<!-- Home-screen app (Khai, 13 Oct 2026): Android reads the manifest, iPhone the apple- tags. -->
<link rel="manifest" href="/manifest.webmanifest">
<script src="/install-prompt.js" defer></script>
<meta name="theme-color" content="#f6f2ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1916" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sauron">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }


  body {
    font-family: var(--font);
    background: var(--bg); color: var(--text); line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  header {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 20px; border-bottom: 1px solid var(--border);
    background: var(--surface); position: sticky; top: 0; z-index: 10;
  }
  .logo {
    width: 30px; height: 30px;
    background: url(/brand/sauron-eye.svg) center / contain no-repeat;
    flex-shrink: 0;
  }
  header h1 { font-size: 17px; font-weight: 600; }
  .subtitle { font-size: 13px; color: var(--text-muted); }
  header nav { margin-left: auto; display: flex; gap: 16px; font-size: 15px; flex-wrap: wrap; justify-content: flex-end; }
  header nav a { color: var(--text-muted); text-decoration: none; }
  header nav a.active { color: var(--accent); }
  header nav a:hover { color: var(--text); }

  main { max-width: 560px; margin: 0 auto; padding: 20px 16px 40px; }
  .note { font-size: 14px; color: var(--text-muted); margin-bottom: 18px; }
  .loading { color: var(--text-muted); font-size: 15px; }
  .err { color: var(--error); font-size: 15px; }

  /**
   * A message bubble, so what is checked here is what a phone will show:
   * WhatsApp wraps lines and honours *bold* and _italic_, nothing more.
   */
  .bubble {
    background: var(--bubble); border-radius: 10px; padding: 10px 12px;
    font-size: 16px; white-space: pre-wrap; overflow-wrap: anywhere;
    margin-bottom: 14px; border: 1px solid var(--border);
  }
  .bubble em { color: var(--text-muted); }
  .stamp { font-size: 13px; color: var(--text-muted); text-align: right; margin-top: 4px; }
</style>
</head>
<body>
  <header class="site-header">
    <div class="logo"></div>
    <div>
      <h1>Daily report</h1>
      <div class="subtitle">Preview of the morning message</div>
    </div>
    <nav class="site-nav">
      <a href="/">Dashboard</a>
      <a href="/briefing.html" data-brief-link>Weekly Recommends</a>
      <a href="/chat.html">Query</a>
      <a href="/plan.html">Plan</a>
      <a href="/daily.html" class="active" id="daily-link">Daily</a>
      <a href="/admin.html" class="nav-icon" id="admin-link" aria-label="Settings" title="Settings" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></a>
      <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Switch between light and dark" title="Light or dark"><svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
      <a href="#" id="logout-link">Logout</a>
    </nav>
    <script>
    /*
     * ONE menu, the same on every page (Khai, 13 Oct 2026: "the menu buttons
     * keep shuffling"). Each page used to carry its own -- different order,
     * different links, different sizes -- and the owner links and the brief
     * badge arrived after sign-in, pushing everything sideways. This paints
     * them from this browser's last visit before anything else draws; the page
     * corrects it once it knows (setNavOwner, /brief-badge.js).
     */
    (function () {
      var state = {};
      try { state = JSON.parse(localStorage.getItem('sauron.nav') || '{}'); } catch (e) {}
      function save() { try { localStorage.setItem('sauron.nav', JSON.stringify(state)); } catch (e) {} }
      window.setNavOwner = function (owner, confirmed) {
        ['daily-link', 'admin-link'].forEach(function (id) {
          var a = document.getElementById(id);
          if (a && !a.classList.contains('active')) a.hidden = !owner;
        });
        state.owner = !!owner; save();
        // Called with `confirmed` once the server has said who this is: the
        // signal the home-screen offer waits for, so it never shows on a page
        // that is about to send the person to sign in (/install-prompt.js).
        if (confirmed && !window.sauronSignedIn) {
          window.sauronSignedIn = true;
          window.dispatchEvent(new Event('sauron:signed-in'));
        }
      };
      window.setNavBrief = function (count) {
        var a = document.querySelector('a[data-brief-link]');
        if (!a) return;
        var b = a.querySelector('.nav-badge');
        if (count > 0) {
          if (!b) { b = document.createElement('span'); b.className = 'nav-badge'; a.appendChild(b); }
          b.textContent = String(count);
        } else if (b) b.remove();
        state.brief = count; save();
      };
      var t = document.getElementById('theme-toggle');
      if (t && window.sauronTheme) t.addEventListener('click', window.sauronTheme.toggle);
      if (state.owner) window.setNavOwner(true);
      if (state.brief > 0) window.setNavBrief(state.brief);
    })();
    </script>
  </header>

  <main>
    <p class="note">
      What each venue's morning message will say. Not sent to anyone yet &mdash;
      check the figures against the dashboard and the Monday board first.
    </p>
    <div id="reports"><div class="loading">Loading…</div></div>
  </main>

<script type="module">
let token = null;

(async () => {
  const [cfg, { createClient }] = await Promise.all([
    window.__SAURON_CONFIG__ ?? fetch('/api/config').then(r => r.json()),
    import('/vendor/supabase.js'),
  ]);
  const supabase = createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);

  const { data: { session } } = await supabase.auth.getSession();
  if (!session) { window.location.href = '/login.html'; return; }
  token = session.access_token;
  // How much of this week's brief is new to this person (menu badge).
  import('/brief-badge.js').then(m => m.briefBadge(token));

  // All three need only the token, so all three start now.
  const gate = import('/terms-gate.js');
  const mePromise = fetch('/api/me', { headers: { Authorization: 'Bearer ' + token } });
  let reportPromise = fetchReport();

  const { enforceTerms } = await gate;
  const terms = await enforceTerms(token);
  // Issued before an acceptance existed, the parallel fetch was refused --
  // correctly. Only 'already' means its answer can be used.
  if (terms !== 'already') reportPromise = fetchReport();

  const meRes = await mePromise;
  if (!meRes.ok) { window.location.href = '/login.html'; return; }
  const me = await meRes.json();
  window.setNavOwner(!!me.isOwner, true);

  const logout = document.getElementById('logout-link');
  logout.addEventListener('click', async (e) => {
    e.preventDefault();
    await supabase.auth.signOut();
    window.location.href = '/login.html';
  });

  render(await reportPromise);
})();

async function fetchReport() {
  try {
    const res = await fetch('/api/daily-report', { headers: { Authorization: 'Bearer ' + token } });
    const body = await res.json().catch(() => ({}));
    return res.ok ? body : { error: body.message || body.error || ('Request failed (' + res.status + ')') };
  } catch (e) {
    return { error: String(e?.message || e) };
  }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

/** WhatsApp's own markup and nothing else: *bold* and _italic_. */
function whatsapp(text) {
  return escapeHtml(text)
    .replace(/\*([^*\n]+)\*/g, '<strong>$1</strong>')
    .replace(/(^|\s)_([^_\n]+)_(?=\s|$)/g, '$1<em>$2</em>');
}

function render(data) {
  const el = document.getElementById('reports');
  if (!data || data.error) {
    el.innerHTML = '<div class="err">' + escapeHtml(data?.error || 'Could not load the report') + '</div>';
    return;
  }
  const at = new Date(data.generated_at).toLocaleTimeString('en-SG', { hour: '2-digit', minute: '2-digit', timeZone: 'Asia/Singapore' });
  el.innerHTML = (data.reports || []).map(r =>
    '<div class="bubble">' + whatsapp(r.text) + '<div class="stamp">' + escapeHtml(at) + '</div></div>'
  ).join('') || '<div class="loading">No venues.</div>';
}
</script>
</body>
</html>
