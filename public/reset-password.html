<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password - Sauron</title>
<!--
  Start the auth client downloading while the HTML is still being parsed.

  Without this the browser cannot know it needs the file until the script at the
  bottom of the page runs and reaches its dynamic import() -- so a 60 KB
  download that could have been in flight from the first byte waits for the
  whole document to parse first. A modulepreload is the only way to tell it
  earlier, because a dynamic import is invisible to the preload scanner.
-->
<link rel="modulepreload" href="/vendor/supabase.js">
<!--
  The Supabase config, substituted by the server (see injectConfig in
  src/server.ts). It used to be a fetch, which was a whole round trip at the
  front of the chain for two public values, and nothing could start until it
  came back.
-->
<!--SAURON_CONFIG-->
<script>
/* Light or dark, decided before anything draws so there is no flash: this
   browser's choice from the menu switch if it made one, else the device's own
   setting, followed live. theme.css holds both palettes. */
(function () {
  var d = document.documentElement, chosen = null, m = window.matchMedia ? matchMedia('(prefers-color-scheme: dark)') : null;
  try { chosen = localStorage.getItem('sauron.theme'); } catch (e) {}
  function system() { return m && m.matches ? 'dark' : 'light'; }
  function apply() { d.setAttribute('data-theme', chosen || system()); }
  apply();
  if (m && m.addEventListener) m.addEventListener('change', function () { if (!chosen) apply(); });
  window.sauronTheme = {
    current: function () { return d.getAttribute('data-theme'); },
    toggle: function () {
      var next = d.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      chosen = next === system() ? null : next;   // matching the device again means "follow the device"
      try { chosen ? localStorage.setItem('sauron.theme', chosen) : localStorage.removeItem('sauron.theme'); } catch (e) {}
      apply();
    },
  };
})();
</script>
<link rel="preload" href="/vendor/fonts/inter-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/theme.css">
<link rel="icon" href="/brand/sauron-eye.svg" type="image/svg+xml">
<link rel="icon" href="/brand/icon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/brand/apple-touch-icon.png">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }


  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 40px;
    width: 100%;
    max-width: 400px;
    text-align: center;
  }

  .logo {
    width: 64px;
    height: 64px;
    background: url(/brand/sauron-eye.svg) center / contain no-repeat;
    margin: 0 auto 20px;
  }

  h1 { font-size: 24px; margin-bottom: 8px; }
  .subtitle { color: var(--text-muted); font-size: 15px; margin-bottom: 32px; }

  .form-group { margin-bottom: 16px; text-align: left; }

  label { display: block; font-size: 14px; color: var(--text-muted); margin-bottom: 6px; }

  input[type="password"] {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px;
    color: var(--text);
    font-size: 15px;
    font-family: inherit;
    outline: none;
  }

  input:focus { border-color: var(--accent); }

  .btn {
    width: 100%;
    background: var(--accent);
    color: var(--on-accent);
    border: none;
    border-radius: 10px;
    padding: 12px;
    font-size: 16px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    margin-top: 8px;
  }

  .btn:hover { background: var(--accent-dim); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .message { margin-top: 16px; font-size: 14px; padding: 10px 14px; border-radius: 8px; display: none; }
  .message.error { display: block; color: var(--error); background: rgba(179,38,30,0.08); border: 1px solid rgba(179,38,30,0.2); }
  .message.success { display: block; color: var(--success); background: rgba(47,125,74,0.08); border: 1px solid rgba(47,125,74,0.2); }
</style>
</head>
<body>
  <div class="card">
    <div class="logo"></div>
    <h1>Reset Password</h1>
    <div class="subtitle">Enter your new password</div>

    <form id="reset-form">
      <div class="form-group">
        <label for="password">New password</label>
        <input type="password" id="password" placeholder="Enter new password" required>
      </div>
      <div class="form-group">
        <label for="confirm">Confirm password</label>
        <input type="password" id="confirm" placeholder="Confirm new password" required>
      </div>
      <button type="submit" class="btn" id="submit-btn">Update password</button>
    </form>

    <div id="msg" class="message"></div>
  </div>

<script>
(async function init() {
  // Both at once — see login.html.
  // Inlined by the server, so there is nothing to wait for. The fetch remains
  // as a fallback: if the substitution ever fails, the page authenticates the
  // way it always did rather than not at all.
  const [cfg, { createClient }] = await Promise.all([
    window.__SAURON_CONFIG__ ?? fetch('/api/config').then(r => r.json()),
    import('/vendor/supabase.js'),
  ]);
  if (!cfg.supabaseUrl || !cfg.supabaseAnonKey) {
    showMsg('error', 'Auth not configured.');
    return;
  }
  const supabase = createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);

  // Supabase puts tokens in the hash after the reset link redirect
  if (window.location.hash.includes('access_token')) {
    const params = new URLSearchParams(window.location.hash.substring(1));
    const accessToken = params.get('access_token');
    const refreshToken = params.get('refresh_token');
    if (accessToken && refreshToken) {
      await supabase.auth.setSession({ access_token: accessToken, refresh_token: refreshToken });
    }
  }

  const form = document.getElementById('reset-form');
  const submitBtn = document.getElementById('submit-btn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const password = document.getElementById('password').value;
    const confirm = document.getElementById('confirm').value;

    if (password !== confirm) {
      showMsg('error', 'Passwords do not match.');
      return;
    }

    if (password.length < 6) {
      showMsg('error', 'Password must be at least 6 characters.');
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Updating...';

    const { error } = await supabase.auth.updateUser({ password });

    if (error) {
      showMsg('error', error.message);
      submitBtn.disabled = false;
      submitBtn.textContent = 'Update password';
    } else {
      showMsg('success', 'Password updated. Redirecting...');
      setTimeout(() => { window.location.href = '/'; }, 1500);
    }
  });
})();

function showMsg(type, text) {
  const el = document.getElementById('msg');
  el.className = 'message ' + type;
  el.textContent = text;
}
</script>
</body>
</html>
