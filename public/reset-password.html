<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password - Sauron</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0a0a0f;
    --surface: #14141f;
    --border: #2a2a3a;
    --text: #e4e4ef;
    --text-muted: #8888a0;
    --accent: #e8933a;
    --accent-dim: #c47520;
    --error: #e84040;
    --success: #40c060;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 40px;
    width: 100%;
    max-width: 400px;
    text-align: center;
  }

  .logo {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: radial-gradient(circle, var(--accent) 0%, #8b3500 60%, #2a0e00 100%);
    box-shadow: 0 0 40px rgba(232, 147, 58, 0.25);
    margin: 0 auto 20px;
  }

  h1 { font-size: 24px; margin-bottom: 8px; }
  .subtitle { color: var(--text-muted); font-size: 14px; margin-bottom: 32px; }

  .form-group { margin-bottom: 16px; text-align: left; }

  label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 6px; }

  input[type="password"] {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px;
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    outline: none;
  }

  input:focus { border-color: var(--accent); }

  .btn {
    width: 100%;
    background: var(--accent);
    color: #000;
    border: none;
    border-radius: 10px;
    padding: 12px;
    font-size: 15px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    margin-top: 8px;
  }

  .btn:hover { background: var(--accent-dim); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .message { margin-top: 16px; font-size: 13px; padding: 10px 14px; border-radius: 8px; display: none; }
  .message.error { display: block; color: var(--error); background: rgba(232, 64, 64, 0.08); border: 1px solid rgba(232, 64, 64, 0.2); }
  .message.success { display: block; color: var(--success); background: rgba(64, 192, 96, 0.08); border: 1px solid rgba(64, 192, 96, 0.2); }
</style>
</head>
<body>
  <div class="card">
    <div class="logo"></div>
    <h1>Reset Password</h1>
    <div class="subtitle">Enter your new password</div>

    <form id="reset-form">
      <div class="form-group">
        <label for="password">New password</label>
        <input type="password" id="password" placeholder="Enter new password" required>
      </div>
      <div class="form-group">
        <label for="confirm">Confirm password</label>
        <input type="password" id="confirm" placeholder="Confirm new password" required>
      </div>
      <button type="submit" class="btn" id="submit-btn">Update password</button>
    </form>

    <div id="msg" class="message"></div>
  </div>

<script>
(async function init() {
  const cfg = await fetch('/api/config').then(r => r.json());
  if (!cfg.supabaseUrl || !cfg.supabaseAnonKey) {
    showMsg('error', 'Auth not configured.');
    return;
  }

  const { createClient } = await import('https://esm.sh/@supabase/supabase-js@2');
  const supabase = createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);

  // Supabase puts tokens in the hash after the reset link redirect
  if (window.location.hash.includes('access_token')) {
    const params = new URLSearchParams(window.location.hash.substring(1));
    const accessToken = params.get('access_token');
    const refreshToken = params.get('refresh_token');
    if (accessToken && refreshToken) {
      await supabase.auth.setSession({ access_token: accessToken, refresh_token: refreshToken });
    }
  }

  const form = document.getElementById('reset-form');
  const submitBtn = document.getElementById('submit-btn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const password = document.getElementById('password').value;
    const confirm = document.getElementById('confirm').value;

    if (password !== confirm) {
      showMsg('error', 'Passwords do not match.');
      return;
    }

    if (password.length < 6) {
      showMsg('error', 'Password must be at least 6 characters.');
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Updating...';

    const { error } = await supabase.auth.updateUser({ password });

    if (error) {
      showMsg('error', error.message);
      submitBtn.disabled = false;
      submitBtn.textContent = 'Update password';
    } else {
      showMsg('success', 'Password updated. Redirecting...');
      setTimeout(() => { window.location.href = '/'; }, 1500);
    }
  });
})();

function showMsg(type, text) {
  const el = document.getElementById('msg');
  el.className = 'message ' + type;
  el.textContent = text;
}
</script>
</body>
</html>
