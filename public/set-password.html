<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set your password - Sauron</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0a0a0f;
    --surface: #14141f;
    --border: #2a2a3a;
    --text: #e4e4ef;
    --text-muted: #8888a0;
    --accent: #e8933a;
    --accent-dim: #c47520;
    --error: #e84040;
    --success: #40c060;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 36px 32px;
    width: 100%;
    max-width: 420px;
  }

  .logo {
    width: 56px; height: 56px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, var(--accent), var(--accent-dim));
    margin: 0 auto 18px;
  }

  h1 { font-size: 19px; font-weight: 600; text-align: center; margin-bottom: 6px; }
  .sub { font-size: 13px; color: var(--text-muted); text-align: center; margin-bottom: 24px; line-height: 1.5; }

  label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
  input {
    width: 100%; padding: 11px 13px; margin-bottom: 14px;
    background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
    color: var(--text); font-size: 15px; font-family: inherit;
  }
  input:focus { outline: none; border-color: var(--accent); }

  button {
    width: 100%; padding: 12px; border: none; border-radius: 8px;
    background: var(--accent); color: #14141f; font-size: 15px; font-weight: 600;
    cursor: pointer; font-family: inherit;
  }
  button:disabled { opacity: .5; cursor: not-allowed; }

  .msg { font-size: 13px; margin-top: 14px; line-height: 1.5; text-align: center; }
  .msg.error { color: var(--error); }
  .msg.ok { color: var(--success); }

  .rules { font-size: 12px; color: var(--text-muted); margin: -6px 0 16px; line-height: 1.5; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo"></div>
    <h1>Set your password</h1>
    <div class="sub" id="who">Choose a password for your Sauron account.</div>

    <form id="form">
      <label for="pw">New password</label>
      <input type="password" id="pw" autocomplete="new-password" required>
      <label for="pw2">Confirm password</label>
      <input type="password" id="pw2" autocomplete="new-password" required>
      <div class="rules">At least 10 characters. Nobody else — including whoever invited you — will ever see it.</div>
      <button type="submit" id="submit">Set password and continue</button>
    </form>

    <div class="msg" id="msg"></div>
  </div>

<script type="module">
/**
 * Where a Supabase invitation lands.
 *
 * The invite link carries a one-time token in the URL FRAGMENT, which never
 * reaches our server — the browser's Supabase client consumes it and exchanges
 * it for a session. So this page can only work client-side, and the password
 * is set against that session rather than sent to us. That is the point of the
 * change: no password we choose, none we could read, none in a log.
 */
const msg = document.getElementById('msg');
const form = document.getElementById('form');
const submit = document.getElementById('submit');

const cfg = await fetch('/api/config').then(r => r.json());
const { createClient } = await import('https://esm.sh/@supabase/supabase-js@2');
const supabase = createClient(cfg.supabaseUrl, cfg.supabaseAnonKey, {
  auth: { detectSessionInUrl: true, flowType: 'implicit' },
});

/**
 * Wait for the client to consume the fragment before judging the link.
 *
 * getSession() immediately after createClient can return null while the token
 * in the URL is still being exchanged, which would tell somebody with a
 * perfectly good invitation that it had expired.
 */
async function sessionSoon(attempts = 10) {
  for (let i = 0; i < attempts; i++) {
    const { data: { session } } = await supabase.auth.getSession();
    if (session) return session;
    await new Promise(r => setTimeout(r, 150));
  }
  return null;
}

const session = await sessionSoon();

if (!session) {
  form.style.display = 'none';
  msg.className = 'msg error';
  // Both causes are common and the remedies differ, so say both rather than
  // picking one and being wrong half the time.
  msg.innerHTML =
    'This link has expired or has already been used.<br>' +
    'Ask for a new invitation, or use <a href="/login.html" style="color:var(--accent)">Forgot password</a> on the login page.';
} else if (session.user?.email) {
  document.getElementById('who').textContent = `Choose a password for ${session.user.email}.`;
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const pw = document.getElementById('pw').value;
  const pw2 = document.getElementById('pw2').value;

  msg.className = 'msg';
  msg.textContent = '';

  if (pw.length < 10) {
    msg.className = 'msg error';
    msg.textContent = 'Use at least 10 characters.';
    return;
  }
  if (pw !== pw2) {
    msg.className = 'msg error';
    msg.textContent = 'The two passwords do not match.';
    return;
  }

  submit.disabled = true;
  submit.textContent = 'Setting...';

  const { error } = await supabase.auth.updateUser({ password: pw });

  if (error) {
    msg.className = 'msg error';
    msg.textContent = error.message;
    submit.disabled = false;
    submit.textContent = 'Set password and continue';
    return;
  }

  msg.className = 'msg ok';
  msg.textContent = 'Password set. Taking you to Sauron...';
  // Straight into the app, where the terms are waiting. Sending them to the
  // login page instead would make somebody type a password they set four
  // seconds ago.
  setTimeout(() => { window.location.href = '/'; }, 900);
});
</script>
</body>
</html>
