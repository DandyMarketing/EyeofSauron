<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Briefing - Sauron</title>
<!--
  Start the auth client downloading while the HTML is still being parsed.

  Without this the browser cannot know it needs the file until the script at the
  bottom of the page runs and reaches its dynamic import() -- so a 60 KB
  download that could have been in flight from the first byte waits for the
  whole document to parse first. A modulepreload is the only way to tell it
  earlier, because a dynamic import is invisible to the preload scanner.
-->
<link rel="modulepreload" href="/vendor/supabase.js">
<!--
  The Supabase config, substituted by the server (see injectConfig in
  src/server.ts). It used to be a fetch, which was a whole round trip at the
  front of the chain for two public values, and nothing could start until it
  came back.
-->
<!--SAURON_CONFIG-->
<link rel="modulepreload" href="/terms-gate.js">
<script>
/* Light or dark, decided before anything draws so there is no flash: this
   browser's choice from the menu switch if it made one, else the device's own
   setting, followed live. theme.css holds both palettes. */
(function () {
  var d = document.documentElement, chosen = null, m = window.matchMedia ? matchMedia('(prefers-color-scheme: dark)') : null;
  try { chosen = localStorage.getItem('sauron.theme'); } catch (e) {}
  function system() { return m && m.matches ? 'dark' : 'light'; }
  function apply() { d.setAttribute('data-theme', chosen || system()); }
  apply();
  if (m && m.addEventListener) m.addEventListener('change', function () { if (!chosen) apply(); });
  window.sauronTheme = {
    current: function () { return d.getAttribute('data-theme'); },
    toggle: function () {
      var next = d.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      chosen = next === system() ? null : next;   // matching the device again means "follow the device"
      try { chosen ? localStorage.setItem('sauron.theme', chosen) : localStorage.removeItem('sauron.theme'); } catch (e) {}
      apply();
    },
  };
})();
</script>
<link rel="preload" href="/vendor/fonts/inter-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/theme.css">
<link rel="modulepreload" href="/brief-badge.js">
<link rel="icon" href="/brand/sauron-eye.svg" type="image/svg+xml">
<link rel="icon" href="/brand/icon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/brand/apple-touch-icon.png">
<!-- Home-screen app (Khai, 13 Oct 2026): Android reads the manifest, iPhone the apple- tags. -->
<link rel="manifest" href="/manifest.webmanifest">
<script src="/install-prompt.js" defer></script>
<meta name="theme-color" content="#f6f2ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1916" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sauron">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }


  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  header {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    position: sticky; top: 0; z-index: 10;
  }
  .logo {
    width: 30px; height: 30px;
    background: url(/brand/sauron-eye.svg) center / contain no-repeat;
    flex-shrink: 0;
  }
  header h1 { font-size: 17px; font-weight: 600; }
  .subtitle { font-size: 13px; color: var(--text-muted); }
  header nav { margin-left: auto; display: flex; gap: 16px; font-size: 15px; }
  header nav a { color: var(--text-muted); text-decoration: none; }
  header nav a.active { color: var(--accent); }
  header nav a:hover { color: var(--text); }

  .container { max-width: 860px; margin: 0 auto; padding: 24px 20px 80px; }
  .loading { color: var(--text-muted); padding: 40px 0; text-align: center; font-size: 15px; }

  .empty {
    border: 1px dashed var(--border); border-radius: 10px;
    padding: 32px 24px; text-align: center; color: var(--text-muted); font-size: 15px;
  }
  .empty strong { color: var(--text); display: block; margin-bottom: 6px; font-size: 16px; }

  .run-head {
    display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
    margin: 28px 0 12px;
  }
  .run-head:first-child { margin-top: 0; }
  .run-head h2 { font-size: 18px; font-weight: 600; }
  .run-head .when { font-size: 13px; color: var(--text-muted); }

  .venue-head {
    font-size: 13px; font-weight: 600; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: .06em;
    margin: 20px 0 8px; padding-bottom: 6px; border-bottom: 1px solid var(--border);
  }

  .rec {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: 8px;
    padding: 16px 18px;
    margin-bottom: 12px;
  }
  .rec.dismissed { opacity: .45; border-left-color: var(--border); }
  .rec-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .rec-headline { font-weight: 600; font-size: 16px; flex: 1; min-width: 240px; }
  .rec-meta { font-size: 13px; color: var(--text-muted); display: flex; gap: 8px; flex-wrap: wrap; }
  .rec-tag {
    background: var(--surface-hover); border: 1px solid var(--border);
    border-radius: 3px; padding: 1px 6px;
  }
  .rec-confidence { font-variant-numeric: tabular-nums; }
  .rec-body { font-size: 15px; line-height: 1.6; margin-top: 10px; color: var(--text); }
  .rec-body p { margin: 8px 0; }
  /* `ol` is here because ordered lists only started rendering as <ol> when
     the renderer was shared: every old copy turned "1." into a bare <li>
     with no parent, so there was never an element to style. Without the
     indent the numbers hang outside the content box. */
  .rec-body ul, .rec-body ol { margin: 8px 0 8px 18px; }
  .rec-body li { margin: 4px 0; }
  .rec-body h2, .rec-body h3, .rec-body h4 { font-size: 15px; margin: 12px 0 4px; }

  /**
   * A wide table scrolls itself rather than widening the page.
   *
   * `display: block` is what makes overflow-x apply at all — a table box
   * ignores it. The row groups keep their table display types, so the browser
   * forms an anonymous table around them and the columns still line up.
   *
   * Safe here, unlike on the admin page, precisely because these tables carry
   * no `min-width`: the box takes the container's width and only the content
   * scrolls. Where a minimum exists the scroll has to go on a WRAPPER instead,
   * or the minimum applies to the scrolling box and overflows exactly as
   * before. Measured both ways before this was written.
   *
   * Measured: a six-column table of venue figures took plan.html to 409px of
   * content in a 375px viewport. index.html already did this; these two were
   * simply missed.
   */
  .rec-body table { border-collapse: collapse; margin: 10px 0; font-size: 14px; width: 100%; display: block; overflow-x: auto; }
  .rec-body th, .rec-body td { border: 1px solid var(--border); padding: 5px 8px; text-align: left; }
  .rec-body th { background: var(--surface-hover); }
  .rec-body code { background: var(--surface-hover); padding: 1px 4px; border-radius: 3px; font-size: 13px; }
  .rec-body svg { max-width: 100%; height: auto; }
  .rec-actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; align-items: center; }
  .rec-btn {
    background: transparent; border: 1px solid var(--border); color: var(--text-muted);
    border-radius: 4px; padding: 4px 10px; font-size: 13px; cursor: pointer;
    font-family: inherit;
  }
  .rec-btn:hover { background: var(--surface-hover); color: var(--text); }
  .rec-btn.on { border-color: var(--accent); color: var(--accent); }
  .rec-note { font-size: 13px; color: var(--text-muted); margin-left: auto; }

  details.history { margin-top: 36px; }
  details.history > summary {
    cursor: pointer; color: var(--text-muted); font-size: 14px;
    padding: 10px 0; border-top: 1px solid var(--border);
  }
  details.history > summary:hover { color: var(--text); }

  .withheld {
    font-size: 13px; color: var(--text-muted);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 10px 12px; margin-top: 16px;
  }

  /* --- taking a briefing away with you ---------------------------------- */

  .run-actions { display: flex; gap: 8px; margin-left: auto; }
  .share-btn {
    background: transparent; border: 1px solid var(--border); color: var(--text-muted);
    border-radius: 4px; padding: 4px 10px; font-size: 13px; cursor: pointer;
    font-family: inherit;
  }
  .share-btn:hover { background: var(--surface-hover); color: var(--text); }
  .share-btn.working { color: var(--accent); border-color: var(--accent); }

  /* Off-screen rather than display:none: a hidden element has no layout, and
     the PNG builder measures the card to size the canvas. */
  .png-stage {
    position: fixed; left: -10000px; top: 0; width: 760px; pointer-events: none;
  }

  /* Paper only. On screen the header above already says all of this. */
  .print-title { display: none; }

  /**
   * PRINT: a light document.
   *
   * The charts are drawn for the light look since 13 Oct 2026, and stored
   * ones from before are repainted as they are served (relightChart), so they
   * print as they are. print-color-adjust keeps their panel's background.
   */
  @media print {
    @page { size: A4; margin: 14mm; }

    :root {
      --bg: #ffffff;
      --surface: #ffffff;
      --surface-hover: #f2f3f5;
      --border: #c9ccd2;
      --text: #14181f;
      --text-muted: #5a6068;
    }

    html, body { background: #fff; color: #14181f; }

    /* Screen furniture. None of it means anything on paper, and the rating
       buttons are actively misleading -- they look pressable in a PDF. */
    header, nav, .run-actions, .rec-actions, .png-stage { display: none !important; }

    .container { max-width: none; padding: 0; }

    .print-title {
      display: block !important;
      font-size: 11pt;
      line-height: 1.45;
      color: #14181f;
      padding-bottom: 8px;
      margin-bottom: 14px;
      border-bottom: 2px solid #14181f;
    }
    .print-title strong { font-size: 15pt; }

    /* The date range is in the masthead now; repeating it as a heading two
       lines below wastes the top of the page. */
    .run-head { display: none !important; }

    /* History is a <details>; whether it prints should not depend on whether
       somebody happened to click it open. This week is the document. */
    details.history { display: none !important; }

    .rec {
      border: 1px solid #c9ccd2;
      border-left: 3px solid #b06a12;
      break-inside: avoid;
      page-break-inside: avoid;
      margin-bottom: 10mm;
    }
    .rec.dismissed { opacity: 1; }
    .rec-body th { background: #f2f3f5; }

    .rec-body svg {
      background: var(--surface);
      border-radius: 6px;
      padding: 6px;
      break-inside: avoid;
      page-break-inside: avoid;
    }

    /* One recommendation on its own, when that is what was asked for. Set on
       <body> so the rule is a single selector rather than a pass over the DOM
       toggling styles that then have to be put back. */
    body.print-one .rec:not(.print-target),
    body.print-one .venue-head,
    body.print-one .withheld { display: none !important; }

    * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
  }

  /**
   * A definition line, set apart from the analysis. Same rule as the chat --
   * see the long note on .figure-note in index.html. Smaller, muted, and
   * visibly subordinate, because it is reference material you read once.
   */
  .figure-note {
    font-size: 0.8em;
    line-height: 1.5;
    color: var(--text-muted);
    font-style: normal;
    margin-top: -2px;
    opacity: 0.95;
  }

  /**
   * Images emitted by the shared markdown renderer. The class is the same on
   * every page so one renderer can serve them all; the sizing can still differ
   * per page. `.expired` is the state its onerror sets when a signed Instagram
   * url has aged out -- collapsed rather than left as a broken-image icon,
   * because a broken icon reads as data we lost rather than a link that expired.
   */
  .post-thumb {
    max-width: 100%;
    border-radius: 8px;
    vertical-align: middle;
    margin: 4px 6px 4px 0;
    background: rgba(46,42,37,0.04);
  }
  .post-thumb.expired { max-width: 0; max-height: 0; margin: 0; opacity: 0; }
</style>
</head>
<body>
  <header class="site-header">
    <div class="logo"></div>
    <div>
      <h1>Weekly Briefing</h1>
      <div class="subtitle">The Dandy Collection</div>
    </div>
    <nav class="site-nav">
      <a href="/">Dashboard</a>
      <a href="/briefing.html" class="active" data-brief-link>Weekly brief</a>
      <a href="/chat.html">Query</a>
      <a href="/plan.html">Plan easier</a>
      <a href="/daily.html" id="daily-link" hidden>Daily</a>
      <a href="/admin.html" id="admin-link" hidden>Admin</a>
      <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Switch between light and dark" title="Light or dark"><svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
      <a href="#" id="logout-link">Logout</a>
    </nav>
    <script>
    /*
     * ONE menu, the same on every page (Khai, 13 Oct 2026: "the menu buttons
     * keep shuffling"). Each page used to carry its own -- different order,
     * different links, different sizes -- and the owner links and the brief
     * badge arrived after sign-in, pushing everything sideways. This paints
     * them from this browser's last visit before anything else draws; the page
     * corrects it once it knows (setNavOwner, /brief-badge.js).
     */
    (function () {
      var state = {};
      try { state = JSON.parse(localStorage.getItem('sauron.nav') || '{}'); } catch (e) {}
      function save() { try { localStorage.setItem('sauron.nav', JSON.stringify(state)); } catch (e) {} }
      window.setNavOwner = function (owner) {
        ['daily-link', 'admin-link'].forEach(function (id) {
          var a = document.getElementById(id);
          if (a && !a.classList.contains('active')) a.hidden = !owner;
        });
        state.owner = !!owner; save();
      };
      window.setNavBrief = function (count) {
        var a = document.querySelector('a[data-brief-link]');
        if (!a) return;
        var b = a.querySelector('.nav-badge');
        if (count > 0) {
          if (!b) { b = document.createElement('span'); b.className = 'nav-badge'; a.appendChild(b); }
          b.textContent = String(count);
        } else if (b) b.remove();
        state.brief = count; save();
      };
      var t = document.getElementById('theme-toggle');
      if (t && window.sauronTheme) t.addEventListener('click', window.sauronTheme.toggle);
      if (state.owner) window.setNavOwner(true);
      if (state.brief > 0) window.setNavBrief(state.brief);
    })();
    </script>
  </header>

  <div class="container" id="app">
    <div class="loading">Loading...</div>
  </div>

<!--
  The ONE markdown renderer, shared by every page that shows an answer.
  A classic script so the global reaches an inline script and a module alike,
  and a src= so the preload scanner can start it during the parse. See the
  long note at the top of markdown.js for what three copies of it had cost.
-->
<script src="/markdown.js"></script>
<script>
let token = null;
let myVenues = [];

(async function init() {
  // Both at once — see index.html. The config is two public strings and the
  // module is 60 KB; serialising them paid for the round trip twice.
  // Inlined by the server, so there is nothing to wait for. The fetch remains
  // as a fallback: if the substitution ever fails, the page authenticates the
  // way it always did rather than not at all.
  const [cfg, { createClient }] = await Promise.all([
    window.__SAURON_CONFIG__ ?? fetch('/api/config').then(r => r.json()),
    import('/vendor/supabase.js'),
  ]);
  if (!cfg.supabaseUrl || !cfg.supabaseAnonKey) {
    document.getElementById('app').innerHTML = '<div class="loading">Auth not configured.</div>';
    return;
  }

  const supabase = createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);

  const { data: { session } } = await supabase.auth.getSession();
  if (!session) { window.location.href = '/login.html'; return; }
  token = session.access_token;
  // Opening the brief clears the menu badge, on every device.
  import('/brief-badge.js').then(m => m.markBriefSeen(token));

  /**
   * THE BRIEFING ITSELF STARTS NOW, not after the terms check and /api/me.
   *
   * This is the change worth having on this page. The briefing is the slowest
   * request here by far -- it is a database read, not two strings -- and it was
   * SIXTH in a chain of six, so a reader stared at "Loading..." through four
   * round trips that had nothing to do with it. All three of these need only
   * the token.
   *
   * The one case that is not safe is handled below rather than by going back to
   * serial: if the terms gate has to appear, this request was issued before the
   * acceptance was recorded and the server correctly refused it.
   */
  const briefing = fetchBriefing();
  const gate = import('/terms-gate.js');
  const mePromise = fetch('/api/me', { headers: { Authorization: 'Bearer ' + token } });

  /**
   * The terms, before the briefing renders. Blocking, and the API refuses
   * /api/recommendations regardless of what happens here.
   */
  const { enforceTerms } = await gate;
  const terms = await enforceTerms(token);

  const meRes = await mePromise;
  if (!meRes.ok) { window.location.href = '/login.html'; return; }
  const me = await meRes.json();
  myVenues = me.venues || [];
  window.setNavOwner(!!me.isOwner);

  document.getElementById('logout-link').addEventListener('click', async (e) => {
    e.preventDefault();
    await supabase.auth.signOut();
    window.location.href = '/login.html';
  });

  // 'already' is the only answer that means the parallel request above was
  // made by somebody the server would answer. Anything else and it is asked
  // again -- once, now that the acceptance exists.
  await render(terms === 'already' ? await briefing : await fetchBriefing());
})();

/**
 * Fetch and nothing else. Split out from render() so it can be started before
 * the things it does not depend on, and so a failure is a VALUE rather than a
 * half-drawn page: it returns { error } and render() decides what the reader
 * sees. Never throws.
 */
async function fetchBriefing() {
  try {
    const res = await fetch('/api/recommendations', { headers: { Authorization: 'Bearer ' + token } });
    if (!res.ok) return { error: 'The chat still works — this page is an addition, not a gate on it.' };
    return { payload: await res.json() };
  } catch (e) {
    return { error: escapeHtml(String(e.message || e)) };
  }
}

async function render(result) {
  const app = document.getElementById('app');

  if (result.error) {
    app.innerHTML = '<div class="empty"><strong>Could not load the briefing.</strong>' + result.error + '</div>';
    return;
  }
  const payload = result.payload;

  const recs = payload.recommendations || [];

  if (recs.length === 0) {
    /**
     * "None yet" and "a quiet week" are different facts and the API cannot
     * tell them apart, so this says the honest thing rather than guessing at
     * the friendlier one. An engine with permission to say nothing needs a
     * reader who knows silence is a valid answer.
     */
    app.innerHTML =
      '<div class="empty"><strong>No briefing published yet.</strong>' +
      'Recommendations are written once a week, on Monday night. A week where nothing was worth raising ' +
      'produces no briefing at all — that is a valid outcome, not a fault.</div>';
    return;
  }

  /**
   * Grouped by the PERIOD it covers, newest first.
   *
   * The chat panel only ever showed the latest run, deliberately: stacking four
   * weeks into one panel is how a briefing becomes a backlog. On a page of its
   * own history has somewhere to live, so it is kept — but collapsed, and
   * subordinate to this week.
   */
  const byPeriod = new Map();
  for (const r of recs) {
    const key = r.period_start + '|' + r.period_end;
    if (!byPeriod.has(key)) byPeriod.set(key, []);
    byPeriod.get(key).push(r);
  }

  const periods = [...byPeriod.entries()].sort((a, b) => b[0].localeCompare(a[0]));
  const [latestKey, latestRecs] = periods[0];

  let html = renderPeriod(latestKey, latestRecs, payload.withheld_for_role || 0, true);

  if (periods.length > 1) {
    html += '<details class="history"><summary>Earlier briefings (' + (periods.length - 1) + ')</summary>';
    for (const [key, rows] of periods.slice(1)) html += renderPeriod(key, rows, 0, false);
    html += '</details>';
  }

  app.innerHTML = html;
}

function renderPeriod(key, rows, withheld, isLatest) {
  const [start, end] = key.split('|');
  const venues = [...new Set(rows.map(r => r.venue))].sort();

  /**
   * A masthead that only exists on paper.
   *
   * The screen header is hidden when printing -- it is navigation, and a nav
   * bar in a PDF is furniture nobody can click. But that left the document
   * opening on a bare date range with nothing saying what it was or whose it
   * was, and this file is meant to be forwarded to people who have never seen
   * the app. The venue names come from the rows rather than from the reader's
   * grants, so a single-venue manager's PDF names their venue too.
   */
  let html =
    '<div class="print-title">' +
      '<strong>Weekly Briefing</strong> · The Dandy Collection<br>' +
      escapeHtml(venues.join(', ')) + ' · ' + escapeHtml(start) + ' to ' + escapeHtml(end) +
    '</div>' +
    '<div class="run-head"><h2>' + escapeHtml(start) + ' to ' + escapeHtml(end) + '</h2>' +
    '<span class="when">' + rows.length + ' recommendation' + (rows.length === 1 ? '' : 's') +
    (venues.length > 1 ? ' across ' + venues.length + ' venues' : '') + '</span>' +
    // Only on the current briefing. Printing an archived week is a different
    // intention and the print stylesheet hides the history section anyway, so a
    // button there would produce a blank page.
    (isLatest ? '<div class="run-actions"><button class="share-btn" onclick="printBriefing()">Download PDF</button></div>' : '') +
    '</div>';

  // One venue per section when the reader can see more than one. A mixed list
  // makes the reader do the grouping, and outlet problems have outlet owners.
  if (venues.length > 1) {
    for (const venue of venues) {
      html += '<div class="venue-head">' + escapeHtml(venue) + '</div>';
      html += rows.filter(r => r.venue === venue).map(renderRecommendation).join('');
    }
  } else {
    html += rows.map(renderRecommendation).join('');
  }

  /**
   * Say when something was withheld.
   *
   * /api/recommendations counts what the reader's role may not see. A briefing
   * that silently drops a finding looks identical to one that had nothing to
   * say, and the difference matters to whoever is reading it.
   */
  if (withheld > 0) {
    html += '<div class="withheld">' + withheld + ' recommendation' + (withheld === 1 ? ' was' : 's were') +
      ' withheld because they touch data your role cannot see. Ask an owner if you need them.</div>';
  }

  return html;
}

function renderRecommendation(r) {
  const charts = (r.charts || []).map(c => '<div>' + c.svg + '</div>').join('');
  return '' +
    '<div class="rec' + (r.status === 'dismissed' ? ' dismissed' : '') + '" id="rec-' + r.id + '">' +
      '<div class="rec-head">' +
        '<div class="rec-headline">' + escapeHtml(r.headline) + '</div>' +
        '<div class="rec-meta">' +
          '<span class="rec-tag">' + escapeHtml(r.domain) + '</span>' +
          '<span class="rec-confidence">confidence ' + Number(r.confidence).toFixed(2) + '</span>' +
        '</div>' +
      '</div>' +
      '<div class="rec-body">' + renderMarkdown(r.body || '') + charts + '</div>' +
      '<div class="rec-actions">' +
        '<button class="rec-btn' + (r.status === 'acted_on' ? ' on' : '') + '" onclick="rateRec(\'' + r.id + '\', {status:\'acted_on\'}, this)">Acted on</button>' +
        '<button class="rec-btn' + (r.rating === 'useful' ? ' on' : '') + '" onclick="rateRec(\'' + r.id + '\', {rating:\'useful\'}, this)">Useful</button>' +
        '<button class="rec-btn' + (r.rating === 'not_useful' ? ' on' : '') + '" onclick="rateRec(\'' + r.id + '\', {rating:\'not_useful\'}, this)">Not useful</button>' +
        '<button class="rec-btn' + (r.rating === 'wrong' ? ' on' : '') + '" onclick="rateRec(\'' + r.id + '\', {rating:\'wrong\', status:\'dismissed\'}, this)">Wrong</button>' +
        '<button class="share-btn" onclick="printOne(\'' + r.id + '\')">PDF</button>' +
        '<button class="share-btn" onclick="shareImage(\'' + r.id + '\', this)">Image</button>' +
        '<span class="rec-note">' + (r.evidence || []).length + ' quer' + ((r.evidence || []).length === 1 ? 'y' : 'ies') + ' behind this</span>' +
      '</div>' +
    '</div>';
}

/* --- taking a briefing away with you ------------------------------------ */

/**
 * The whole briefing as a PDF, via the browser's own print pipeline.
 *
 * NOT a server-rendered PDF, deliberately. Rendering it on Railway would mean
 * putting Chromium in the container that serves the chat -- about 300MB, a
 * slower cold start, and a new way for the chat to fail -- to produce a
 * document the browser already knows how to make. The charts are inline SVG, so
 * printing gives vector-sharp figures and text that stays selectable and
 * searchable in the PDF, which a rendered image never is.
 *
 * On Android Chrome this opens the print sheet where "Save as PDF" is the first
 * destination; the file then shares to WhatsApp like any other.
 */
function printBriefing() {
  document.body.classList.remove('print-one');
  window.print();
}

/**
 * One recommendation on its own.
 *
 * A class on <body> plus one on the card, rather than walking the DOM hiding
 * siblings: the print stylesheet holds the rule, and cleanup is removing two
 * class names instead of restoring styles that a failed print would leave
 * behind.
 *
 * afterprint fires on cancel as well as on save, which is what makes it the
 * right place to undo this -- a timer would either race a slow print sheet or
 * leave the page in print-one state if the user thought about it too long.
 */
function printOne(id) {
  const card = document.getElementById('rec-' + id);
  if (!card) return;

  card.classList.add('print-target');
  document.body.classList.add('print-one');

  const cleanup = () => {
    card.classList.remove('print-target');
    document.body.classList.remove('print-one');
    window.removeEventListener('afterprint', cleanup);
  };
  window.addEventListener('afterprint', cleanup);

  window.print();
}

/**
 * One recommendation as a PNG, for the chat apps where the work actually gets
 * passed on.
 *
 * WHY AN IMAGE AT ALL, when a PDF exists. A PDF arrives in WhatsApp as an
 * attachment with a filename, and an attachment on a phone between services is
 * a thing nobody opens. An image previews in the thread, so the recommendation
 * is read where it lands. The cost is real and worth stating: the text stops
 * being selectable, searchable or translatable, so this is the sharing format
 * and the PDF is the keeping format.
 *
 * BUILT ON A CANVAS BY HAND rather than with a DOM-to-image library. The card
 * is a headline, some prose and a chart -- laying that out is a few dozen lines
 * with no dependency, no CDN, and no surprises about which CSS a library does
 * and does not understand. The alternative pulls a script into a page that
 * serves venue data.
 */
async function shareImage(id, btn) {
  const card = document.getElementById('rec-' + id);
  if (!card) return;

  const label = btn.textContent;
  btn.textContent = 'Building...';
  btn.classList.add('working');

  try {
    const blob = await recommendationPng(card);
    const name = 'sauron-' + (card.querySelector('.rec-headline')?.textContent || 'recommendation')
      .toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 60) + '.png';
    const file = new File([blob], name, { type: 'image/png' });

    /**
     * The share sheet first, a download second.
     *
     * On a phone, sharing straight to WhatsApp is the whole point and a
     * download means finding the file afterwards. canShare({files}) is the only
     * honest test -- the API exists on desktop Chrome without file support, so
     * checking for navigator.share alone throws on the platform where the
     * fallback matters most.
     */
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file] });
    } else {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = name;
      a.click();
      // Revoked on a turn of the event loop, not immediately: Safari cancels an
      // in-flight download when the object URL disappears under it.
      setTimeout(() => URL.revokeObjectURL(url), 10000);
    }
  } catch (e) {
    // AbortError is the user closing the share sheet. That is not a failure and
    // must not be reported as one.
    if (e && e.name !== 'AbortError') {
      console.error('[briefing] image export failed', e);
      alert('Could not build the image. Use the PDF button instead — it does not depend on this.');
    }
  } finally {
    btn.textContent = label;
    btn.classList.remove('working');
  }
}

/**
 * The PNG builder now lives in /card-export.js, because the chat needs the same
 * thing and two copies of an exporter drift. Imported where it is used.
 */
const recommendationPng = (card) => import('/card-export.js').then(m => m.cardToPng(card));

async function rateRec(id, patch, btn) {
  // Marked immediately. A rating button that waits on a round trip gets
  // pressed twice, and the second press is the one nobody meant.
  const row = btn.closest('.rec');
  if (patch.rating) {
    row.querySelectorAll('.rec-btn').forEach(b => {
      if (b.textContent !== 'Acted on') b.classList.remove('on');
    });
  }
  btn.classList.add('on');
  if (patch.status === 'dismissed') row.classList.add('dismissed');

  try {
    await fetch('/api/recommendations/' + id + '/rate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
      body: JSON.stringify(patch),
    });
  } catch (e) {
    // Nothing to roll back to that would be clearer than the state shown.
  }
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

/**
 * The same renderer the chat uses, and the same reasoning behind it: this
 * writes into innerHTML, so a URL is an attribute in a live document rather
 * than text. Both links and images are allowlisted to https and quotes are
 * stripped, because a recommendation body is model-written prose.
 */


</script>
</body>
</html>
