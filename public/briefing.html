<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Briefing - Sauron</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0a0a0f;
    --surface: #14141f;
    --surface-hover: #1a1a2a;
    --border: #2a2a3a;
    --text: #e4e4ef;
    --text-muted: #8888a0;
    --accent: #e8933a;
    --accent-dim: #c47520;
    --error: #e84040;
    --success: #40c060;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  header {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    position: sticky; top: 0; z-index: 10;
  }
  .logo {
    width: 30px; height: 30px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, var(--accent), var(--accent-dim));
    flex-shrink: 0;
  }
  header h1 { font-size: 16px; font-weight: 600; }
  .subtitle { font-size: 11px; color: var(--text-muted); }
  header nav { margin-left: auto; display: flex; gap: 16px; font-size: 14px; }
  header nav a { color: var(--text-muted); text-decoration: none; }
  header nav a.active { color: var(--accent); }
  header nav a:hover { color: var(--text); }

  .container { max-width: 860px; margin: 0 auto; padding: 24px 20px 80px; }
  .loading { color: var(--text-muted); padding: 40px 0; text-align: center; font-size: 14px; }

  .empty {
    border: 1px dashed var(--border); border-radius: 10px;
    padding: 32px 24px; text-align: center; color: var(--text-muted); font-size: 14px;
  }
  .empty strong { color: var(--text); display: block; margin-bottom: 6px; font-size: 15px; }

  .run-head {
    display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
    margin: 28px 0 12px;
  }
  .run-head:first-child { margin-top: 0; }
  .run-head h2 { font-size: 17px; font-weight: 600; }
  .run-head .when { font-size: 12px; color: var(--text-muted); }

  .venue-head {
    font-size: 12px; font-weight: 600; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: .06em;
    margin: 20px 0 8px; padding-bottom: 6px; border-bottom: 1px solid var(--border);
  }

  .rec {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: 8px;
    padding: 16px 18px;
    margin-bottom: 12px;
  }
  .rec.dismissed { opacity: .45; border-left-color: var(--border); }
  .rec-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .rec-headline { font-weight: 600; font-size: 15px; flex: 1; min-width: 240px; }
  .rec-meta { font-size: 11px; color: var(--text-muted); display: flex; gap: 8px; flex-wrap: wrap; }
  .rec-tag {
    background: var(--surface-hover); border: 1px solid var(--border);
    border-radius: 3px; padding: 1px 6px;
  }
  .rec-confidence { font-variant-numeric: tabular-nums; }
  .rec-body { font-size: 14px; line-height: 1.6; margin-top: 10px; color: var(--text); }
  .rec-body p { margin: 8px 0; }
  .rec-body ul { margin: 8px 0 8px 18px; }
  .rec-body h2, .rec-body h3, .rec-body h4 { font-size: 14px; margin: 12px 0 4px; }
  .rec-body table { border-collapse: collapse; margin: 10px 0; font-size: 13px; width: 100%; }
  .rec-body th, .rec-body td { border: 1px solid var(--border); padding: 5px 8px; text-align: left; }
  .rec-body th { background: var(--surface-hover); }
  .rec-body code { background: var(--surface-hover); padding: 1px 4px; border-radius: 3px; font-size: 12px; }
  .rec-body svg { max-width: 100%; height: auto; }
  .rec-actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; align-items: center; }
  .rec-btn {
    background: transparent; border: 1px solid var(--border); color: var(--text-muted);
    border-radius: 4px; padding: 4px 10px; font-size: 12px; cursor: pointer;
    font-family: inherit;
  }
  .rec-btn:hover { background: var(--surface-hover); color: var(--text); }
  .rec-btn.on { border-color: var(--accent); color: var(--accent); }
  .rec-note { font-size: 11px; color: var(--text-muted); margin-left: auto; }

  details.history { margin-top: 36px; }
  details.history > summary {
    cursor: pointer; color: var(--text-muted); font-size: 13px;
    padding: 10px 0; border-top: 1px solid var(--border);
  }
  details.history > summary:hover { color: var(--text); }

  .withheld {
    font-size: 12px; color: var(--text-muted);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 10px 12px; margin-top: 16px;
  }

  /* --- taking a briefing away with you ---------------------------------- */

  .run-actions { display: flex; gap: 8px; margin-left: auto; }
  .share-btn {
    background: transparent; border: 1px solid var(--border); color: var(--text-muted);
    border-radius: 4px; padding: 4px 10px; font-size: 12px; cursor: pointer;
    font-family: inherit;
  }
  .share-btn:hover { background: var(--surface-hover); color: var(--text); }
  .share-btn.working { color: var(--accent); border-color: var(--accent); }

  /* Off-screen rather than display:none: a hidden element has no layout, and
     the PNG builder measures the card to size the canvas. */
  .png-stage {
    position: fixed; left: -10000px; top: 0; width: 760px; pointer-events: none;
  }

  /* Paper only. On screen the header above already says all of this. */
  .print-title { display: none; }

  /**
   * PRINT: a light document with dark chart panels.
   *
   * The charts are drawn for a dark app -- chart-svg.ts paints its text at
   * #e4e4ef and its grid at #2a2a3a, as inline fill ATTRIBUTES rather than CSS,
   * for a background it does not paint itself. On white paper that is invisible
   * ink on invisible lines. Two ways out: recolour every element by CSS
   * selector, which means guessing which <text> is a title and which is an axis
   * label and breaking silently when the renderer changes; or give the chart
   * the dark panel it was drawn for. The second is one rule, cannot rot, and
   * reads as deliberate -- a dark figure in a light report is an ordinary thing
   * to see.
   *
   * print-color-adjust is what stops the browser helpfully dropping those
   * backgrounds to save ink, which would restore exactly the problem.
   */
  @media print {
    @page { size: A4; margin: 14mm; }

    :root {
      --bg: #ffffff;
      --surface: #ffffff;
      --surface-hover: #f2f3f5;
      --border: #c9ccd2;
      --text: #14181f;
      --text-muted: #5a6068;
    }

    html, body { background: #fff; color: #14181f; }

    /* Screen furniture. None of it means anything on paper, and the rating
       buttons are actively misleading -- they look pressable in a PDF. */
    header, nav, .run-actions, .rec-actions, .png-stage { display: none !important; }

    .container { max-width: none; padding: 0; }

    .print-title {
      display: block !important;
      font-size: 11pt;
      line-height: 1.45;
      color: #14181f;
      padding-bottom: 8px;
      margin-bottom: 14px;
      border-bottom: 2px solid #14181f;
    }
    .print-title strong { font-size: 15pt; }

    /* The date range is in the masthead now; repeating it as a heading two
       lines below wastes the top of the page. */
    .run-head { display: none !important; }

    /* History is a <details>; whether it prints should not depend on whether
       somebody happened to click it open. This week is the document. */
    details.history { display: none !important; }

    .rec {
      border: 1px solid #c9ccd2;
      border-left: 3px solid #b06a12;
      break-inside: avoid;
      page-break-inside: avoid;
      margin-bottom: 10mm;
    }
    .rec.dismissed { opacity: 1; }
    .rec-body th { background: #f2f3f5; }

    .rec-body svg {
      background: #14141c;
      border-radius: 6px;
      padding: 6px;
      break-inside: avoid;
      page-break-inside: avoid;
    }

    /* One recommendation on its own, when that is what was asked for. Set on
       <body> so the rule is a single selector rather than a pass over the DOM
       toggling styles that then have to be put back. */
    body.print-one .rec:not(.print-target),
    body.print-one .venue-head,
    body.print-one .withheld { display: none !important; }

    * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
  }
</style>
</head>
<body>
  <header>
    <div class="logo"></div>
    <div>
      <h1>Weekly Briefing</h1>
      <div class="subtitle">The Dandy Collection</div>
    </div>
    <nav>
      <a href="/">Chat</a>
      <a href="/briefing.html" class="active">Briefing</a>
      <a href="/admin.html" id="admin-link" style="display:none">Admin</a>
      <a href="#" id="logout-link">Logout</a>
    </nav>
  </header>

  <div class="container" id="app">
    <div class="loading">Loading...</div>
  </div>

<script>
let token = null;
let myVenues = [];

(async function init() {
  const cfg = await fetch('/api/config').then(r => r.json());
  if (!cfg.supabaseUrl || !cfg.supabaseAnonKey) {
    document.getElementById('app').innerHTML = '<div class="loading">Auth not configured.</div>';
    return;
  }

  const { createClient } = await import('https://esm.sh/@supabase/supabase-js@2');
  const supabase = createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);

  const { data: { session } } = await supabase.auth.getSession();
  if (!session) { window.location.href = '/login.html'; return; }
  token = session.access_token;

  const meRes = await fetch('/api/me', { headers: { Authorization: 'Bearer ' + token } });
  if (!meRes.ok) { window.location.href = '/login.html'; return; }
  const me = await meRes.json();
  myVenues = me.venues || [];
  if (me.isOwner) document.getElementById('admin-link').style.display = '';

  document.getElementById('logout-link').addEventListener('click', async (e) => {
    e.preventDefault();
    await supabase.auth.signOut();
    window.location.href = '/login.html';
  });

  await load();
})();

async function load() {
  const app = document.getElementById('app');

  let payload;
  try {
    const res = await fetch('/api/recommendations', { headers: { Authorization: 'Bearer ' + token } });
    if (!res.ok) {
      app.innerHTML = '<div class="empty"><strong>Could not load the briefing.</strong>The chat still works — this page is an addition, not a gate on it.</div>';
      return;
    }
    payload = await res.json();
  } catch (e) {
    app.innerHTML = '<div class="empty"><strong>Could not load the briefing.</strong>' + escapeHtml(String(e.message || e)) + '</div>';
    return;
  }

  const recs = payload.recommendations || [];

  if (recs.length === 0) {
    /**
     * "None yet" and "a quiet week" are different facts and the API cannot
     * tell them apart, so this says the honest thing rather than guessing at
     * the friendlier one. An engine with permission to say nothing needs a
     * reader who knows silence is a valid answer.
     */
    app.innerHTML =
      '<div class="empty"><strong>No briefing published yet.</strong>' +
      'Recommendations are written once a week, on Monday night. A week where nothing was worth raising ' +
      'produces no briefing at all — that is a valid outcome, not a fault.</div>';
    return;
  }

  /**
   * Grouped by the PERIOD it covers, newest first.
   *
   * The chat panel only ever showed the latest run, deliberately: stacking four
   * weeks into one panel is how a briefing becomes a backlog. On a page of its
   * own history has somewhere to live, so it is kept — but collapsed, and
   * subordinate to this week.
   */
  const byPeriod = new Map();
  for (const r of recs) {
    const key = r.period_start + '|' + r.period_end;
    if (!byPeriod.has(key)) byPeriod.set(key, []);
    byPeriod.get(key).push(r);
  }

  const periods = [...byPeriod.entries()].sort((a, b) => b[0].localeCompare(a[0]));
  const [latestKey, latestRecs] = periods[0];

  let html = renderPeriod(latestKey, latestRecs, payload.withheld_for_role || 0, true);

  if (periods.length > 1) {
    html += '<details class="history"><summary>Earlier briefings (' + (periods.length - 1) + ')</summary>';
    for (const [key, rows] of periods.slice(1)) html += renderPeriod(key, rows, 0, false);
    html += '</details>';
  }

  app.innerHTML = html;
}

function renderPeriod(key, rows, withheld, isLatest) {
  const [start, end] = key.split('|');
  const venues = [...new Set(rows.map(r => r.venue))].sort();

  /**
   * A masthead that only exists on paper.
   *
   * The screen header is hidden when printing -- it is navigation, and a nav
   * bar in a PDF is furniture nobody can click. But that left the document
   * opening on a bare date range with nothing saying what it was or whose it
   * was, and this file is meant to be forwarded to people who have never seen
   * the app. The venue names come from the rows rather than from the reader's
   * grants, so a single-venue manager's PDF names their venue too.
   */
  let html =
    '<div class="print-title">' +
      '<strong>Weekly Briefing</strong> · The Dandy Collection<br>' +
      escapeHtml(venues.join(', ')) + ' · ' + escapeHtml(start) + ' to ' + escapeHtml(end) +
    '</div>' +
    '<div class="run-head"><h2>' + escapeHtml(start) + ' to ' + escapeHtml(end) + '</h2>' +
    '<span class="when">' + rows.length + ' recommendation' + (rows.length === 1 ? '' : 's') +
    (venues.length > 1 ? ' across ' + venues.length + ' venues' : '') + '</span>' +
    // Only on the current briefing. Printing an archived week is a different
    // intention and the print stylesheet hides the history section anyway, so a
    // button there would produce a blank page.
    (isLatest ? '<div class="run-actions"><button class="share-btn" onclick="printBriefing()">Download PDF</button></div>' : '') +
    '</div>';

  // One venue per section when the reader can see more than one. A mixed list
  // makes the reader do the grouping, and outlet problems have outlet owners.
  if (venues.length > 1) {
    for (const venue of venues) {
      html += '<div class="venue-head">' + escapeHtml(venue) + '</div>';
      html += rows.filter(r => r.venue === venue).map(renderRecommendation).join('');
    }
  } else {
    html += rows.map(renderRecommendation).join('');
  }

  /**
   * Say when something was withheld.
   *
   * /api/recommendations counts what the reader's role may not see. A briefing
   * that silently drops a finding looks identical to one that had nothing to
   * say, and the difference matters to whoever is reading it.
   */
  if (withheld > 0) {
    html += '<div class="withheld">' + withheld + ' recommendation' + (withheld === 1 ? ' was' : 's were') +
      ' withheld because they touch data your role cannot see. Ask an owner if you need them.</div>';
  }

  return html;
}

function renderRecommendation(r) {
  const charts = (r.charts || []).map(c => '<div>' + c.svg + '</div>').join('');
  return '' +
    '<div class="rec' + (r.status === 'dismissed' ? ' dismissed' : '') + '" id="rec-' + r.id + '">' +
      '<div class="rec-head">' +
        '<div class="rec-headline">' + escapeHtml(r.headline) + '</div>' +
        '<div class="rec-meta">' +
          '<span class="rec-tag">' + escapeHtml(r.domain) + '</span>' +
          '<span class="rec-confidence">confidence ' + Number(r.confidence).toFixed(2) + '</span>' +
        '</div>' +
      '</div>' +
      '<div class="rec-body">' + renderMarkdown(r.body || '') + charts + '</div>' +
      '<div class="rec-actions">' +
        '<button class="rec-btn' + (r.status === 'acted_on' ? ' on' : '') + '" onclick="rateRec(\'' + r.id + '\', {status:\'acted_on\'}, this)">Acted on</button>' +
        '<button class="rec-btn' + (r.rating === 'useful' ? ' on' : '') + '" onclick="rateRec(\'' + r.id + '\', {rating:\'useful\'}, this)">Useful</button>' +
        '<button class="rec-btn' + (r.rating === 'not_useful' ? ' on' : '') + '" onclick="rateRec(\'' + r.id + '\', {rating:\'not_useful\'}, this)">Not useful</button>' +
        '<button class="rec-btn' + (r.rating === 'wrong' ? ' on' : '') + '" onclick="rateRec(\'' + r.id + '\', {rating:\'wrong\', status:\'dismissed\'}, this)">Wrong</button>' +
        '<button class="share-btn" onclick="printOne(\'' + r.id + '\')">PDF</button>' +
        '<button class="share-btn" onclick="shareImage(\'' + r.id + '\', this)">Image</button>' +
        '<span class="rec-note">' + (r.evidence || []).length + ' quer' + ((r.evidence || []).length === 1 ? 'y' : 'ies') + ' behind this</span>' +
      '</div>' +
    '</div>';
}

/* --- taking a briefing away with you ------------------------------------ */

/**
 * The whole briefing as a PDF, via the browser's own print pipeline.
 *
 * NOT a server-rendered PDF, deliberately. Rendering it on Railway would mean
 * putting Chromium in the container that serves the chat -- about 300MB, a
 * slower cold start, and a new way for the chat to fail -- to produce a
 * document the browser already knows how to make. The charts are inline SVG, so
 * printing gives vector-sharp figures and text that stays selectable and
 * searchable in the PDF, which a rendered image never is.
 *
 * On Android Chrome this opens the print sheet where "Save as PDF" is the first
 * destination; the file then shares to WhatsApp like any other.
 */
function printBriefing() {
  document.body.classList.remove('print-one');
  window.print();
}

/**
 * One recommendation on its own.
 *
 * A class on <body> plus one on the card, rather than walking the DOM hiding
 * siblings: the print stylesheet holds the rule, and cleanup is removing two
 * class names instead of restoring styles that a failed print would leave
 * behind.
 *
 * afterprint fires on cancel as well as on save, which is what makes it the
 * right place to undo this -- a timer would either race a slow print sheet or
 * leave the page in print-one state if the user thought about it too long.
 */
function printOne(id) {
  const card = document.getElementById('rec-' + id);
  if (!card) return;

  card.classList.add('print-target');
  document.body.classList.add('print-one');

  const cleanup = () => {
    card.classList.remove('print-target');
    document.body.classList.remove('print-one');
    window.removeEventListener('afterprint', cleanup);
  };
  window.addEventListener('afterprint', cleanup);

  window.print();
}

/**
 * One recommendation as a PNG, for the chat apps where the work actually gets
 * passed on.
 *
 * WHY AN IMAGE AT ALL, when a PDF exists. A PDF arrives in WhatsApp as an
 * attachment with a filename, and an attachment on a phone between services is
 * a thing nobody opens. An image previews in the thread, so the recommendation
 * is read where it lands. The cost is real and worth stating: the text stops
 * being selectable, searchable or translatable, so this is the sharing format
 * and the PDF is the keeping format.
 *
 * BUILT ON A CANVAS BY HAND rather than with a DOM-to-image library. The card
 * is a headline, some prose and a chart -- laying that out is a few dozen lines
 * with no dependency, no CDN, and no surprises about which CSS a library does
 * and does not understand. The alternative pulls a script into a page that
 * serves venue data.
 */
async function shareImage(id, btn) {
  const card = document.getElementById('rec-' + id);
  if (!card) return;

  const label = btn.textContent;
  btn.textContent = 'Building...';
  btn.classList.add('working');

  try {
    const blob = await recommendationPng(card);
    const name = 'sauron-' + (card.querySelector('.rec-headline')?.textContent || 'recommendation')
      .toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 60) + '.png';
    const file = new File([blob], name, { type: 'image/png' });

    /**
     * The share sheet first, a download second.
     *
     * On a phone, sharing straight to WhatsApp is the whole point and a
     * download means finding the file afterwards. canShare({files}) is the only
     * honest test -- the API exists on desktop Chrome without file support, so
     * checking for navigator.share alone throws on the platform where the
     * fallback matters most.
     */
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file] });
    } else {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = name;
      a.click();
      // Revoked on a turn of the event loop, not immediately: Safari cancels an
      // in-flight download when the object URL disappears under it.
      setTimeout(() => URL.revokeObjectURL(url), 10000);
    }
  } catch (e) {
    // AbortError is the user closing the share sheet. That is not a failure and
    // must not be reported as one.
    if (e && e.name !== 'AbortError') {
      console.error('[briefing] image export failed', e);
      alert('Could not build the image. Use the PDF button instead — it does not depend on this.');
    }
  } finally {
    btn.textContent = label;
    btn.classList.remove('working');
  }
}

const PNG_W = 1080;           /* WhatsApp shows this at full width without resampling. */
const PNG_PAD = 48;
const PNG_BG = '#14141f';
const PNG_TEXT = '#e4e4ef';
const PNG_MUTED = '#8888a0';
const PNG_ACCENT = '#e8933a';

/** Wrap text to a width, returning the lines. */
function wrapText(ctx, text, maxWidth) {
  const lines = [];
  for (const paragraph of String(text).split('\n')) {
    if (!paragraph.trim()) { lines.push(''); continue; }
    let line = '';
    for (const word of paragraph.split(/\s+/)) {
      const next = line ? line + ' ' + word : word;
      if (ctx.measureText(next).width > maxWidth && line) {
        lines.push(line);
        line = word;
      } else {
        line = next;
      }
    }
    if (line) lines.push(line);
  }
  return lines;
}

/**
 * An SVG string to an Image, at a known size.
 *
 * THE WIDTH ATTRIBUTE HAS TO BE REWRITTEN. chart-svg.ts emits
 * `width="100%"` with a viewBox and no height, which is right for a responsive
 * page and meaningless to an Image: a percentage has nothing to be a percentage
 * OF, and browsers fall back to a default box that is not the chart's shape. So
 * the viewBox is read and concrete pixel dimensions are set before serialising.
 */
function svgToImage(svgText, width) {
  const doc = new DOMParser().parseFromString(svgText, 'image/svg+xml');
  const svg = doc.documentElement;
  const box = (svg.getAttribute('viewBox') || '0 0 720 360').split(/[\s,]+/).map(Number);
  const ratio = box[3] > 0 ? box[3] / box[2] : 0.5;
  const height = Math.round(width * ratio);

  svg.setAttribute('width', String(width));
  svg.setAttribute('height', String(height));

  const serialised = new XMLSerializer().serializeToString(svg);
  const url = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(serialised);

  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve({ img: img, width: width, height: height });
    // A chart that will not load loses the chart, not the image. The caller
    // treats a rejection as "draw the text without it".
    img.onerror = () => reject(new Error('chart image failed to load'));
    img.src = url;
  });
}

async function recommendationPng(card) {
  const headline = card.querySelector('.rec-headline')?.textContent?.trim() || '';
  const tag = card.querySelector('.rec-tag')?.textContent?.trim() || '';
  const confidence = card.querySelector('.rec-confidence')?.textContent?.trim() || '';

  /**
   * The body as plain text, from the RENDERED element.
   *
   * Reading textContent off the DOM rather than re-parsing the markdown means
   * the image says exactly what the page says. A table becomes run-together
   * text, which is the honest limit of this format -- the PDF is where a table
   * survives, and the button beside this one is how you get it.
   */
  const bodyEl = card.querySelector('.rec-body');
  const paragraphs = [...(bodyEl?.querySelectorAll('p, li, h2, h3, h4') || [])]
    .map(el => el.textContent.trim())
    .filter(Boolean);
  const body = paragraphs.join('\n\n');

  // Charts first, because their height decides the canvas height.
  const svgs = [...(bodyEl?.querySelectorAll('svg') || [])];
  const chartW = PNG_W - PNG_PAD * 2;
  const charts = [];
  for (const svg of svgs) {
    try {
      charts.push(await svgToImage(svg.outerHTML, chartW));
    } catch (e) {
      console.warn('[briefing] a chart could not be rasterised; the image will omit it', e);
    }
  }

  // Measured on a scratch context first: the canvas cannot be sized until the
  // text has been wrapped, and wrapping needs a context with the right fonts.
  const scratch = document.createElement('canvas').getContext('2d');
  const FONT = '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';

  scratch.font = '600 40px ' + FONT;
  const headlineLines = wrapText(scratch, headline, chartW);

  scratch.font = '26px ' + FONT;
  const bodyLines = wrapText(scratch, body, chartW);

  const HEAD_LH = 52, BODY_LH = 40;
  let height = PNG_PAD
    + headlineLines.length * HEAD_LH
    + 18
    + 32                                    /* the tag row */
    + 24
    + bodyLines.length * BODY_LH
    + charts.reduce((sum, c) => sum + c.height + 28, 0)
    + 30                                    /* the footer line */
    + PNG_PAD;

  const canvas = document.createElement('canvas');
  canvas.width = PNG_W;
  canvas.height = Math.round(height);
  const ctx = canvas.getContext('2d');

  ctx.fillStyle = PNG_BG;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // The accent rule down the left, so the image is recognisably the same object
  // as the card it came from.
  ctx.fillStyle = PNG_ACCENT;
  ctx.fillRect(0, 0, 8, canvas.height);

  let y = PNG_PAD + 8;

  ctx.fillStyle = PNG_TEXT;
  ctx.font = '600 40px ' + FONT;
  ctx.textBaseline = 'top';
  for (const line of headlineLines) { ctx.fillText(line, PNG_PAD, y); y += HEAD_LH; }

  y += 18;
  ctx.fillStyle = PNG_MUTED;
  ctx.font = '24px ' + FONT;
  ctx.fillText([tag, confidence].filter(Boolean).join('   ·   '), PNG_PAD, y);
  y += 32 + 24;

  ctx.fillStyle = PNG_TEXT;
  ctx.font = '26px ' + FONT;
  for (const line of bodyLines) { ctx.fillText(line, PNG_PAD, y); y += BODY_LH; }

  for (const chart of charts) {
    y += 28;
    // The chart is drawn for a dark app and carries no background of its own.
    ctx.fillStyle = '#14141c';
    ctx.fillRect(PNG_PAD, y, chart.width, chart.height);
    ctx.drawImage(chart.img, PNG_PAD, y, chart.width, chart.height);
    y += chart.height;
  }

  /**
   * Where it came from, on the image itself.
   *
   * An image gets forwarded past the person it was sent to, and a set of
   * figures with no source attached is exactly what this product exists to stop
   * people acting on.
   */
  y += 30;
  ctx.fillStyle = PNG_MUTED;
  ctx.font = '22px ' + FONT;
  ctx.fillText('Sauron · The Dandy Collection · ' + new Date().toISOString().split('T')[0], PNG_PAD, y);

  return new Promise((resolve, reject) => {
    canvas.toBlob(blob => {
      // toBlob hands back null on a tainted canvas. It should not happen -- the
      // SVG is inlined as a data URL with no external references -- but a null
      // here would otherwise surface as a File constructor error three frames
      // away from the cause.
      blob ? resolve(blob) : reject(new Error('canvas could not be exported — the chart may have tainted it'));
    }, 'image/png');
  });
}

async function rateRec(id, patch, btn) {
  // Marked immediately. A rating button that waits on a round trip gets
  // pressed twice, and the second press is the one nobody meant.
  const row = btn.closest('.rec');
  if (patch.rating) {
    row.querySelectorAll('.rec-btn').forEach(b => {
      if (b.textContent !== 'Acted on') b.classList.remove('on');
    });
  }
  btn.classList.add('on');
  if (patch.status === 'dismissed') row.classList.add('dismissed');

  try {
    await fetch('/api/recommendations/' + id + '/rate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
      body: JSON.stringify(patch),
    });
  } catch (e) {
    // Nothing to roll back to that would be clearer than the state shown.
  }
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

/**
 * The same renderer the chat uses, and the same reasoning behind it: this
 * writes into innerHTML, so a URL is an attribute in a live document rather
 * than text. Both links and images are allowlisted to https and quotes are
 * stripped, because a recommendation body is model-written prose.
 */
function renderMarkdown(text) {
  let html = text;

  html = html.replace(/^#### (.+)$/gm, '<h4>$1</h4>');
  html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
  html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');

  const safeUrl = u => (/^https:\/\//i.test(u) ? u.replace(/["'<>]/g, '') : '');

  html = html.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, (match, alt, url) => {
    const safe = safeUrl(url);
    if (!safe) return '';
    const altText = String(alt).replace(/["'<>]/g, '');
    return '<img src="' + safe + '" alt="' + altText + '" loading="lazy" referrerpolicy="no-referrer" style="max-width:100%">';
  });

  html = html.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (match, linkText, url) => {
    const safe = safeUrl(url);
    if (!safe) return linkText;
    return '<a href="' + safe + '" target="_blank" rel="noopener noreferrer">' + linkText + '</a>';
  });

  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');

  // Only the leading and trailing empties are dropped -- an empty cell in the
  // MIDDLE is a real column, and discarding it shifts every later value one
  // column left.
  function splitTableRow(row) {
    const parts = row.split('|');
    if (parts.length && parts[0].trim() === '') parts.shift();
    if (parts.length && parts[parts.length - 1].trim() === '') parts.pop();
    return parts.map(c => c.trim());
  }

  html = html.replace(/^(\|.+\|)\n(\|[-| :]+\|)\n((?:\|.+\|\n?)*)/gm, (match, headerRow, sepRow, bodyRows) => {
    const headers = splitTableRow(headerRow);
    let table = '<table><thead><tr>';
    headers.forEach(h => { table += '<th>' + h + '</th>'; });
    table += '</tr></thead><tbody>';
    bodyRows.trim().split('\n').forEach(row => {
      if (!row.trim()) return;
      const cells = splitTableRow(row);
      while (cells.length < headers.length) cells.push('');
      table += '<tr>';
      for (let i = 0; i < headers.length; i++) table += '<td>' + cells[i] + '</td>';
      table += '</tr>';
    });
    table += '</tbody></table>';
    return table;
  });

  html = html.replace(/^- (.+)$/gm, '<li>$1</li>');
  html = html.replace(/(<li>.*<\/li>\n?)+/g, '<ul>$&</ul>');
  html = html.replace(/^\d+\. (.+)$/gm, '<li>$1</li>');

  html = html.split('\n\n').map(block => {
    block = block.trim();
    if (!block) return '';
    if (block.startsWith('<h') || block.startsWith('<ul') || block.startsWith('<ol') || block.startsWith('<table') || block.startsWith('<img')) return block;
    return '<p>' + block.replace(/\n/g, '<br>') + '</p>';
  }).join('');

  return html;
}
</script>
