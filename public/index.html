<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - Sauron</title>
<!--
  Start the auth client downloading while the HTML is still being parsed. A
  dynamic import() is invisible to the preload scanner, so without this the 60 KB
  download cannot begin until the whole document has parsed. See
  src/frontend/pages.test.ts, which asserts this on every page that signs
  somebody in.
-->
<link rel="modulepreload" href="/vendor/supabase.js">
<!--SAURON_CONFIG-->
<link rel="modulepreload" href="/terms-gate.js">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0a0a0f;
    --surface: #14141f;
    --surface-hover: #1a1a2a;
    --border: #2a2a3a;
    --text: #e4e4ef;
    --text-muted: #8888a0;
    --accent: #e8933a;
    --accent-dim: #c47520;
    --error: #e84040;
    --success: #40c060;
  }

  /* `hidden` works through the BROWSER's stylesheet, so any author rule that
     sets display beats it. That cost a shipped bug once -- a panel with
     `display: flex` sat permanently over the chat header. Asserted in
     pages.test.ts for any page using the attribute. */
  [hidden] { display: none !important; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  header {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-wrap: wrap;
  }
  .logo {
    width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
    background: radial-gradient(circle at 35% 35%, var(--accent), var(--accent-dim) 60%, #5a2f08);
  }
  header h1 { font-size: 15px; font-weight: 600; }
  .subtitle { font-size: 11px; color: var(--text-muted); }
  header nav { margin-left: auto; display: flex; gap: 14px; font-size: 13px; }
  header nav a { color: var(--text-muted); text-decoration: none; }
  header nav a.active, header nav a:hover { color: var(--accent); }

  main { max-width: 760px; margin: 0 auto; padding: 16px; }

  .loading { color: var(--text-muted); padding: 40px 0; text-align: center; font-size: 14px; }

  /* --- venue switcher ------------------------------------------------- */
  .venues { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .venue-chip {
    padding: 6px 12px; border-radius: 999px; font-size: 13px; cursor: pointer;
    border: 1px solid var(--border); background: var(--surface); color: var(--text-muted);
  }
  .venue-chip.on { border-color: var(--accent); color: var(--accent); background: rgba(232,147,58,0.08); }

  /* --- the window label ----------------------------------------------- */
  .window { font-size: 13px; color: var(--text-muted); margin-bottom: 14px; }
  .window strong { color: var(--text); font-weight: 600; }
  .window .thin { color: var(--accent); }

  /* --- headline tiles -------------------------------------------------- */
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 16px; }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
  .tile .label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); }
  .tile .value { font-size: 24px; font-weight: 600; line-height: 1.25; margin-top: 2px; }
  .tile .delta { font-size: 12px; margin-top: 2px; }
  .up { color: var(--success); }
  .down { color: var(--error); }
  .flat, .unknown { color: var(--text-muted); }

  /* --- the week's line -------------------------------------------------- */
  .chart { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-bottom: 16px; }
  .chart h2 { font-size: 13px; font-weight: 600; margin-bottom: 10px; }
  .chart svg { width: 100%; height: auto; display: block; }

  /* --- detail table ----------------------------------------------------- */
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--border); }
  th { font-weight: 600; font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
  td:last-child, th:last-child { text-align: right; font-variant-numeric: tabular-nums; }
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; margin-bottom: 16px; }
  .panel > h2 { font-size: 13px; font-weight: 600; padding: 12px 14px 8px; }
  .panel table tr:last-child td { border-bottom: none; }

  /* The definition line. Smaller, muted, visibly subordinate to the figures --
     it is reference material you read once and then stop seeing. Same rule and
     same class as the chat and the briefing. */
  .figure-note {
    font-size: 0.8em; line-height: 1.5; color: var(--text-muted);
    font-style: normal; padding: 8px 14px 12px;
  }

  /* --- forward book ------------------------------------------------------ */
  .book { display: flex; gap: 6px; overflow-x: auto; padding: 4px 0 2px; }
  .book .day {
    flex: 0 0 auto; min-width: 58px; text-align: center;
    border: 1px solid var(--border); border-radius: 8px; padding: 8px 6px; background: var(--bg);
  }
  .book .day .dow { font-size: 10px; color: var(--text-muted); text-transform: uppercase; }
  .book .day .n { font-size: 17px; font-weight: 600; }
  .book .day.today { border-color: var(--accent); }
  /* A day the venue is shut. Said in words, never as a 0 -- Firangi closes
     every Sunday, and a zero in a row of covers reads as nobody having booked.
     Same rule as plotting a closed day as a gap rather than a zero bar. */
  .book .day.shut { opacity: 0.55; }
  .book .day .shut-label { font-size: 11px; font-weight: 500; color: var(--text-muted); }
  .figure-note a { color: var(--accent); }

  /* --- advice ------------------------------------------------------------ */
  .rec { border-bottom: 1px solid var(--border); padding: 12px 14px; }
  .rec:last-child { border-bottom: none; }
  .rec-venue { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .rec-headline { font-size: 14px; font-weight: 600; color: var(--accent); margin: 2px 0 6px; }
  .rec-body { font-size: 13px; }
  .rec-body p { margin-bottom: 8px; }
  /* `display: block; overflow-x: auto` so a wide recommendation table scrolls
     itself instead of widening the whole page on a phone. These tables carry
     no min-width, so the table may be its own scrolling box -- the admin
     page's .table-scroll wrapper is only needed where a minimum exists. */
  .rec-body table { border-collapse: collapse; margin: 8px 0; font-size: 12px; width: 100%; display: block; overflow-x: auto; }
  .rec-body th, .rec-body td { border: 1px solid var(--border); padding: 5px 8px; text-align: left; }
  .rec-body th { background: var(--surface-hover); }
  .rec-body svg { max-width: 100%; height: auto; }
  .rec-body ul, .rec-body ol { margin: 8px 0 8px 18px; }
  .rec-body li { margin: 4px 0; }
  .rec-body a { color: var(--accent); }

  /* --- ask box ------------------------------------------------------------ */
  .ask { display: flex; gap: 8px; margin-bottom: 24px; }
  .ask input {
    flex: 1; min-width: 0; padding: 11px 14px; font-size: 15px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px; color: var(--text);
  }
  .ask input:focus { outline: none; border-color: var(--accent); }
  .ask button {
    padding: 11px 16px; font-size: 14px; border: none; border-radius: 10px;
    background: var(--accent); color: #1a1008; font-weight: 600; cursor: pointer;
  }

  .empty { color: var(--text-muted); font-size: 13px; padding: 14px; }

  .post-thumb { max-width: 100%; border-radius: 8px; vertical-align: middle; margin: 4px 6px 4px 0; }
  .post-thumb.expired { max-width: 0; max-height: 0; margin: 0; opacity: 0; }

  @media (max-width: 420px) {
    main { padding: 12px; }
    .tiles { grid-template-columns: 1fr 1fr; gap: 8px; }
    /* Three tiles in two columns leaves the last one stranded beside a hole.
       Let an odd last tile take the full width instead. */
    .tiles .tile:last-child:nth-child(odd) { grid-column: 1 / -1; }
    .tile .value { font-size: 20px; }
  }
</style>
</head>
<body>
  <header>
    <div class="logo"></div>
    <div>
      <h1>Dashboard</h1>
      <div class="subtitle">The Dandy Collection</div>
    </div>
    <nav>
      <a href="/" class="active">Dashboard</a>
      <a href="/chat.html">Chat</a>
      <a href="/plan.html">Plan</a>
      <a href="/admin.html" id="admin-link" style="display:none">Admin</a>
      <a href="#" id="logout-link">Logout</a>
    </nav>
  </header>

  <main id="app">
    <div class="loading">Loading…</div>
  </main>

<!--
  The ONE markdown renderer, shared by every page that shows an answer. A
  classic script so the global reaches an inline script and a module alike, and
  a src= so the preload scanner can start it during the parse.
-->
<script src="/markdown.js"></script>
<script>
let token = null;
let payload = null;
let selected = null;

(async function init() {
  // Both at once. The config is two public strings and the client is 60 KB;
  // serialising them paid for the round trip twice.
  const [cfg, { createClient }] = await Promise.all([
    window.__SAURON_CONFIG__ ?? fetch('/api/config').then(r => r.json()),
    import('/vendor/supabase.js'),
  ]);
  if (!cfg.supabaseUrl || !cfg.supabaseAnonKey) {
    document.getElementById('app').innerHTML = '<div class="loading">Auth not configured.</div>';
    return;
  }

  const supabase = createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) { window.location.href = '/login.html'; return; }
  token = session.access_token;

  /**
   * THE DATA STARTS NOW, not after the terms check and /api/me.
   *
   * The dashboard read is the slow one here -- it touches daily_operations and
   * reservations for two weeks across every venue in scope. Everything below
   * needs only the token, so none of it has any business being in front.
   */
  const dash = fetchDashboard();
  const recs = fetchRecommendations();
  const gate = import('/terms-gate.js');
  const mePromise = fetch('/api/me', { headers: { Authorization: 'Bearer ' + token } });

  const { enforceTerms } = await gate;
  const terms = await enforceTerms(token);

  const meRes = await mePromise;
  if (!meRes.ok) { window.location.href = '/login.html'; return; }
  const me = await meRes.json();
  if (me.isOwner) document.getElementById('admin-link').style.display = '';

  document.getElementById('logout-link').addEventListener('click', async (e) => {
    e.preventDefault();
    await supabase.auth.signOut();
    window.location.href = '/login.html';
  });

  /**
   * SPEED MUST NOT CHANGE AN ANSWER.
   *
   * Both requests above were issued before any acceptance existed, and the
   * server correctly refuses a reader who has not accepted the terms. If the
   * gate had to appear, the parallel requests were refused and have to be made
   * again; `enforceTerms` returns 'already' when it showed nothing, which is
   * the only way to tell the two cases apart.
   */
  const [data, recData] = terms === 'already'
    ? await Promise.all([dash, recs])
    : await Promise.all([fetchDashboard(), fetchRecommendations()]);

  render(data, recData);
})();

function fetchDashboard() {
  return fetch('/api/dashboard', { headers: { Authorization: 'Bearer ' + token } })
    .then(r => r.json().then(j => ({ ok: r.ok, status: r.status, body: j })))
    .catch(e => ({ ok: false, status: 0, body: { message: e.message } }));
}

function fetchRecommendations() {
  return fetch('/api/recommendations', { headers: { Authorization: 'Bearer ' + token } })
    .then(r => (r.ok ? r.json() : { recommendations: [] }))
    .catch(() => ({ recommendations: [] }));
}

const money = n => (n === null || n === undefined)
  ? '—'
  : '$' + Number(n).toLocaleString('en-SG', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
/**
 * A PER-UNIT figure keeps its cents. Spend per head and average check are
 * quoted to the cent everywhere else in this app -- $163.45, not $163 -- and
 * rounding them here would make the dashboard disagree with the answer you get
 * by asking the same question in the chat.
 */
const money2 = n => (n === null || n === undefined)
  ? '—'
  : '$' + Number(n).toLocaleString('en-SG', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const pct = n => (n === null || n === undefined) ? '—' : Number(n).toFixed(1) + '%';
const num = n => (n === null || n === undefined) ? '—' : Number(n).toLocaleString('en-SG');

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s == null ? '' : String(s);
  return d.innerHTML;
}

/**
 * A movement, rendered.
 *
 * `unknown` prints a reason rather than an arrow. A dash with no explanation
 * reads as a system fault; "no data last week" is a fact about the business.
 */
function delta(m, kind) {
  if (!m || m.direction === 'unknown') return '<span class="unknown">no comparison</span>';
  const sign = m.pct > 0 ? '+' : '';
  const body = kind === 'money'
    ? sign + money(m.delta) + ' (' + sign + m.pct.toFixed(1) + '%)'
    : sign + m.pct.toFixed(1) + '%';
  const arrow = m.direction === 'up' ? '▲' : m.direction === 'down' ? '▼' : '■';
  return '<span class="' + m.direction + '">' + arrow + ' ' + body + '</span>';
}

function render(res, recData) {
  const app = document.getElementById('app');

  if (!res.ok) {
    const msg = res.body && res.body.message ? res.body.message : 'Could not load the dashboard.';
    app.innerHTML = '<div class="loading">' + esc(msg) + '</div>';
    return;
  }

  payload = res.body;
  // An owner lands on the group; anybody with one venue lands on it.
  selected = payload.group ? 'group' : payload.venues[0].slug;
  draw(recData);
}

function draw(recData) {
  const w = payload.window;
  const all = payload.group ? [payload.group, ...payload.venues] : payload.venues;
  const v = all.find(x => x.slug === selected) || all[0];

  const chips = all.length > 1
    ? '<div class="venues">' + all.map(x =>
        '<button class="venue-chip' + (x.slug === selected ? ' on' : '') + '" data-slug="' + esc(x.slug) + '">' +
        esc(x.venue) + '</button>').join('') + '</div>'
    : '';

  /**
   * The window, spelled out, because the comparison is the one thing a reader
   * cannot verify from the numbers. "6 days vs the same 6 days" is what makes
   * the arrow trustworthy -- against a whole previous week it would show a fall
   * every day except Sunday.
   */
  const windowLine =
    '<div class="window">Week to date · <strong>' + fmtRange(w.current.start, w.current.end) + '</strong> · ' +
    (w.thin
      ? '<span class="thin">one day against one day — too thin to read as a trend</span>'
      : w.days + ' days against the same ' + w.days + ' days last week') +
    '</div>';

  const tiles =
    '<div class="tiles">' +
      tile('Net sales', money(v.net_sales), delta(v.change.net_sales, 'money')) +
      tile('Covers', num(v.covers), delta(v.change.covers)) +
      tile('Spend per head', v.avg_spend_per_head === null ? '—' : money2(v.avg_spend_per_head), delta(v.change.avg_spend_per_head)) +
    '</div>';

  const rows = [
    ['Gross sales', money(v.gross_sales)],
    ['Food', money(v.food_sales) + (v.food_pct === null ? '' : ' — ' + pct(v.food_pct))],
    ['Beverage', money(v.beverage_sales) + (v.food_pct === null ? '' : ' — ' + pct(100 - v.food_pct))],
    ['Discounts', money(v.total_discounts) + (v.discount_rate_pct === null ? '' : ' — ' + pct(v.discount_rate_pct))],
    ['Service charge', money(v.service_charge)],
    ['Net sales', money(v.net_sales)],
    ['Covers', num(v.covers)],
    ['Transactions', num(v.transactions)],
    ['Average check', v.avg_check === null ? '—' : money2(v.avg_check)],
    ['Trading days', v.trading_days + (v.closed_days.length ? ' (' + v.closed_days.length + ' closed)' : '')],
  ];

  const table =
    '<div class="panel"><h2>Week to date</h2><table><tbody>' +
    rows.map(r => '<tr><td>' + r[0] + '</td><td>' + r[1] + '</td></tr>').join('') +
    '</tbody></table>' +
    '<p class="figure-note">Gross = food + beverage, service charge excluded · ' +
    'Net sales = gross less discounts plus the 10% service charge, so it sits above gross · ' +
    'Discounts = item + order, as a share of gross · ' +
    'Spend per head = food &amp; beverage ÷ covers · Average check = revenue per bill</p></div>';

  document.getElementById('app').innerHTML =
    chips + windowLine + tiles + chartPanel(v) + table + bookPanel(v, w) +
    advicePanel(recData, v, w.today) + askBox(v);

  document.querySelectorAll('.venue-chip').forEach(b =>
    b.addEventListener('click', () => { selected = b.dataset.slug; draw(recData); }));

  const ask = document.getElementById('ask-input');
  const go = () => {
    const q = ask.value.trim();
    if (q) window.location.href = '/chat.html?q=' + encodeURIComponent(q);
  };
  document.getElementById('ask-go').addEventListener('click', go);
  ask.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
}

function tile(label, value, deltaHtml) {
  return '<div class="tile"><div class="label">' + label + '</div>' +
         '<div class="value">' + value + '</div>' +
         '<div class="delta">' + deltaHtml + '</div></div>';
}

/**
 * The week's daily line, drawn by hand.
 *
 * NO CHART LIBRARY. Nothing on any page loads from a third party, and a chart
 * of seven bars is a few dozen lines of SVG against a cold origin's DNS, TCP
 * and TLS on the critical path. The app already renders its own SVG charts in
 * src/ai/chart-svg.ts for the same reason.
 *
 * A CLOSED DAY IS A GAP, NOT A ZERO BAR. A zero draws as a collapse, and
 * Firangi closes every Sunday -- the chart layer already has this rule and the
 * dashboard must not disagree with it.
 */
function chartPanel(v) {
  const days = v.daily;
  if (!days.length) return '';

  const W = 320, H = 110, pad = 18;
  const max = Math.max(...days.map(d => d.net_sales ?? 0), 1);
  const bw = (W - pad * 2) / Math.max(days.length, 1);

  let bars = '';
  days.forEach((d, i) => {
    const x = pad + i * bw + bw * 0.18;
    const w = bw * 0.64;
    const label = new Date(d.date + 'T00:00:00Z').toLocaleDateString('en-SG', { weekday: 'narrow', timeZone: 'UTC' });
    if (d.net_sales === null) {
      bars += '<text x="' + (x + w / 2) + '" y="' + (H - pad - 4) + '" text-anchor="middle" ' +
              'font-size="9" fill="#8888a0">closed</text>';
    } else {
      const h = Math.max(1, (d.net_sales / max) * (H - pad * 2 - 10));
      bars += '<rect x="' + x + '" y="' + (H - pad - h) + '" width="' + w + '" height="' + h +
              '" rx="2" fill="#e8933a" opacity="0.85"></rect>';
    }
    bars += '<text x="' + (x + w / 2) + '" y="' + (H - 5) + '" text-anchor="middle" ' +
            'font-size="10" fill="#8888a0">' + esc(label) + '</text>';
  });

  return '<div class="chart"><h2>Net sales by day</h2>' +
         '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Net sales by day this week">' +
         bars + '</svg></div>';
}

/**
 * The forward book. Expected covers, never presented as achieved.
 *
 * Reservations are ingested about 60 days forward, so this is real data and not
 * a projection -- but today is part-done and the rest are bookings that have not
 * happened. The heading says "expected" for exactly that reason.
 */
function bookPanel(v, w) {
  if (!v.upcoming || !v.upcoming.length) return '';
  const days = v.upcoming.slice(0, 7).map(u => {
    const dow = new Date(u.date + 'T00:00:00Z').toLocaleDateString('en-SG', { weekday: 'short', timeZone: 'UTC' });
    const isToday = u.date === w.today;
    return '<div class="day' + (isToday ? ' today' : '') + (u.closed ? ' shut' : '') + '">' +
           '<div class="dow">' + esc(isToday ? 'Today' : dow) + '</div>' +
           '<div class="n">' + (u.closed ? '<span class="shut-label">Closed</span>' : u.covers) + '</div></div>';
  }).join('');
  return '<div class="panel"><h2>Expected covers, next 7 days</h2>' +
         '<div style="padding:0 14px 12px"><div class="book">' + days + '</div></div>' +
         '<p class="figure-note">Booked covers not yet cancelled, from SevenRooms. Today is part-done, so its figure includes guests already seated.</p></div>';
}

/**
 * The advice, and the period it is actually about.
 *
 * IT IS NOT ABOUT THIS WEEK, AND SAYING SO IS THE WHOLE POINT. The engine runs
 * on `lastCompleteWeek()` -- a Monday-to-Sunday that has already closed --
 * because a Tuesday dip is a Tuesday and only a quiet WEEK is news. The figures
 * above are week to date. Putting the two under a heading reading "this week's
 * advice" states something false and invites a reader to check the advice
 * against the numbers beside it, which will not reconcile because they are
 * different weeks.
 *
 * They are not in conflict once labelled. You review the week that closed and
 * act during the week in progress -- that IS the operating rhythm, and it only
 * reads as a contradiction when the period is left off.
 *
 * ONE PERIOD ONLY. /api/recommendations returns up to 60 rows ordered by
 * generated_at across EVERY period, so taking the top three could quietly mix
 * last week's advice with the week before's -- two periods under one heading,
 * which is the same defect one layer up. The latest period wins and the rest
 * are left for the briefing.
 *
 * AND A STALE ENGINE IS REPORTED RATHER THAN DRESSED UP. A complete week ends
 * between one and seven days before any given day, so a period older than ten
 * means the weekly run has not fired. Showing fortnight-old advice under a
 * fresh-looking heading is the failure this codebase keeps finding: it worked,
 * it looked fine, it was doing nothing.
 */
function advicePanel(recData, v, today) {
  const recs = (recData && recData.recommendations) || [];
  const mine = (v.slug === 'group' ? recs : recs.filter(r => r.venue_id === v.venue_id))
    .filter(r => r.status !== 'dismissed');

  const withheld = recData && recData.withheld_for_role
    ? '<p class="figure-note">' + recData.withheld_for_role + ' recommendation(s) are not shown for your role.</p>'
    : '';

  if (!mine.length) {
    return '<div class="panel"><h2>Advice</h2>' +
           '<div class="empty">Nothing outstanding. An engine that always has something to say is one nobody believes \u2014 a quiet week is a valid result.</div>' +
           withheld + '</div>';
  }

  // The most recently REVIEWED period, not the most recently generated row.
  const latest = mine.reduce((a, r) => (r.period_end > a ? r.period_end : a), '');
  const shown = mine.filter(r => r.period_end === latest).slice(0, 3);
  const start = shown.reduce((a, r) => (!a || r.period_start < a ? r.period_start : a), '');

  const ageDays = Math.round(
    (Date.parse(today + 'T00:00:00Z') - Date.parse(latest + 'T00:00:00Z')) / 86400000);

  const stale = ageDays > 10
    ? '<p class="figure-note" style="color:var(--accent)">The weekly run has not produced anything newer than this in ' +
      ageDays + ' days. Treat it as out of date and check the engine.</p>'
    : '';

  return '<div class="panel"><h2>Advice from the week just reviewed</h2>' +
    '<p class="figure-note" style="padding-bottom:4px">Covering <strong>' + fmtRange(start, latest) +
    '</strong> \u2014 a completed week, which is the only unit worth advising on. ' +
    'The figures above are this week so far, so the two will not tie: you review the closed week and act during this one.</p>' +
    shown.map(r =>
      '<div class="rec">' +
        '<div class="rec-venue">' + esc(r.venue) + (r.status === 'acted_on' ? ' \u00b7 acted on' : '') + '</div>' +
        '<div class="rec-headline">' + esc(r.headline) + '</div>' +
        '<div class="rec-body">' + renderMarkdown(r.body || '') + '</div>' +
      '</div>').join('') +
    stale + withheld +
    '<p class="figure-note"><a href="/briefing.html">Open the full briefing</a> to rate these or read the evidence behind them.</p>' +
    '</div>';
}

function askBox(v) {
  const name = v.slug === 'group' ? 'the group' : v.venue;
  return '<div class="ask">' +
    '<input id="ask-input" type="text" placeholder="Ask about ' + esc(name) + '…" ' +
    'autocomplete="off" autocapitalize="sentences">' +
    '<button id="ask-go">Ask</button></div>';
}

function fmtRange(a, b) {
  const f = d => new Date(d + 'T00:00:00Z').toLocaleDateString('en-SG', { day: 'numeric', month: 'short', timeZone: 'UTC' });
  return a === b ? f(a) : f(a) + ' – ' + f(b);
}
</script>
</body>
