<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Sauron</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0a0a0f;
    --surface: #14141f;
    --surface-hover: #1a1a2a;
    --border: #2a2a3a;
    --text: #e4e4ef;
    --text-muted: #8888a0;
    --accent: #e8933a;
    --accent-dim: #c47520;
    --error: #e84040;
    --success: #40c060;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }

  .logo {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: radial-gradient(circle, var(--accent) 0%, #8b3500 70%, #2a0e00 100%);
    box-shadow: 0 0 20px rgba(232, 147, 58, 0.3);
    flex-shrink: 0;
  }

  header h1 { font-size: 18px; font-weight: 600; }
  header .subtitle { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

  nav {
    margin-left: auto;
    display: flex;
    gap: 16px;
    font-size: 14px;
  }

  nav a { color: var(--text-muted); text-decoration: none; }
  nav a:hover, nav a.active { color: var(--accent); }

  .container {
    max-width: 960px;
    margin: 0 auto;
    padding: 24px 20px;
  }

  .section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    margin-bottom: 24px;
  }

  .section h2 {
    font-size: 16px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .invite-form {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }

  .invite-form input {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    outline: none;
    flex: 1;
    min-width: 180px;
  }

  .invite-form input:focus { border-color: var(--accent); }
  .invite-form input::placeholder { color: var(--text-muted); }

  .btn {
    background: var(--accent);
    color: #000;
    border: none;
    border-radius: 8px;
    padding: 10px 18px;
    font-size: 14px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: background 0.2s;
    white-space: nowrap;
  }

  .btn:hover { background: var(--accent-dim); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .btn-small {
    padding: 6px 12px;
    font-size: 12px;
    border-radius: 6px;
  }

  .btn-danger {
    background: var(--error);
    color: #fff;
  }

  .btn-danger:hover { background: #c03030; }

  .btn-outline {
    background: transparent;
    color: var(--text-muted);
    border: 1px solid var(--border);
  }

  .btn-outline:hover { border-color: var(--text-muted); color: var(--text); background: transparent; }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }

  th, td {
    padding: 10px 12px;
    text-align: left;
    border-bottom: 1px solid var(--border);
  }

  th {
    color: var(--text-muted);
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  tr:last-child td { border-bottom: none; }

  .role-badge {
    display: inline-block;
    padding: 3px 8px;
    border-radius: 4px;
    font-size: 12px;
    font-weight: 500;
  }

  .role-owner { background: rgba(232, 147, 58, 0.15); color: var(--accent); }
  .role-manager { background: rgba(100, 149, 237, 0.15); color: #6495ed; }
  .role-finance { background: rgba(64, 192, 96, 0.15); color: var(--success); }
  .role-staff { background: rgba(136, 136, 160, 0.15); color: var(--text-muted); }

  .role-actions {
    display: flex;
    gap: 6px;
    align-items: center;
    flex-wrap: wrap;
  }

  .user-actions {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  select {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 10px;
    color: var(--text);
    font-size: 12px;
    font-family: inherit;
    outline: none;
  }

  .toast {
    position: fixed;
    bottom: 20px;
    right: 20px;
    padding: 12px 20px;
    border-radius: 8px;
    font-size: 14px;
    z-index: 100;
    animation: slideIn 0.3s ease;
  }

  .toast.success { background: rgba(64, 192, 96, 0.9); color: #000; }
  .toast.error { background: rgba(232, 64, 64, 0.9); color: #fff; }

  @keyframes slideIn {
    from { transform: translateY(20px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  .system-card {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px;
    margin-bottom: 12px;
  }

  .system-card h4 {
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 8px;
  }

  .gap-item {
    font-size: 13px;
    padding: 4px 0;
    color: var(--error);
  }

  .no-gaps {
    font-size: 13px;
    color: var(--success);
  }

  .ingestion-row {
    font-size: 13px;
    padding: 4px 0;
    display: flex;
    gap: 12px;
  }

  .ingestion-row .status-ok { color: var(--success); }
  .ingestion-row .status-err { color: var(--error); }

  .loading {
    text-align: center;
    color: var(--text-muted);
    padding: 40px;
  }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 200;
  }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    width: 100%;
    max-width: 360px;
  }

  .modal h3 {
    font-size: 16px;
    margin-bottom: 16px;
  }

  .modal input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    outline: none;
    margin-bottom: 16px;
  }

  .modal input:focus { border-color: var(--accent); }

  .modal-btns {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
  }

  .drop-zone {
    border: 2px dashed var(--border);
    border-radius: 12px;
    padding: 36px 24px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
    margin-bottom: 12px;
  }

  .drop-zone:hover, .drop-zone.dragover {
    border-color: var(--accent);
    background: rgba(232, 147, 58, 0.04);
  }

  .drop-zone p { color: var(--text-muted); font-size: 13px; margin-top: 6px; }

  .drop-zone strong { color: var(--accent); font-size: 14px; }

  .file-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 13px;
    margin-bottom: 4px;
  }

  .file-item .fname { flex: 1; word-break: break-all; }
  .file-item .fsize { color: var(--text-muted); flex-shrink: 0; }
  .file-item .fstatus { flex-shrink: 0; font-size: 12px; padding: 2px 8px; border-radius: 4px; }
  .fstatus-pending { color: var(--text-muted); }
  .fstatus-ok { color: var(--success); background: rgba(64,192,96,0.1); }
  .fstatus-err { color: var(--error); background: rgba(232,64,64,0.1); }
  .fstatus-warn { color: #e8c840; background: rgba(232,200,64,0.1); }

  .file-item .fremove {
    background: none; border: none; color: var(--text-muted);
    cursor: pointer; font-size: 16px; padding: 0 4px;
  }

  .file-item .fremove:hover { color: var(--error); }

  .upload-actions { display: flex; gap: 10px; align-items: center; margin-top: 12px; }

  .upload-progress {
    height: 4px; background: var(--border); border-radius: 2px;
    margin-top: 12px; overflow: hidden; display: none;
  }

  .upload-progress .fill {
    height: 100%; background: var(--accent); border-radius: 2px;
    transition: width 0.3s; width: 0%;
  }

  .upload-summary {
    margin-top: 12px; padding: 12px;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 6px; font-size: 13px; display: none;
  }

  .upload-summary .ustat { display: flex; justify-content: space-between; padding: 3px 0; }
  .upload-summary .ustat .ulabel { color: var(--text-muted); }

  @media (max-width: 600px) {
    .invite-form { flex-direction: column; }
    .invite-form input { min-width: unset; }
    table { font-size: 13px; }
    th, td { padding: 8px 6px; }
    .drop-zone { padding: 24px 16px; }
  }
</style>
</head>
<body>
  <header>
    <div class="logo"></div>
    <div>
      <h1>Sauron Admin</h1>
      <div class="subtitle">The Dandy Collection</div>
    </div>
    <nav>
      <a href="/">Chat</a>
      <a href="/admin.html" class="active">Admin</a>
      <a href="#" id="logout-link">Logout</a>
    </nav>
  </header>

  <div class="container" id="app">
    <div class="loading">Loading...</div>
  </div>

<script>
let token = null;
let venues = [];
let currentUserId = null;

(async function init() {
  const cfg = await fetch('/api/config').then(r => r.json());
  if (!cfg.supabaseUrl || !cfg.supabaseAnonKey) {
    document.getElementById('app').innerHTML = '<div class="loading">Auth not configured.</div>';
    return;
  }

  const { createClient } = await import('https://esm.sh/@supabase/supabase-js@2');
  const supabase = createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);

  const { data: { session } } = await supabase.auth.getSession();
  if (!session) {
    window.location.href = '/login.html';
    return;
  }

  token = session.access_token;

  const meRes = await fetch('/api/me', { headers: { Authorization: 'Bearer ' + token } });
  if (!meRes.ok) {
    window.location.href = '/login.html';
    return;
  }

  const me = await meRes.json();
  currentUserId = me.id;
  if (!me.isOwner) {
    document.getElementById('app').innerHTML = '<div class="loading">Admin access required. You do not have the owner role.</div>';
    return;
  }

  document.getElementById('logout-link').addEventListener('click', async (e) => {
    e.preventDefault();
    await supabase.auth.signOut();
    window.location.href = '/login.html';
  });

  await loadAll();
})();

async function api(method, path, body) {
  const opts = {
    method,
    headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
  };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(path, opts);
  return res.json();
}

function fmtTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleString('en-SG', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false });
}

async function loadAll() {
  const [usersData, venuesData, systemData, notesData, xeroData, pendingData, alertsData] = await Promise.all([
    api('GET', '/admin/api/users'),
    api('GET', '/admin/api/venues'),
    api('GET', '/admin/api/system?days=3'),
    api('GET', '/admin/api/notes'),
    api('GET', '/admin/api/xero/connections'),
    api('GET', '/admin/api/notes?status=pending'),
    api('GET', '/admin/api/alerts'),
  ]);

  venues = venuesData.venues || [];
  render(usersData.users || [], systemData, notesData.notes || [], xeroData.connections || [], pendingData.notes || [], alertsData.alerts || []);
}

function render(users, system, notes, xeroConnections, pendingNotes, alerts) {
  const app = document.getElementById('app');
  app.innerHTML = '';

  // Add User section
  const inviteSection = el('div', 'section');
  inviteSection.innerHTML = `
    <h2>Add User</h2>
    <form class="invite-form" id="invite-form">
      <input type="email" id="invite-email" placeholder="Email address" required>
      <input type="text" id="invite-name" placeholder="Full name (optional)">
      <input type="password" id="invite-password" placeholder="Password" required style="min-width:140px">
      <button type="submit" class="btn">Create</button>
    </form>
  `;
  app.appendChild(inviteSection);

  document.getElementById('invite-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('invite-email').value.trim();
    const name = document.getElementById('invite-name').value.trim();
    const password = document.getElementById('invite-password').value;
    if (!email || !password) return;

    const res = await api('POST', '/admin/api/users/invite', { email, full_name: name, password });
    if (res.error) {
      toast('error', res.error);
    } else {
      toast('success', 'User created: ' + email);
      document.getElementById('invite-email').value = '';
      document.getElementById('invite-name').value = '';
      document.getElementById('invite-password').value = '';
      await loadAll();
    }
  });

  // Users table
  const usersSection = el('div', 'section');
  let tableHtml = `<h2>Users (${users.length})</h2>
    <table>
      <thead><tr><th>Name</th><th>Email</th><th>Venue Roles</th><th>Add Role</th><th></th></tr></thead>
      <tbody>`;

  for (const user of users) {
    const roles = (user.roles || []).map(r =>
      `<span class="role-badge role-${r.role}">${r.venue_name} - ${r.role}</span>
       <button class="btn btn-small btn-danger" onclick="removeRole('${r.id}')">x</button>`
    ).join(' ');

    const venueOpts = venues.map(v => `<option value="${v.id}">${v.name}</option>`).join('');
    const isSelf = user.id === currentUserId;

    tableHtml += `<tr>
      <td>${esc(user.full_name || '-')}</td>
      <td>${esc(user.email)}</td>
      <td><div class="role-actions">${roles || '<span style="color:var(--text-muted)">No roles</span>'}</div></td>
      <td>
        <div class="role-actions">
          <select id="venue-${user.id}">${venueOpts}</select>
          <select id="role-${user.id}">
            <option value="manager">Manager</option>
            <option value="staff">Staff</option>
            <option value="finance">Finance</option>
            <option value="owner">Owner</option>
          </select>
          <button class="btn btn-small" onclick="assignRole('${user.id}')">Add</button>
        </div>
      </td>
      <td>
        <div class="user-actions">
          <button class="btn btn-small btn-outline" onclick="showResetPassword('${user.id}', '${esc(user.email)}')">Reset pw</button>
          ${isSelf ? '' : `<button class="btn btn-small btn-danger" onclick="confirmDeleteUser('${user.id}', '${esc(user.email)}')">Delete</button>`}
        </div>
      </td>
    </tr>`;
  }

  tableHtml += '</tbody></table>';
  usersSection.innerHTML = tableHtml;
  app.appendChild(usersSection);

  // System health
  const sysSection = el('div', 'section');
  sysSection.innerHTML = '<h2>System Health</h2>';

  const gapsCard = el('div', 'system-card');
  gapsCard.innerHTML = '<h4>Data Gaps (last 3 days)</h4>';
  if (system.missing && system.missing.length > 0) {
    for (const gap of system.missing) {
      const gapEl = el('div', 'gap-item');
      gapEl.textContent = `${gap.venue} (${gap.date}): missing ${gap.missing.join(', ')}`;
      gapsCard.appendChild(gapEl);
    }
  } else {
    const ok = el('div', 'no-gaps');
    ok.textContent = 'No data gaps detected.';
    gapsCard.appendChild(ok);
  }
  sysSection.appendChild(gapsCard);

  /**
   * Is the Meta ingest still running?
   *
   * Placed second, above the error list, because it is the only card here
   * watching for the ABSENCE of work. Everything else on this page reports a
   * fault in something that happened; on 20 Aug 2026 the Ingest-Meta service
   * crashed on startup, ran nothing for hours, produced no error to list, and
   * was found by accident. Stories expire in about 24 hours and Meta serves no
   * history for followers_count, so an outage here destroys data rather than
   * delaying it.
   */
  const socialCard = el('div', 'system-card');
  socialCard.innerHTML = '<h4>Social Ingest</h4>';
  const social = system.social;
  if (!social) {
    const unknown = el('div', 'gap-item');
    unknown.textContent = 'Not reported — the server may be running an older build.';
    socialCard.appendChild(unknown);
  } else if (social.ok) {
    const ok = el('div', 'no-gaps');
    ok.textContent = social.checked === 0
      ? 'No active social accounts are mapped.'
      : `All ${social.checked} account(s) written within ${social.max_age_hours}h.`;
    socialCard.appendChild(ok);
  } else {
    for (const s of social.stale) {
      const row = el('div', 'gap-item');
      row.textContent = s.hours_stale === null
        ? `${s.venue} (${s.platform}): NEVER ingested`
        : `${s.venue} (${s.platform}): last written ${s.hours_stale}h ago`;
      socialCard.appendChild(row);
    }
    // The consequence, not just the fact. "Stale" on its own reads as a delay,
    // and this is the one job here whose downtime is not recoverable.
    const why = el('div', 'gap-item');
    why.style.color = 'var(--text-muted)';
    why.textContent = 'Stories expire after ~24h and followers_count has no history at Meta — these are lost, not delayed. Check the Ingest-Meta service on Railway.';
    socialCard.appendChild(why);
  }
  sysSection.appendChild(socialCard);

  const errCard = el('div', 'system-card');
  errCard.innerHTML = '<h4>Recent Errors</h4>';
  if (system.recent_errors && system.recent_errors.length > 0) {
    for (const err of system.recent_errors) {
      const row = el('div', 'ingestion-row');
      row.innerHTML = `<span class="status-err">${esc(err.status)}</span>
        <span>${esc(err.filename)}</span>
        <span style="color:var(--text-muted)">${esc(err.error)}</span>
        <span style="color:var(--text-muted)">${fmtTime(err.created_at)}</span>`;
      errCard.appendChild(row);
    }
  } else {
    const ok = el('div', 'no-gaps');
    ok.textContent = 'No recent errors.';
    errCard.appendChild(ok);
  }
  sysSection.appendChild(errCard);

  const ingCard = el('div', 'system-card');
  ingCard.innerHTML = '<h4>Recent Ingestions</h4>';
  if (system.recent_ingestions && system.recent_ingestions.length > 0) {
    for (const ing of system.recent_ingestions) {
      const row = el('div', 'ingestion-row');
      const cls = ing.status === 'success' ? 'status-ok' : 'status-err';
      row.innerHTML = `<span class="${cls}">${esc(ing.status)}</span>
        <span>${esc(ing.filename)}</span>
        <span style="color:var(--text-muted)">${ing.business_date || ''}</span>
        <span style="color:var(--text-muted)">${ing.row_count ? ing.row_count + ' rows' : ''}</span>
        <span style="color:var(--text-muted)">${fmtTime(ing.created_at)}</span>`;
      ingCard.appendChild(row);
    }
  }
  sysSection.appendChild(ingCard);

  app.appendChild(sysSection);

  // Reconciliation alerts. These are data problems, not job failures -- the
  // Monday cron kept working while reporting them, and showed as failed for
  // days because a non-zero exit was conflating the two.
  if (alerts && alerts.length > 0) {
    const a = el('div', 'section');
    // Collapsed by default. Expanded, five alerts filled the screen and the one
    // that mattered looked identical to four repeats of another.
    a.innerHTML = '<h2>Reconciliation alerts (' + alerts.length + ')</h2>' +
      '<p style="color:var(--text-muted);font-size:13px;margin-bottom:16px">Days where the numbers disagree &mdash; click one to see what moved. A post-lock change means Monday.com was edited after that month had closed (final from the 15th of the following month), so the edit was not taken and the two systems now hold different figures. Corrections made before close are applied normally and never appear here. Resolving clears every duplicate of the same finding.</p>' +
      alerts.map(function (al) {
        const changeRows = (al.changes || []).map(function (c) {
          return '<div style="font-size:12px;color:var(--text-muted)">' +
            escapeHtml(c.period) + ' &middot; ' + escapeHtml(c.field) + ': ' +
            '<span style="color:var(--error)">' + escapeHtml(String(c.from)) + '</span> &rarr; ' +
            '<span style="color:var(--success)">' + escapeHtml(String(c.to)) + '</span></div>';
        }).join('');
        const dupes = al.duplicates > 1
          ? '<span title="' + al.duplicates + ' identical alerts for this day" style="font-size:11px;color:var(--text-muted);border:1px solid var(--border);border-radius:4px;padding:0 5px;margin-left:8px">&times;' + al.duplicates + '</span>'
          : '';
        const diff = (al.difference !== null && al.difference !== undefined)
          ? '<span style="font-size:12px;color:var(--text-muted);margin-left:8px">$' + escapeHtml(String(al.difference)) + '</span>'
          : '';
        return '<details class="alert-card" data-id="' + al.id + '" style="border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:8px">' +
          '<summary style="cursor:pointer;font-size:13px">' +
            '<span style="font-weight:600">' + escapeHtml(al.venue || 'Unknown venue') + '</span>' +
            '<span style="color:var(--text-muted)"> &middot; ' + escapeHtml(al.business_date) +
            ' &middot; ' + escapeHtml(al.alert_type.replace(/_/g, ' ')) + '</span>' +
            dupes + diff +
          '</summary>' +
          '<div style="margin-top:10px">' +
            (changeRows || '<div style="font-size:12px;color:var(--text-muted)">No field-level detail recorded for this alert.</div>') +
            '<div style="display:flex;gap:6px;margin-top:8px;align-items:center">' +
              '<input class="al-note" placeholder="What did you decide? (optional)" style="flex:1;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:6px 10px;color:var(--text);font-size:12px;font-family:inherit">' +
              '<button class="al-resolve btn btn-small">Resolve</button>' +
            '</div>' +
          '</div></details>';
      }).join('');
    app.appendChild(a);

    a.querySelectorAll('.alert-card').forEach(function (card) {
      card.querySelector('.al-resolve').addEventListener('click', async function () {
        const res = await api('POST', '/admin/api/alerts/' + card.dataset.id + '/resolve', {
          notes: card.querySelector('.al-note').value || null,
        });
        if (res.error) { alert(res.error); return; }
        await loadAll();
      });
    });
  }

  // Review queue — notes captured from conversations, awaiting approval.
  // Nothing here has reached a prompt yet: the system must never write its own
  // lessons, because a confident wrong answer would become a stored fact.
  if (pendingNotes && pendingNotes.length > 0) {
    const q = el('div', 'section');
    q.innerHTML = '<h2>Awaiting review (' + pendingNotes.length + ')</h2>' +
      '<p style="color:var(--text-muted);font-size:13px;margin-bottom:16px">Captured from conversations. Nothing here is used by Sauron until you approve it. Edit as you approve — correcting it is the point of the queue.</p>' +
      pendingNotes.map(function (n) {
        return '<div class="pending-note" data-id="' + n.id + '" style="border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:10px">' +
          (n.source_question ? '<div style="color:var(--text-muted);font-size:12px;margin-bottom:6px">Asked: ' + escapeHtml(n.source_question) + '</div>' : '') +
          '<textarea class="pn-text" rows="3" style="width:100%">' + escapeHtml(n.note) + '</textarea>' +
          '<div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;align-items:center">' +
            '<span style="color:var(--text-muted);font-size:12px">' + (n.venues ? escapeHtml(n.venues.name) : 'All venues') + ' &middot; ' + escapeHtml(n.confidence) + '</span>' +
            '<select class="pn-port"><option value="dandy_specific">Specific to us</option><option value="universal">General F&amp;B truth</option></select>' +
            '<button class="pn-approve">Approve</button>' +
            '<button class="pn-reject">Reject</button>' +
          '</div></div>';
      }).join('');
    app.appendChild(q);

    q.querySelectorAll('.pending-note').forEach(function (card) {
      const id = card.dataset.id;
      const send = async function (status) {
        const res = await api('POST', '/admin/api/notes/' + id + '/review', {
          status: status,
          note: card.querySelector('.pn-text').value,
          portability: card.querySelector('.pn-port').value,
        });
        if (res.error) { alert(res.error); return; }
        await loadAll();
      };
      card.querySelector('.pn-approve').addEventListener('click', function () { send('approved'); });
      card.querySelector('.pn-reject').addEventListener('click', function () { send('rejected'); });
    });
  }

  // Venue Notes section (AI context)
  const notesSection = el('div', 'section');
  const venueOpts2 = '<option value="">All venues</option>' + venues.map(v => `<option value="${v.id}">${v.name}</option>`).join('');
  let notesHtml = `<h2>AI Context Notes</h2>
    <p style="color:var(--text-muted);font-size:13px;margin-bottom:16px">Notes you add here are fed to the AI on every query. Use them to give Sauron business context it can't get from numbers alone — promotions, events, operational changes, goals.</p>
    <div class="invite-form" id="note-form-container">
      <select id="note-venue" style="min-width:140px">${venueOpts2}</select>
      <select id="note-category" style="min-width:120px">
        <option value="general">General</option>
        <option value="operations">Operations</option>
        <option value="menu">Menu</option>
        <option value="events">Events</option>
        <option value="promotions">Promotions</option>
        <option value="goals">Goals</option>
      </select>
      <input type="text" id="note-text" placeholder="e.g. Fat Prince runs happy hour 5-7pm weekdays with 20% off drinks" style="flex:2;min-width:240px">
      <button class="btn" id="note-add-btn">Add</button>
    </div>`;

  if (notes.length > 0) {
    notesHtml += '<div style="margin-top:12px">';
    for (const n of notes) {
      const venueName = n.venues?.name || 'All venues';
      notesHtml += `<div class="file-item" style="margin-bottom:6px">
        <span class="role-badge role-${n.category === 'operations' ? 'manager' : n.category === 'promotions' ? 'owner' : n.category === 'goals' ? 'finance' : 'staff'}">${esc(n.category)}</span>
        <span style="color:var(--accent);font-size:12px;flex-shrink:0">${esc(venueName)}</span>
        <span class="fname">${esc(n.note)}</span>
        <span class="fsize">${fmtTime(n.created_at)}</span>
        <button class="fremove" onclick="deleteNote('${n.id}')">&times;</button>
      </div>`;
    }
    notesHtml += '</div>';
  } else {
    notesHtml += '<div style="color:var(--text-muted);font-size:13px;margin-top:12px">No notes yet. Add context to make the AI smarter about your business.</div>';
  }

  notesSection.innerHTML = notesHtml;
  app.appendChild(notesSection);

  // Xero section
  const xeroSection = el('div', 'section');
  const connRows = (xeroConnections || []).map(cn => {
    const mapped = cn.venues ? cn.venues.name : null;
    // A Xero organisation is a legal entity, so the name will not match the
    // venue's. Nothing is ingested until a human says which is which.
    const venueSelect = '<option value="">— not mapped —</option>' +
      venues.map(v => `<option value="${v.id}"${cn.venue_id === v.id ? ' selected' : ''}>${v.name}</option>`).join('');
    return `<tr>
      <td><strong>${cn.tenant_name || '(unnamed)'}</strong><br><span style="color:var(--text-muted);font-size:11px">${cn.tenant_id}</span></td>
      <td><select data-conn="${cn.id}" class="xero-venue" style="min-width:150px">${venueSelect}</select></td>
      <td>${mapped ? 'active' : 'awaiting mapping'}${cn.last_error ? `<br><span style="color:#c00;font-size:11px">${cn.last_error}</span>` : ''}</td>
    </tr>`;
  }).join('');

  xeroSection.innerHTML = `<h2>Xero</h2>
    <p style="color:var(--text-muted);font-size:13px;margin-bottom:16px">
      Connect a Xero login to pull P&amp;L and cost data. One Xero organisation per venue.
      Organisations are legal entities and their names will not match venue names, so each
      one has to be mapped by hand — nothing is ingested against an unmapped organisation.
    </p>
    <button id="xero-connect-btn" class="btn">Connect Xero</button>
    ${connRows ? `<table style="margin-top:16px"><thead><tr><th>Xero organisation</th><th>Venue</th><th>Status</th></tr></thead><tbody>${connRows}</tbody></table>` : '<p style="color:var(--text-muted);font-size:13px;margin-top:12px">No organisations connected yet.</p>'}`;
  app.appendChild(xeroSection);

  document.getElementById('xero-connect-btn').addEventListener('click', async () => {
    // The session token cannot ride a browser navigation, so the URL is
    // fetched with it and the redirect happens here.
    const res = await api('GET', '/xero/connect');
    if (res.error) { alert('Could not start Xero connection: ' + res.error); return; }
    window.location = res.url;
  });

  for (const sel of document.querySelectorAll('.xero-venue')) {
    sel.addEventListener('change', async (e) => {
      const venueId = e.target.value;
      if (!venueId) return;
      const res = await api('POST', `/admin/api/xero/connections/${e.target.dataset.conn}/venue`, { venue_id: venueId });
      if (res.error) { alert('Could not map: ' + res.error); return; }
      await loadAll();
    });
  }

  // Meta. Not loaded with the page -- it is several Graph calls plus a probe
  // per Instagram account, and the answer only changes while someone is
  // actually setting this up.
  const metaSection = el('div', 'section');
  metaSection.innerHTML = '<h2>Meta (Instagram &amp; Facebook)</h2>' +
    '<p style="color:var(--text-muted);font-size:13px;margin-bottom:12px">Lists every Page and Instagram account the System User token can reach, and asks each Instagram account for one day of data. Having an account id is not the same as being able to read it &mdash; only the probe tells you which.</p>' +
    '<button id="meta-discover-btn" class="btn">Discover accounts</button> ' +
    '<button id="meta-ingest-btn" class="btn">Pull last 30 days</button> ' +
    '<button id="meta-probe-btn" class="btn">Probe metric names</button> ' +
    '<button id="meta-sample-btn" class="btn">Sample raw response</button> ' +
    '<button id="meta-calibrate-btn" class="btn">Calibrate day alignment</button>' +
    '<div id="meta-result" style="margin-top:16px"></div>';
  app.appendChild(metaSection);

  document.getElementById('meta-discover-btn').addEventListener('click', async () => {
    const out = document.getElementById('meta-result');
    out.innerHTML = '<p style="color:var(--text-muted);font-size:13px">Asking Meta&hellip;</p>';

    const res = await api('GET', '/admin/api/meta/discover');
    const accounts = res.accounts || [];
    const errors = res.errors || [];

    const rows = accounts.map(function (a) {
      const readable = a.insights_readable === true
        ? '<span style="color:var(--success)">readable</span>'
        : a.insights_readable === false
          ? '<span style="color:var(--error)">no data</span>'
          : '<span style="color:var(--text-muted)">not probed</span>';
      return '<tr>' +
        '<td>' + escapeHtml(a.platform) + '</td>' +
        '<td>' + escapeHtml(a.account_name || '(unnamed)') + '</td>' +
        '<td style="font-family:monospace;font-size:12px">' + escapeHtml(a.account_id) + '</td>' +
        '<td><select class="meta-venue" data-platform="' + escapeHtml(a.platform) + '" data-account="' + escapeHtml(a.account_id) + '" data-name="' + escapeHtml(a.account_name || '') + '" style="min-width:150px">' +
          '<option value="">&mdash; not mapped &mdash;</option>' +
          venues.map(function (v) {
            return '<option value="' + v.id + '"' + (a.mapped_venue === v.name ? ' selected' : '') + '>' + escapeHtml(v.name) + '</option>';
          }).join('') +
        '</select></td>' +
        '<td>' + readable + '</td>' +
        '<td style="font-size:12px;color:var(--text-muted);max-width:340px;white-space:normal">' + escapeHtml(a.error || '') + '</td>' +
        '</tr>';
    }).join('');

    out.innerHTML =
      (accounts.length
        ? '<table><thead><tr><th>Platform</th><th>Name</th><th>Account id</th><th>Venue</th><th>Insights</th><th>Detail</th></tr></thead><tbody>' + rows + '</tbody></table>'
        : '<p style="color:var(--text-muted);font-size:13px">No accounts returned.</p>') +
      (errors.length
        ? '<div style="margin-top:14px"><div style="font-size:12px;font-weight:600;margin-bottom:6px">Notes</div>' +
          errors.map(function (e) {
            return '<div style="font-size:12px;color:var(--text-muted);margin-bottom:4px;white-space:normal">' + escapeHtml(e) + '</div>';
          }).join('') + '</div>'
        : '');

    // Attached here, not at render time: these selects only exist once the
    // discovery call has come back.
    for (const sel of out.querySelectorAll('.meta-venue')) {
      sel.addEventListener('change', async function (e) {
        const t = e.target;
        if (!t.value) return;
        const res = await api('POST', '/admin/api/meta/map', {
          platform: t.dataset.platform,
          account_id: t.dataset.account,
          account_name: t.dataset.name || null,
          venue_id: t.value,
        });
        if (res.error) { alert('Could not map: ' + res.error); return; }
        t.style.outline = '2px solid var(--success)';
      });
    }
  });

  document.getElementById('meta-ingest-btn').addEventListener('click', async () => {
    const out = document.getElementById('meta-result');
    out.innerHTML = '<p style="color:var(--text-muted);font-size:13px">Pulling&hellip; this takes a few seconds per account.</p>';

    const res = await api('POST', '/admin/api/meta/ingest', { days: 30 });
    if (res.error && !(res.results || []).length) {
      out.innerHTML = '<p style="font-size:13px;color:var(--error)">' + escapeHtml(res.error) + '</p>';
      return;
    }

    const rows = (res.results || []).map(function (r) {
      // A metric Graph refused is reported even when the pull succeeded --
      // storing two metrics out of three and calling it clean is how a feed
      // goes quietly half-dark.
      const failed = r.failed_metrics ? Object.keys(r.failed_metrics) : [];
      return '<tr>' +
        '<td>' + escapeHtml(r.account_name || r.account_id || '') + '</td>' +
        // A deliberate skip is not a failure. Colouring it red teaches people
        // to ignore red, and then the real one goes unread too.
        '<td>' + (r.stored
          ? '<span style="color:var(--success)">' + r.rows + ' rows</span>'
          : r.skipped
            ? '<span style="color:var(--text-muted)">skipped</span>'
            : '<span style="color:var(--error)">not stored</span>') + '</td>' +
        '<td style="font-size:12px;color:var(--text-muted);white-space:normal;max-width:420px">' +
          escapeHtml(r.error || '') +
          (failed.length ? '<br>Metrics refused: ' + escapeHtml(failed.join(', ')) : '') +
          ((r.missing_days || []).length ? '<br>No data on ' + r.missing_days.length + ' day(s)' : '') +
        '</td></tr>';
    }).join('');

    out.innerHTML = '<p style="font-size:13px;color:var(--text-muted)">' + escapeHtml(res.since || '') + ' to ' + escapeHtml(res.until || '') + '</p>' +
      '<table><thead><tr><th>Account</th><th>Stored</th><th>Detail</th></tr></thead><tbody>' + rows + '</tbody></table>';
  });

  document.getElementById('meta-calibrate-btn').addEventListener('click', async () => {
    const out = document.getElementById('meta-result');
    out.innerHTML = '<p style="color:var(--text-muted);font-size:13px">Pulling reach both ways over a week&hellip;</p>';

    const res = await api('GET', '/admin/api/meta/calibrate');
    if (res.error) {
      out.innerHTML = '<p style="font-size:13px;color:var(--error)">' + escapeHtml(res.error) + '</p>';
      return;
    }

    const dates = Object.keys(res.per_day_total_value || {}).sort();
    const rows = dates.map(function (d) {
      const a = (res.daily_series || {})[d];
      const b = (res.per_day_total_value || {})[d];
      const same = a === b;
      return '<tr><td>' + escapeHtml(d) + '</td>' +
        '<td class="r">' + (a === undefined ? '&mdash;' : a) + '</td>' +
        '<td class="r">' + (b === undefined ? '&mdash;' : b) + '</td>' +
        '<td>' + (same ? '<span style="color:var(--success)">same</span>' : '<span style="color:var(--text-muted)">differs</span>') + '</td></tr>';
    }).join('');

    const colour = res.verdict === 'aligned' ? 'var(--success)' : res.verdict === 'off_by_one' ? 'var(--error)' : 'var(--text-muted)';
    out.innerHTML =
      '<p style="font-size:14px;font-weight:600;color:' + colour + '">' + escapeHtml(res.verdict || '') + '</p>' +
      '<p style="font-size:13px;color:var(--text-muted);white-space:normal;max-width:70ch">' + escapeHtml(res.note || '') + '</p>' +
      '<p style="font-size:12px;color:var(--text-muted)">Same-day agreements: ' + res.matches + ' &middot; agreements one day back: ' + res.matches_shifted_back + '</p>' +
      '<table><thead><tr><th>Date asked for</th><th class="r">Dated series</th><th class="r">total_value</th><th>Agreement</th></tr></thead><tbody>' + rows + '</tbody></table>';
  });

  document.getElementById('meta-sample-btn').addEventListener('click', async () => {
    const out = document.getElementById('meta-result');
    out.innerHTML = '<p style="color:var(--text-muted);font-size:13px">Fetching one raw response&hellip;</p>';

    // `views` over three days: enough to show whether Meta returns one total or
    // a value per day, which is the whole question.
    const res = await api('GET', '/admin/api/meta/sample?platform=instagram&metric=views&form=total_value&days=3');
    out.innerHTML =
      '<p style="font-size:13px;color:var(--text-muted)">' +
        escapeHtml(res.account || '') + ' &middot; ' + escapeHtml(res.metric || '') +
        ' (' + escapeHtml(res.form || '') + ') &middot; ' + escapeHtml(res.since || '') + ' to ' + escapeHtml(res.until || '') +
      '</p>' +
      '<pre style="background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:12px;font-size:11px;overflow-x:auto;white-space:pre-wrap;word-break:break-word">' +
        escapeHtml(JSON.stringify(res.raw || res.error || res, null, 2)) +
      '</pre>';
  });

  document.getElementById('meta-probe-btn').addEventListener('click', async () => {
    const out = document.getElementById('meta-result');
    out.innerHTML = '<p style="color:var(--text-muted);font-size:13px">Trying every candidate metric name against the API. This takes a minute&hellip;</p>';

    const res = await api('POST', '/admin/api/meta/probe-metrics');
    if (res.error && !(res.results || []).length) {
      out.innerHTML = '<p style="font-size:13px;color:var(--error)">' + escapeHtml(res.error) + '</p>';
      return;
    }

    out.innerHTML = (res.results || []).map(function (r) {
      const ok = (r.probes || []).filter(function (p) { return p.ok; });
      const bad = (r.probes || []).filter(function (p) { return !p.ok; });
      return '<div style="margin-bottom:20px">' +
        '<div style="font-weight:600;margin-bottom:6px">' + escapeHtml(r.platform) + ' &middot; ' + escapeHtml(r.account_name || '') + '</div>' +
        (ok.length
          ? '<div style="font-size:13px;margin-bottom:6px"><span style="color:var(--success)">Accepted:</span> ' +
            ok.map(function (p) { return escapeHtml(p.metric) + ' <span style="color:var(--text-muted);font-size:11px">(' + escapeHtml(p.form) + ')</span>'; }).join(', ') +
            '</div>'
          : '<div style="font-size:13px;color:var(--error);margin-bottom:6px">Nothing accepted.</div>') +
        (bad.length
          ? '<div style="font-size:12px;color:var(--text-muted)">Rejected: ' + bad.map(function (p) { return escapeHtml(p.metric); }).join(', ') +
            // The reason matters: "not a valid metric" is a name problem,
            // anything about permissions is an access problem, and they send
            // you to completely different screens.
            (bad[0].error ? '<div style="margin-top:4px;white-space:normal">Reason given: ' + escapeHtml(bad[0].error) + '</div>' : '') +
            '</div>'
          : '') +
        (r.hint
          ? '<div style="margin-top:8px;font-size:12px;color:var(--text-muted);white-space:normal">' +
            '<strong>Meta&rsquo;s own list of what it accepts:</strong><br>' + escapeHtml(r.hint) + '</div>'
          : '') +
        (r.error ? '<div style="font-size:12px;color:var(--error)">' + escapeHtml(r.error) + '</div>' : '') +
        '</div>';
    }).join('');
  });

  document.getElementById('note-add-btn').addEventListener('click', async () => {
    const noteText = document.getElementById('note-text').value.trim();
    if (!noteText) return;
    const venueId = document.getElementById('note-venue').value;
    const category = document.getElementById('note-category').value;
    const res = await api('POST', '/admin/api/notes', { venue_id: venueId || null, note: noteText, category });
    if (res.error) {
      toast('error', res.error);
    } else {
      toast('success', 'Note added');
      document.getElementById('note-text').value = '';
      await loadAll();
    }
  });

  // Upload section
  const uploadSection = el('div', 'section');
  uploadSection.innerHTML = `
    <h2>Upload Reports</h2>
    <div class="drop-zone" id="drop-zone">
      <strong>Drop CSV/XLSX files here or click to browse</strong>
      <p>Product_Mix, Operations_Report, Hourly_Sales_Report files</p>
    </div>
    <input type="file" id="file-input" multiple accept=".csv,.xlsx" style="display:none">
    <div id="upload-file-list"></div>
    <div class="upload-actions" id="upload-actions" style="display:none">
      <button class="btn btn-small" id="upload-btn">Upload All</button>
      <button class="btn btn-small btn-outline" id="upload-clear">Clear</button>
      <span id="upload-count" style="color:var(--text-muted);font-size:12px"></span>
    </div>
    <div class="upload-progress" id="upload-progress"><div class="fill" id="upload-progress-fill"></div></div>
    <div class="upload-summary" id="upload-summary"></div>
  `;
  app.appendChild(uploadSection);
  initUpload();
}

function initUpload() {
  const dropZone = document.getElementById('drop-zone');
  const fileInput = document.getElementById('file-input');
  let uploadFiles = [];

  dropZone.addEventListener('click', () => fileInput.click());
  dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
  dropZone.addEventListener('drop', (e) => { e.preventDefault(); dropZone.classList.remove('dragover'); addUploadFiles(e.dataTransfer.files); });
  fileInput.addEventListener('change', () => { addUploadFiles(fileInput.files); fileInput.value = ''; });

  document.getElementById('upload-btn').addEventListener('click', () => doUpload());
  document.getElementById('upload-clear').addEventListener('click', () => { uploadFiles = []; renderUploadList(); document.getElementById('upload-summary').style.display = 'none'; document.getElementById('upload-progress').style.display = 'none'; });

  function addUploadFiles(newFiles) {
    for (const f of newFiles) {
      if (!uploadFiles.some(x => x.name === f.name && x.size === f.size)) uploadFiles.push(f);
    }
    renderUploadList();
  }

  function renderUploadList() {
    const list = document.getElementById('upload-file-list');
    list.innerHTML = '';
    uploadFiles.forEach((f, i) => {
      const valid = /^(Product_Mix|Operations_Report|Hourly_Sales_Report)/i.test(f.name);
      const item = document.createElement('div');
      item.className = 'file-item';
      item.id = 'ufile-' + i;
      const sz = f.size < 1024 ? f.size + ' B' : f.size < 1048576 ? (f.size/1024).toFixed(1) + ' KB' : (f.size/1048576).toFixed(1) + ' MB';
      item.innerHTML = `<span class="fname">${esc(f.name)}</span><span class="fsize">${sz}</span>
        <span class="fstatus ${valid ? 'fstatus-pending' : 'fstatus-warn'}">${valid ? 'Ready' : 'Unknown'}</span>
        <button class="fremove" onclick="this.closest('.file-item').remove(); void 0">&times;</button>`;
      list.appendChild(item);
    });
    document.getElementById('upload-actions').style.display = uploadFiles.length > 0 ? 'flex' : 'none';
    document.getElementById('upload-count').textContent = uploadFiles.length + ' file' + (uploadFiles.length !== 1 ? 's' : '');
  }

  async function doUpload() {
    const btn = document.getElementById('upload-btn');
    btn.disabled = true; btn.textContent = 'Uploading...';
    const progress = document.getElementById('upload-progress');
    const fill = document.getElementById('upload-progress-fill');
    progress.style.display = 'block';
    document.getElementById('upload-summary').style.display = 'none';

    let ok = 0, err = 0, warn = 0;
    const batchSize = 6;

    for (let i = 0; i < uploadFiles.length; i += batchSize) {
      const batch = uploadFiles.slice(i, i + batchSize);
      const formData = new FormData();
      batch.forEach(f => formData.append('files', f));

      batch.forEach((_, j) => { const el = document.getElementById('ufile-' + (i+j)); if (el) el.querySelector('.fstatus').textContent = 'Uploading...'; });

      try {
        const res = await fetch('/ingest/revel', { method: 'POST', body: formData });
        const data = await res.json();
        if (data.results) {
          data.results.forEach((r, j) => {
            const el = document.getElementById('ufile-' + (i+j));
            if (!el) return;
            const st = el.querySelector('.fstatus');
            if (r.status === 'ingested') { st.textContent = 'Ingested'; st.className = 'fstatus fstatus-ok'; ok++; }
            else if (r.status === 'reconciliation_failed') { st.textContent = 'Recon failed'; st.className = 'fstatus fstatus-warn'; warn++; }
            else { st.textContent = r.status; st.className = 'fstatus fstatus-err'; err++; }
          });
        }
      } catch (e) {
        batch.forEach((_, j) => { const el = document.getElementById('ufile-' + (i+j)); if (el) { const st = el.querySelector('.fstatus'); st.textContent = 'Error'; st.className = 'fstatus fstatus-err'; } err++; });
      }

      fill.style.width = Math.min(100, Math.round(((i + batch.length) / uploadFiles.length) * 100)) + '%';
    }

    fill.style.width = '100%';
    btn.disabled = false; btn.textContent = 'Upload All';

    const summary = document.getElementById('upload-summary');
    summary.style.display = 'block';
    summary.innerHTML = `<div class="ustat"><span class="ulabel">Total</span><span>${uploadFiles.length}</span></div>
      <div class="ustat"><span class="ulabel">Ingested</span><span style="color:var(--success)">${ok}</span></div>
      ${warn > 0 ? `<div class="ustat"><span class="ulabel">Warnings</span><span style="color:#e8c840">${warn}</span></div>` : ''}
      ${err > 0 ? `<div class="ustat"><span class="ulabel">Errors</span><span style="color:var(--error)">${err}</span></div>` : ''}`;
  }
}

async function assignRole(userId) {
  const venueId = document.getElementById('venue-' + userId).value;
  const role = document.getElementById('role-' + userId).value;
  const res = await api('POST', `/admin/api/users/${userId}/roles`, { venue_id: venueId, role });
  if (res.error) {
    toast('error', res.error);
  } else {
    toast('success', 'Role assigned');
    await loadAll();
  }
}

async function removeRole(roleId) {
  const res = await api('DELETE', `/admin/api/roles/${roleId}`);
  if (res.error) {
    toast('error', res.error);
  } else {
    toast('success', 'Role removed');
    await loadAll();
  }
}

function confirmDeleteUser(userId, email) {
  if (!confirm('Delete user ' + email + '? This removes all their roles and access.')) return;
  doDeleteUser(userId);
}

async function doDeleteUser(userId) {
  const res = await api('DELETE', `/admin/api/users/${userId}`);
  if (res.error) {
    toast('error', res.error);
  } else {
    toast('success', 'User deleted');
    await loadAll();
  }
}

function showResetPassword(userId, email) {
  const overlay = el('div', 'modal-overlay');
  overlay.innerHTML = `
    <div class="modal">
      <h3>Reset password</h3>
      <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px">${email}</p>
      <input type="password" id="reset-pw-input" placeholder="New password">
      <div class="modal-btns">
        <button class="btn btn-small btn-outline" id="reset-cancel">Cancel</button>
        <button class="btn btn-small" id="reset-confirm">Reset</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);

  document.getElementById('reset-cancel').onclick = () => overlay.remove();
  overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };

  document.getElementById('reset-confirm').onclick = async () => {
    const pw = document.getElementById('reset-pw-input').value;
    if (!pw) return;
    const res = await api('POST', `/admin/api/users/${userId}/reset-password`, { password: pw });
    overlay.remove();
    if (res.error) {
      toast('error', res.error);
    } else {
      toast('success', 'Password reset');
    }
  };
}

async function deleteNote(noteId) {
  const res = await api('DELETE', `/admin/api/notes/${noteId}`);
  if (res.error) {
    toast('error', res.error);
  } else {
    toast('success', 'Note deleted');
    await loadAll();
  }
}

/**
 * Escape text before it goes into innerHTML.
 *
 * Not cosmetic. Note text is submitted by any authenticated user through the
 * capture endpoint and rendered here, in the OWNER's admin page -- the most
 * privileged session in the product. Unescaped, a note is a stored script
 * injection aimed squarely at it.
 */
function escapeHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function el(tag, cls) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  return e;
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

function toast(type, msg) {
  const t = el('div', 'toast ' + type);
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}
