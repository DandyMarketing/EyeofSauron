<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Sauron</title>
<!--
  Start the auth client downloading while the HTML is still being parsed.

  Without this the browser cannot know it needs the file until the script at the
  bottom of the page runs and reaches its dynamic import() -- so a 60 KB
  download that could have been in flight from the first byte waits for the
  whole document to parse first. A modulepreload is the only way to tell it
  earlier, because a dynamic import is invisible to the preload scanner.
-->
<link rel="modulepreload" href="/vendor/supabase.js">
<!--
  The Supabase config, substituted by the server (see injectConfig in
  src/server.ts). It used to be a fetch, which was a whole round trip at the
  front of the chain for two public values, and nothing could start until it
  came back.
-->
<!--SAURON_CONFIG-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0a0a0f;
    --surface: #14141f;
    --surface-hover: #1a1a2a;
    --border: #2a2a3a;
    --text: #e4e4ef;
    --text-muted: #8888a0;
    --accent: #e8933a;
    --accent-dim: #c47520;
    --error: #e84040;
    --success: #40c060;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }

  .logo {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: radial-gradient(circle, var(--accent) 0%, #8b3500 70%, #2a0e00 100%);
    box-shadow: 0 0 20px rgba(232, 147, 58, 0.3);
    flex-shrink: 0;
  }

  header h1 { font-size: 18px; font-weight: 600; }
  header .subtitle { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

  nav {
    margin-left: auto;
    display: flex;
    gap: 16px;
    font-size: 14px;
  }

  nav a { color: var(--text-muted); text-decoration: none; }
  nav a:hover, nav a.active { color: var(--accent); }

  .container {
    max-width: 960px;
    margin: 0 auto;
    padding: 24px 20px;
  }

  .section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    margin-bottom: 24px;
  }

  .section h2 {
    font-size: 16px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .invite-form {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }

  .invite-form input {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    outline: none;
    flex: 1;
    min-width: 180px;
  }

  .invite-form input:focus { border-color: var(--accent); }
  .invite-form input::placeholder { color: var(--text-muted); }

  .btn {
    background: var(--accent);
    color: #000;
    border: none;
    border-radius: 8px;
    padding: 10px 18px;
    font-size: 14px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: background 0.2s;
    white-space: nowrap;
  }

  .btn:hover { background: var(--accent-dim); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /**
   * A row of buttons that wraps WITHOUT the buttons landing on top of each
   * other.
   *
   * They were written as inline-block elements separated by a space, which is
   * fine on a desktop where they fit on one line. On a phone they wrap — and an
   * inline-block box taller than the inherited line-height overlaps the line
   * above it, so the five Meta probe buttons rendered as a stack of
   * half-covered rectangles. Reported from a real phone; reproduced at 390px
   * before this was written.
   *
   * Flex is the fix rather than a line-height patch: the gap is explicit, the
   * wrap is explicit, and neither depends on a font metric.
   */
  .btn-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }

  .btn-small {
    padding: 6px 12px;
    font-size: 12px;
    border-radius: 6px;
  }

  .btn-danger {
    background: var(--error);
    color: #fff;
  }

  .btn-danger:hover { background: #c03030; }

  .btn-outline {
    background: transparent;
    color: var(--text-muted);
    border: 1px solid var(--border);
  }

  .btn-outline:hover { border-color: var(--text-muted); color: var(--text); background: transparent; }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }

  th, td {
    padding: 10px 12px;
    text-align: left;
    border-bottom: 1px solid var(--border);
  }

  /**
   * A WIDE TABLE SCROLLS ITSELF, instead of making the whole page scroll.
   *
   * This page has tables nothing can make narrow: the role matrix carries a
   * hard `min-width: 520px` and the account mappings need five columns of real
   * text. With no scroll container they pushed the DOCUMENT wide — measured at
   * 557px of content in a 375px viewport — so every heading and paragraph on
   * the page sat off-centre and the right-hand column of every table was simply
   * unreachable. Reported from a phone, reproduced at 390px.
   *
   * IT HAS TO BE A WRAPPER, and the first attempt proved why. Putting
   * `display: block; overflow-x: auto` on the table itself looks equivalent and
   * is not: `min-width: 520px` then applies to the scrolling box, so the box is
   * 520px wide in a 375px viewport and overflows exactly as before. Measured —
   * the computed style came back `display=block overflowX=auto width=520px`
   * with the page still 557px wide. The minimum has to sit on the table and the
   * scrolling on something outside it.
   *
   * Applied at every width rather than only on mobile: a table that fits
   * produces no scrollbar, so there is nothing to gain from making the
   * behaviour conditional and a whole failure mode to lose.
   */
  .table-scroll {
    max-width: 100%;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }

  th {
    color: var(--text-muted);
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  tr:last-child td { border-bottom: none; }

  .role-badge {
    display: inline-block;
    padding: 3px 8px;
    border-radius: 4px;
    font-size: 12px;
    font-weight: 500;
  }

  .role-owner { background: rgba(232, 147, 58, 0.15); color: var(--accent); }
  .role-manager { background: rgba(100, 149, 237, 0.15); color: #6495ed; }
  .role-finance { background: rgba(64, 192, 96, 0.15); color: var(--success); }
  .role-staff { background: rgba(136, 136, 160, 0.15); color: var(--text-muted); }

  /**
   * Said ONCE, at the top, rather than under every user.
   *
   * The first version rendered the full can/cannot lists beneath every row.
   * With a hundred users that is a hundred copies of the same four
   * descriptions, and a security note repeated a hundred times is one nobody
   * reads — the repeat-suppression argument from the recommendation engine,
   * applied to a page.
   */
  .role-matrix { margin-bottom: 18px; }
  .role-matrix table { width: auto; min-width: 520px; font-size: 12px; }
  .role-matrix th, .role-matrix td { padding: 6px 12px; text-align: center; }
  .role-matrix th:first-child, .role-matrix td:first-child { text-align: left; font-weight: 600; }
  .role-matrix .yes { color: var(--success); }
  .role-matrix .no  { color: #6a6a7a; }
  .role-matrix .note {
    font-size: 11px; color: var(--text-muted); margin-top: 8px; line-height: 1.55; max-width: 620px;
  }
  .role-matrix details > summary {
    cursor: pointer; color: var(--text-muted); font-size: 12px; margin-top: 8px;
  }
  .role-matrix details > summary:hover { color: var(--text); }
  .role-matrix .detail { font-size: 12px; line-height: 1.55; padding: 8px 0 0 2px; }
  .role-matrix .detail h4 { font-size: 12px; margin: 10px 0 2px; color: var(--text); }
  .role-matrix .detail ul { margin: 0 0 0 16px; padding: 0; }
  .role-matrix .ra-can { color: var(--success); }
  .role-matrix .ra-cannot { color: #e88a8a; }

  /* At the point of choosing: ONE line, and only for the row being touched. */
  .role-access {
    margin-top: 6px; font-size: 11px; line-height: 1.5;
    color: var(--text-muted); max-width: 420px;
  }
  .role-access strong { color: var(--accent); font-weight: 600; }
  .role-access .ra-warn { color: var(--accent); display: block; margin-top: 2px; }

  .role-actions {
    display: flex;
    gap: 6px;
    align-items: center;
    flex-wrap: wrap;
  }

  .user-actions {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  select {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 10px;
    color: var(--text);
    font-size: 12px;
    font-family: inherit;
    outline: none;
  }

  /**
   * Every input, not just the ones inside a known form.
   *
   * `.invite-form input` and `.modal input` were styled and a bare `input` was
   * not, so the two StaffAny date fields rendered as white boxes in the middle
   * of a dark page — the browser default, on the one control type nobody had
   * put inside a styled container.
   *
   * `color-scheme: dark` is the half that CSS alone cannot do: the calendar
   * icon inside a date field is drawn by the browser, not by us, and without
   * this it stays black-on-black and effectively invisible.
   */
  input {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
    color: var(--text);
    font-size: 13px;
    font-family: inherit;
    outline: none;
    color-scheme: dark;
    max-width: 100%;
  }

  input:focus, select:focus, textarea:focus { border-color: var(--accent); }

  .toast {
    position: fixed;
    bottom: 20px;
    right: 20px;
    padding: 12px 20px;
    border-radius: 8px;
    font-size: 14px;
    z-index: 100;
    animation: slideIn 0.3s ease;
  }

  .toast.success { background: rgba(64, 192, 96, 0.9); color: #000; }
  .toast.error { background: rgba(232, 64, 64, 0.9); color: #fff; }

  @keyframes slideIn {
    from { transform: translateY(20px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  .system-card {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px;
    margin-bottom: 12px;
  }

  .system-card h4 {
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 8px;
  }

  .gap-item {
    font-size: 13px;
    padding: 4px 0;
    color: var(--error);
  }

  .no-gaps {
    font-size: 13px;
    color: var(--success);
  }

  .ingestion-row {
    font-size: 13px;
    padding: 4px 0;
    display: flex;
    gap: 12px;
  }

  .ingestion-row .status-ok { color: var(--success); }
  .ingestion-row .status-err { color: var(--error); }

  .loading {
    text-align: center;
    color: var(--text-muted);
    padding: 40px;
  }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 200;
  }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    width: 100%;
    max-width: 360px;
  }

  .modal h3 {
    font-size: 16px;
    margin-bottom: 16px;
  }

  .modal input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    outline: none;
    margin-bottom: 16px;
  }

  .modal input:focus { border-color: var(--accent); }

  .modal-btns {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
  }

  .drop-zone {
    border: 2px dashed var(--border);
    border-radius: 12px;
    padding: 36px 24px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
    margin-bottom: 12px;
  }

  .drop-zone:hover, .drop-zone.dragover {
    border-color: var(--accent);
    background: rgba(232, 147, 58, 0.04);
  }

  .drop-zone p { color: var(--text-muted); font-size: 13px; margin-top: 6px; }

  .drop-zone strong { color: var(--accent); font-size: 14px; }

  .file-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 13px;
    margin-bottom: 4px;
  }

  /**
   * `overflow-wrap: anywhere`, NOT `word-break: break-all`.
   *
   * This class began as an upload list, where break-all was right: a filename
   * has no spaces and must be allowed to break mid-word. The AI notes list then
   * reused it for sentences, and break-all breaks a sentence mid-word too —
   * which, once the column was squeezed, produced a note rendered ONE CHARACTER
   * PER LINE, several hundred lines tall. Reported from a phone.
   *
   * `anywhere` breaks mid-word only when there is no other way to fit, so a
   * long filename still wraps and a sentence breaks at its spaces.
   */
  .file-item .fname { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .file-item .fsize { color: var(--text-muted); flex-shrink: 0; }
  .file-item .fstatus { flex-shrink: 0; font-size: 12px; padding: 2px 8px; border-radius: 4px; }
  .fstatus-pending { color: var(--text-muted); }
  .fstatus-ok { color: var(--success); background: rgba(64,192,96,0.1); }
  .fstatus-err { color: var(--error); background: rgba(232,64,64,0.1); }
  .fstatus-warn { color: #e8c840; background: rgba(232,200,64,0.1); }

  .file-item .fremove {
    background: none; border: none; color: var(--text-muted);
    cursor: pointer; font-size: 16px; padding: 0 4px;
  }

  .file-item .fremove:hover { color: var(--error); }

  .upload-actions { display: flex; gap: 10px; align-items: center; margin-top: 12px; }

  .upload-progress {
    height: 4px; background: var(--border); border-radius: 2px;
    margin-top: 12px; overflow: hidden; display: none;
  }

  .upload-progress .fill {
    height: 100%; background: var(--accent); border-radius: 2px;
    transition: width 0.3s; width: 0%;
  }

  .upload-summary {
    margin-top: 12px; padding: 12px;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 6px; font-size: 13px; display: none;
  }

  .upload-summary .ustat { display: flex; justify-content: space-between; padding: 3px 0; }
  .upload-summary .ustat .ulabel { color: var(--text-muted); }

  /**
   * An ingestion error, as something readable rather than a row of fragments.
   *
   * It was four columns squeezed side by side — status, filename, message,
   * time — which on a phone gave the message about ten characters of width.
   * Stacked, the plain sentence gets the room it needs to be read, and the
   * technical line sits under it in a smaller, dimmer type so it is obviously
   * the reference rather than the point.
   */
  .ingestion-error {
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
  }

  .ingestion-error:last-child { border-bottom: none; }

  .ie-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 5px; }
  .ie-when { color: var(--text-muted); font-size: 11px; margin-left: auto; }

  /* What to DO, which is the thing somebody scanning this page is after. */
  .ie-action { font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 4px; }
  .ie-fix   { background: rgba(232, 64, 64, 0.15);  color: var(--error); }
  .ie-wait  { background: rgba(136, 136, 160, 0.15); color: var(--text-muted); }
  .ie-watch { background: rgba(232, 200, 64, 0.15);  color: #e8c840; }
  .ie-resolved { background: rgba(64, 192, 96, 0.15); color: var(--success); }

  /**
   * Dimmed, not hidden. A repaired failure is history rather than a task, but a
   * week of blips that each self-healed is a pattern about the vendor worth
   * seeing. Full opacity on hover so it can still be read properly.
   *
   * A DIFFERENT CLASS FROM THE BADGE on purpose: `.ie-resolved` is the green
   * chip, and reusing it here put a green background on the whole row and this
   * dimming on the chip. Caught by rendering it.
   */
  .ie-is-resolved { opacity: 0.55; }
  .ie-is-resolved:hover { opacity: 1; }

  .ie-fixed {
    color: var(--success);
    font-size: 12px;
    line-height: 1.45;
    margin-bottom: 5px;
  }

  .ie-plain { line-height: 1.5; margin-bottom: 5px; }

  .ie-raw {
    font-size: 11px;
    color: var(--text-muted);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    overflow-wrap: anywhere;
  }

  .pager {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-top: 12px;
  }

  .pager-pos { font-size: 12px; color: var(--text-muted); }

  /**
   * The venue picker: tick as many as you like, then press Add once.
   *
   * It was a single-choice dropdown, which on a phone opens a full-screen
   * modal — so granting the same role at three venues was fifteen taps and
   * three page rebuilds. These wrap, they are thumb-sized, and the state is
   * visible without opening anything.
   */
  .venue-picker { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }

  .venue-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 10px;
    border: 1px solid var(--border);
    border-radius: 999px;
    font-size: 12px;
    cursor: pointer;
    user-select: none;
    /* 32px tall at this padding — a tap target, not a mouse target. */
    min-height: 32px;
  }

  .venue-chip input { width: 15px; height: 15px; margin: 0; flex-shrink: 0; cursor: pointer; }
  .venue-chip:has(input:checked) { border-color: var(--accent); background: rgba(232, 147, 58, 0.12); }
  .venue-chip:has(input:disabled) { opacity: 0.45; cursor: default; }

  /**
   * The tab bar.
   *
   * Scrolls sideways rather than wrapping: five tabs do not fit across a phone,
   * and a wrapped bar changes height as you move between tabs, which shifts the
   * whole page under your thumb. A scrolling strip stays one row at every width.
   */
  .tab-bar {
    display: flex;
    gap: 4px;
    margin-bottom: 20px;
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }

  .tab-bar::-webkit-scrollbar { display: none; }

  .tab {
    display: flex;
    align-items: center;
    gap: 7px;
    flex-shrink: 0;
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    padding: 10px 14px;
    color: var(--text-muted);
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }

  .tab:hover { color: var(--text); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

  /**
   * The count that makes lazy tabs honest.
   *
   * Without it nothing on an unopened tab can tell you it needs attention, and
   * a review queue nobody can see is one that grows.
   */
  .tab-badge {
    min-width: 18px;
    padding: 1px 6px;
    border-radius: 9px;
    background: var(--accent);
    color: #000;
    font-size: 11px;
    font-weight: 700;
    text-align: center;
  }

  .tab:not(.active) .tab-badge { background: var(--accent-dim); color: #fff; }

  @media (max-width: 600px) {
    .invite-form { flex-direction: column; }
    .invite-form input { min-width: unset; }
    table { font-size: 13px; }
    th, td { padding: 8px 6px; }
    .drop-zone { padding: 24px 16px; }

    /**
     * THE USERS TABLE BECOMES CARDS.
     *
     * Six columns — name, email, terms, roles held, the grant controls and the
     * row actions — cannot share 390px. With a scroll container they did not
     * overflow the page, which fixed the layout and not the problem: the venue
     * picker and the Add button sat off-screen to the right, so granting a role
     * on a phone meant scrolling sideways inside a row to find the controls.
     *
     * Stacked, each user is a card and the grant controls get the full width.
     * The header row goes, so each cell carries its own label via data-label —
     * a date with no column heading above it is just a date.
     */
    #users-section table,
    #users-section tbody,
    #users-section tr,
    #users-section td { display: block; width: 100%; }

    #users-section thead { display: none; }

    #users-section tr {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }

    #users-section td {
      border: none;
      padding: 5px 0;
      /* The nowrap the Terms cell carries inline is wrong once stacked. */
      white-space: normal !important;
    }

    #users-section td[data-label]::before {
      content: attr(data-label);
      display: block;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 3px;
    }

    /* Nothing to scroll once it is stacked, and the wrapper would otherwise
       clip the chips' focus ring. */
    #users-section .table-scroll { overflow-x: visible; }

    /**
     * Stack the note rows rather than squeezing them.
     *
     * Five items on one row — badge, venue, the note, a date, a remove button —
     * cannot share 375px. The three short ones are `flex-shrink: 0`, so the
     * note was the only thing that could give, and it gave all the way down to
     * one character wide. Stacked, the note gets the full width and the
     * metadata sits above it.
     */
    .file-item {
      flex-direction: column;
      align-items: flex-start;
      gap: 6px;
      position: relative;
      padding-right: 34px;
    }

    /* The remove button goes to the corner, where it does not take a row. */
    .file-item .fremove { position: absolute; top: 6px; right: 8px; }
  }
</style>
</head>
<body>
  <header>
    <div class="logo"></div>
    <div>
      <h1>Sauron Admin</h1>
      <div class="subtitle">The Dandy Collection</div>
    </div>
    <nav>
      <a href="/">Chat</a>
      <a href="/briefing.html">Briefing</a>
      <a href="/plan.html">Plan</a>
      <a href="/admin.html" class="active">Admin</a>
      <a href="#" id="logout-link">Logout</a>
    </nav>
  </header>

  <div class="container" id="app">
    <div class="loading">Loading...</div>
  </div>

<script>
let token = null;
let venues = [];
let currentUserId = null;

(async function init() {
  // Both at once — see index.html for why these were never dependent.
  // Inlined by the server, so there is nothing to wait for. The fetch remains
  // as a fallback: if the substitution ever fails, the page authenticates the
  // way it always did rather than not at all.
  const [cfg, { createClient }] = await Promise.all([
    window.__SAURON_CONFIG__ ?? fetch('/api/config').then(r => r.json()),
    import('/vendor/supabase.js'),
  ]);
  if (!cfg.supabaseUrl || !cfg.supabaseAnonKey) {
    document.getElementById('app').innerHTML = '<div class="loading">Auth not configured.</div>';
    return;
  }

  const supabase = createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);

  const { data: { session } } = await supabase.auth.getSession();
  if (!session) {
    window.location.href = '/login.html';
    return;
  }

  token = session.access_token;

  /**
   * The default tab's data starts NOW, alongside /api/me.
   *
   * Only the Attention tab's three reads, and only because that is the tab
   * about to be shown. The other four fetch nothing until somebody clicks them,
   * which is the whole point of the split.
   *
   * This is not a loosening of anything: every /admin/api route checks the
   * owner role server-side, so a non-owner's requests are refusals rather than
   * answers, and the isOwner check below still decides what this page draws.
   */
  // The badge counts are wanted whichever tab is opened.
  prefetch('/admin/api/summary');

  /**
   * ...but only the tab actually being opened. A link to #people should not
   * fetch the Attention tab's three reads to throw them away, and the hash is
   * known here, before /api/me has even been asked.
   */
  if (((location.hash || '').replace('#', '') || DEFAULT_TAB) === 'attention') {
    prefetch('/admin/api/alerts');
    prefetch('/admin/api/notes?status=pending');
    prefetch('/admin/api/system?days=3');
  }

  const meRes = await fetch('/api/me', { headers: { Authorization: 'Bearer ' + token } });
  if (!meRes.ok) {
    window.location.href = '/login.html';
    return;
  }

  const me = await meRes.json();
  currentUserId = me.id;
  if (!me.isOwner) {
    document.getElementById('app').innerHTML = '<div class="loading">Admin access required. You do not have the owner role.</div>';
    return;
  }

  document.getElementById('logout-link').addEventListener('click', async (e) => {
    e.preventDefault();
    await supabase.auth.signOut();
    window.location.href = '/login.html';
  });

  // Started BEFORE the first render, so every table a tab creates is caught by
  // the observer rather than needing a pass after each one.
  watchForTables();

  buildTabs();
  loadBadges();

  // The tab from the URL, so a refresh keeps your place. An unknown one falls
  // back to the default rather than showing nothing.
  openTab((location.hash || '').replace('#', '') || DEFAULT_TAB);
  window.addEventListener('hashchange', () => {
    openTab((location.hash || '').replace('#', '') || DEFAULT_TAB);
  });
})();

/**
 * Requests started BEFORE render, so they are in flight rather than queued
 * behind it.
 *
 * The page loads in two waves. Seven calls go out together, and then render()
 * draws the sections — and only then does it kick off the account map, the fee
 * acknowledgements and the StaffAny sections. Those three need nothing from the
 * first seven; they were second simply because that is where the code that
 * draws their panels happens to live. So the slowest of the seven gated three
 * requests that could have run beside it.
 *
 * ONE SHOT, deliberately. loadAccountMap() is also called to REFRESH after an
 * edit, and handing it the result of a fetch made before that edit would show
 * the row the user just changed, unchanged. Taking an entry removes it, so the
 * first call gets the head start and every later call fetches fresh.
 */
const prefetched = new Map();

function prefetch(path) {
  // Errors are captured as values: an unhandled rejection sitting in a map
  // until somebody awaits it is reported by the browser as an error nobody
  // caused, seconds before the code that would have handled it runs.
  prefetched.set(path, api('GET', path).catch(e => ({ error: String((e && e.message) || e) })));
}

function take(path) {
  const started = prefetched.get(path);
  if (!started) return api('GET', path);
  prefetched.delete(path);
  return started;
}

async function api(method, path, body) {
  const opts = {
    method,
    headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
  };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(path, opts);
  return res.json();
}

function fmtTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleString('en-SG', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false });
}


async function loadAccountMap() {
  const body = document.getElementById('map-body');
  if (!body) return;

  const data = await take('/admin/api/account-map');
  if (data.error) { body.innerHTML = '<div class="error-msg">' + esc(data.error) + '</div>'; return; }

  const venueName = {};
  for (const v of data.venues || []) venueName[v.id] = v.name;

  let html = '';

  // Unmapped first. This is the queue, not a footnote.
  if ((data.unmapped || []).length > 0) {
    html += '<div class="system-card"><h4>Unmapped accounts (' + data.unmapped.length + ')</h4>' +
      '<div style="color:var(--text-muted);font-size:12px;margin-bottom:8px">' +
      'These appeared in a ledger after anyone last looked. They resolve to their own names — nothing is merged wrongly — but they will not match the equivalent account at another venue.' +
      '</div>';
    for (const u of data.unmapped) {
      html += '<div class="gap-item">' + esc(venueName[u.venue_id] || u.venue_id) + ' — ' + esc(u.account_name) +
        ' <button class="btn btn-small map-add" data-venue="' + esc(u.venue_id) + '" data-account="' + esc(u.account_name) + '">Map it</button></div>';
    }
    html += '</div>';
  }

  // Rows where the shared name DIFFERS from the ledger name are the decisions
  // somebody made; identity mappings are noise and are collapsed away.
  const decisions = (data.mappings || []).filter(function (m) {
    return m.canonical_account !== m.account_name || (m.business_line && m.business_line !== 'main');
  });

  html += '<div class="system-card"><h4>Mappings that change something (' + decisions.length + ' of ' + (data.mappings || []).length + ')</h4>' +
    '<table style="width:100%;font-size:13px;border-collapse:collapse">' +
    '<thead><tr><th>Venue</th><th>Ledger name</th><th>Rolls up to</th><th>Business line</th><th></th></tr></thead><tbody>';
  for (const m of decisions) {
    html += '<tr>' +
      '<td>' + esc(venueName[m.venue_id] || '') + '</td>' +
      '<td>' + esc(m.account_name) + '</td>' +
      '<td><strong>' + esc(m.canonical_account) + '</strong></td>' +
      '<td>' + esc(m.business_line || 'main') + '</td>' +
      '<td><button class="btn btn-small btn-outline map-add" data-venue="' + esc(m.venue_id) + '" data-account="' + esc(m.account_name) +
      '" data-canonical="' + esc(m.canonical_account) + '" data-line="' + esc(m.business_line || 'main') + '">Edit</button></td>' +
      '</tr>';
  }
  html += '</tbody></table></div>';

  body.innerHTML = html;

  body.querySelectorAll('.map-add').forEach(function (btn) {
    btn.addEventListener('click', function () {
      const account = btn.dataset.account;
      const canonical = prompt('What shared name should "' + account + '" roll up to?\n\nUse the name the OTHER venues already use — a name somebody recognises is easier to check than a new one.', btn.dataset.canonical || account);
      if (canonical === null) return;
      const line = prompt('Business line for "' + account + '"?\n\n"main" for ordinary accounts. "sushi" or "merchandise" for a sub-business that still belongs in this venue\'s P&L.', btn.dataset.line || 'main');
      if (line === null) return;

      api('PUT', '/admin/api/account-map', {
        venue_id: btn.dataset.venue,
        account_name: account,
        canonical_account: canonical.trim() || account,
        business_line: (line || 'main').trim(),
      }).then(function (r) {
        if (r.error) { alert('Could not save: ' + r.error); return; }
        loadAccountMap();
      });
    });
  });
}

async function loadFeeAcks() {
  const body = document.getElementById('fee-body');
  if (!body) return;

  const data = await take('/admin/api/fee-acknowledgements');
  if (data.error) { body.innerHTML = '<div class="error-msg">' + esc(data.error) + '</div>'; return; }

  const venueOpts = venues.map(v => '<option value="' + v.id + '">' + esc(v.name) + '</option>').join('');
  let html = '<div class="invite-form">' +
    '<select id="fee-venue" style="min-width:140px">' + venueOpts + '</select>' +
    '<input type="month" id="fee-month" style="min-width:150px">' +
    '<input type="text" id="fee-account" placeholder="Fee name, or blank for all fees that month" style="min-width:220px">' +
    '<input type="text" id="fee-reason" placeholder="Why is this month different?" style="flex:2;min-width:240px">' +
    '<button class="btn" id="fee-add-btn">Record</button>' +
    '</div>';

  const acks = data.acknowledgements || [];
  if (acks.length === 0) {
    html += '<div style="color:var(--text-muted);font-size:13px;margin-top:12px">Nothing explained yet. Every flagged month is still being reported as a finding.</div>';
  } else {
    html += '<div style="margin-top:12px">';
    for (const a of acks) {
      html += '<div class="file-item" style="margin-bottom:6px">' +
        '<strong>' + esc(a.venues?.name || '') + '</strong> — ' + esc(a.period_start) +
        (a.account_name ? ' — ' + esc(a.account_name) : ' — all fees') +
        '<div style="color:var(--text-muted);font-size:12px;margin-top:2px">' + esc(a.reason) + '</div>' +
        '<button class="btn btn-small btn-outline fee-del" data-id="' + esc(a.id) + '" style="margin-top:6px">Remove</button>' +
        '</div>';
    }
    html += '</div>';
  }

  body.innerHTML = html;

  document.getElementById('fee-add-btn').addEventListener('click', function () {
    const month = document.getElementById('fee-month').value;
    const reason = document.getElementById('fee-reason').value.trim();
    if (!month) { alert('Pick the month this applies to.'); return; }
    // Required here as well as server-side: an acknowledgement with no reason
    // tells a future reader only that somebody wanted the warning gone.
    if (!reason) { alert('A reason is required — the briefing states it instead of going silent.'); return; }

    api('POST', '/admin/api/fee-acknowledgements', {
      venue_id: document.getElementById('fee-venue').value,
      period_start: month + '-01',
      account_name: document.getElementById('fee-account').value.trim() || null,
      reason: reason,
    }).then(function (r) {
      if (r.error) { alert('Could not save: ' + r.error); return; }
      loadFeeAcks();
    });
  });

  body.querySelectorAll('.fee-del').forEach(function (btn) {
    btn.addEventListener('click', function () {
      api('DELETE', '/admin/api/fee-acknowledgements/' + btn.dataset.id).then(function (r) {
        if (r.error) { alert('Could not remove: ' + r.error); return; }
        loadFeeAcks();
      });
    });
  });
}

/**
 * The tabs.
 *
 * WHY. This page had thirteen sections and loaded all of them on every visit —
 * eleven API calls before anything appeared, nine of which were for panels
 * nobody was looking at. The usual reason to open it is to see what needs
 * attention; adding a user or checking the account map is a deliberate trip.
 *
 * SO A TAB FETCHES NOTHING UNTIL IT IS OPENED, and the default tab is the one
 * that answers "is anything wrong". Three requests instead of eleven.
 *
 * THE RISK THIS CREATES, and the reason `/admin/api/summary` exists. If nothing
 * loads until you click, you cannot SEE that something needs attention — the
 * review queue and the alert count become invisible until somebody goes
 * looking, and an approval queue nobody sees is one that grows. The counts are
 * fetched up front, as counts rather than rows, and shown on the tabs. Lazy
 * tabs without that are faster and worse.
 */
const TABS = [
  { id: 'attention',   label: 'Attention',   load: loadAttention },
  { id: 'people',      label: 'People',      load: loadPeople },
  { id: 'connections', label: 'Connections', load: loadConnections },
  { id: 'accounting',  label: 'Accounting',  load: loadAccounting },
  { id: 'knowledge',   label: 'Knowledge',   load: loadKnowledge },
];

const DEFAULT_TAB = 'attention';
let activeTab = null;

/**
 * Venues, fetched once and shared.
 *
 * Three tabs need them — the role picker, the note form, the Xero mapping — and
 * it is a handful of rows. Held as the PROMISE rather than the result so two
 * tabs opened quickly cannot both start a fetch.
 */
let venuesPromise = null;
function loadVenues() {
  if (!venuesPromise) {
    venuesPromise = api('GET', '/admin/api/venues').then(r => {
      venues = r.venues || [];
      return venues;
    });
  }
  return venuesPromise;
}

function panelFor(id) {
  return document.getElementById('panel-' + id);
}

/** Build the tab bar and the empty panels. Called once. */
function buildTabs() {
  const app = document.getElementById('app');
  app.innerHTML = '';

  const bar = el('div', 'tab-bar');
  for (const tab of TABS) {
    const b = document.createElement('button');
    b.className = 'tab';
    b.dataset.tab = tab.id;
    b.innerHTML = '<span>' + tab.label + '</span><span class="tab-badge" data-badge="' + tab.id + '" hidden></span>';
    b.addEventListener('click', () => openTab(tab.id));
    bar.appendChild(b);
  }
  app.appendChild(bar);

  for (const tab of TABS) {
    const panel = el('div', 'tab-panel');
    panel.id = 'panel-' + tab.id;
    panel.hidden = true;
    app.appendChild(panel);
  }
}

/**
 * Show a tab, loading it the first time.
 *
 * `loaded` is set BEFORE the load resolves, so a double click cannot start two.
 * A failed load clears it, so the next click retries rather than leaving the
 * panel empty for ever.
 */
const loaded = new Set();

async function openTab(id, { reload = false } = {}) {
  if (!TABS.some(t => t.id === id)) id = DEFAULT_TAB;
  activeTab = id;

  for (const b of document.querySelectorAll('.tab')) {
    b.classList.toggle('active', b.dataset.tab === id);
  }
  for (const t of TABS) {
    const panel = panelFor(t.id);
    if (panel) panel.hidden = t.id !== id;
  }

  // The tab travels in the URL, so a refresh keeps your place and a link can
  // point somebody straight at the thing you are talking about.
  if (location.hash !== '#' + id) history.replaceState(null, '', '#' + id);

  if (loaded.has(id) && !reload) return;
  loaded.add(id);

  const panel = panelFor(id);
  panel.innerHTML = '<div class="loading">Loading…</div>';
  try {
    await TABS.find(t => t.id === id).load(panel);
  } catch (e) {
    loaded.delete(id);
    panel.innerHTML = '<div class="loading">Could not load this tab: ' + escapeHtml(String((e && e.message) || e)) + '</div>';
  }
}

/**
 * ATTENTION — what needs addressing, and the default.
 *
 * PAINTS IN TWO STAGES, deliberately. The alerts and the review queue are quick
 * reads; `/admin/api/system?days=3` checks every venue for gaps and then asks
 * how fresh the social data is, and it is the slowest endpoint on this page. If
 * the tab waited for all three it would feel exactly as slow as the old page
 * did, which is the whole thing being fixed.
 */
async function loadAttention(panel) {
  // take(), not api(): init prefetched these three before /api/me resolved, so
  // they are already in flight. Calling api() here would fetch each one twice.
  const quick = Promise.all([
    take('/admin/api/alerts'),
    take('/admin/api/notes?status=pending'),
  ]);
  const slow = take('/admin/api/system?days=3');

  const [alertsData, pendingData] = await quick;
  panel.innerHTML = '';

  // Reserved now, filled when the slow read lands, so System Health keeps its
  // place at the top rather than appearing under everything else.
  const healthSlot = el('div', '');
  panel.appendChild(healthSlot);

  renderAlerts(panel, alertsData.alerts || []);
  renderPending(panel, pendingData.notes || []);

  if (!(alertsData.alerts || []).length && !(pendingData.notes || []).length) {
    const ok = el('div', 'section');
    ok.innerHTML = '<h2>Nothing to address</h2>' +
      '<p style="color:var(--text-muted);font-size:13px">No open reconciliation alerts and nothing waiting for review. ' +
      'System Health is below once it has finished checking.</p>';
    panel.appendChild(ok);
  }

  renderSystem(healthSlot, await slow);
}

async function loadPeople(panel) {
  const [usersData] = await Promise.all([api('GET', '/admin/api/users'), loadVenues()]);
  panel.innerHTML = '';
  renderInvite(panel);
  renderRoleSlot(panel);
  renderUsers(panel, usersData.users || []);
}

async function loadConnections(panel) {
  const [xeroData] = await Promise.all([api('GET', '/admin/api/xero/connections'), loadVenues()]);
  panel.innerHTML = '';
  renderXero(panel, xeroData.connections || []);
  // These two fetch their own data on render, and Meta fetches nothing at all
  // until a button is pressed.
  renderIntegrations(panel);
  renderUpload(panel);
}

async function loadAccounting(panel) {
  await loadVenues();
  panel.innerHTML = '';
  // Both load their own bodies into a placeholder.
  renderAccountMap(panel);
  renderFees(panel);
}

async function loadKnowledge(panel) {
  const [notesData] = await Promise.all([api('GET', '/admin/api/notes'), loadVenues()]);
  panel.innerHTML = '';
  renderNotes(panel, notesData.notes || []);
}

/**
 * The counts on the tabs.
 *
 * Counts, not rows — the whole point is that it stays cheap enough to run on
 * every page load while the tabs themselves stay lazy. A failure is silent on
 * purpose: a missing badge is a missing hint, and taking the page down over one
 * would be the wrong trade.
 */
async function loadBadges() {
  let summary;
  try {
    summary = await take('/admin/api/summary');
    if (summary.error) return;
  } catch (e) {
    console.warn('[admin] could not load tab counts', e);
    return;
  }

  const counts = {
    attention: (summary.alerts || 0) + (summary.pending_notes || 0) + (summary.ingestion_errors || 0),
    knowledge: summary.pending_notes || 0,
  };

  for (const [id, n] of Object.entries(counts)) {
    const badge = document.querySelector('[data-badge="' + id + '"]');
    if (!badge) continue;
    badge.textContent = String(n);
    badge.hidden = n === 0;
  }
}

/**
 * Give every table a scroll container, including the ones not written yet.
 *
 * WHY AN OBSERVER AND NOT TEN EDITS. This page builds tables in about a dozen
 * places — render(), the Meta probes, the StaffAny probe, the Xero panel, the
 * account mappings — and several of them inject their HTML long after load,
 * when somebody clicks a probe button. Wrapping them at each call site means
 * finding all twelve today and remembering the thirteenth next year, and the
 * one that gets forgotten is the one added last. This is the same argument as
 * the page tests discovering pages rather than listing them: cover the shape,
 * not the instances.
 *
 * IT CANNOT LOOP. The observer's own insertion fires it again, that pass finds
 * every table already wrapped, and it mutates nothing — so the next pass is
 * never scheduled.
 */
function makeTablesScrollable(root) {
  for (const table of root.querySelectorAll('table')) {
    const parent = table.parentElement;
    if (!parent || parent.classList.contains('table-scroll')) continue;
    const wrap = document.createElement('div');
    wrap.className = 'table-scroll';
    parent.insertBefore(wrap, table);
    wrap.appendChild(table);
  }
}

function watchForTables() {
  const root = document.getElementById('app');
  if (!root) return;
  makeTablesScrollable(root);
  new MutationObserver(() => makeTablesScrollable(root))
    .observe(root, { childList: true, subtree: true });
}

/**
 * What every action on this page calls after it changes something.
 *
 * Reloads the TAB YOU ARE ON rather than the whole page. Every caller is a
 * handler inside one tab — inviting a user, mapping an account, approving a
 * note — so the tab it belongs to is the only one whose data moved. The badges
 * are refreshed too, because approving a note is exactly the kind of action
 * that should make a count go down in front of you.
 */
async function loadAll() {
  await openTab(activeTab || DEFAULT_TAB, { reload: true });
  loadBadges();
}

function renderInvite(root) {
  // Add User section
  const inviteSection = el('div', 'section');
  // No password field, deliberately. Supabase emails a one-time link and the
  // person sets their own, so nobody on this screen ever knows it — which is
  // what makes an action taken under an account attributable to its owner.
  inviteSection.innerHTML = `
    <h2>Invite User</h2>
    <form class="invite-form" id="invite-form">
      <input type="email" id="invite-email" placeholder="Email address" required>
      <input type="text" id="invite-name" placeholder="Full name (optional)">
      <button type="submit" class="btn">Send invitation</button>
    </form>
    <div style="font-size:12px;color:var(--text-muted);margin-top:8px;line-height:1.5;max-width:560px">
      They receive an email with a link to set their own password. You never see it.
      On first sign-in they must read and accept the confidentiality terms before
      Sauron will answer anything — that acceptance is recorded against their name.
      Give them a role below once they appear in the list.
    </div>
  `;
  root.appendChild(inviteSection);

  document.getElementById('invite-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('invite-email').value.trim();
    const name = document.getElementById('invite-name').value.trim();
    if (!email) return;

    const res = await api('POST', '/admin/api/users/invite', { email, full_name: name });
    if (res.error) {
      toast('error', res.error);
    } else {
      toast('success', 'Invitation sent to ' + email);
      document.getElementById('invite-email').value = '';
      document.getElementById('invite-name').value = '';
      await loadAll();
    }
  });
}

function renderRoleSlot(root) {
  /**
   * The reference, once, above the list.
   *
   * NOT awaited: render() is synchronous and making it async would change when
   * every caller's work completes for the sake of one panel.
   *
   * SO THE SLOT IS APPENDED NOW AND FILLED LATER. Appending inside the async
   * function put the grid at the BOTTOM of the page, below everything render()
   * had already added synchronously -- which is the opposite of the point, since
   * it exists to be read BEFORE somebody picks a role. Reserving the element
   * here fixes its position; only the contents arrive late.
   */
  const roleSlot = el('div', 'section');
  root.appendChild(roleSlot);
  renderRoleMatrix(roleSlot);

}

function renderUsers(root, users) {
  const usersSection = el('div', 'section');
  usersSection.id = 'users-section';
  fillUsers(usersSection, users);
  root.appendChild(usersSection);
}

/**
 * Re-draw the users table ALONE, without reloading the tab.
 *
 * Adding a role used to call loadAll(), which re-fetched the users, the venues
 * and the role-access grid and rebuilt the whole panel — a visible stall after
 * every single click, for a change that affects one row. Nothing else on this
 * tab moves when a role is granted.
 */
async function refreshUsers() {
  const section = document.getElementById('users-section');
  if (!section) return loadAll();   // not on the People tab; fall back
  const data = await api('GET', '/admin/api/users');
  if (data.error) { toast('error', data.error); return; }
  fillUsers(section, data.users || []);
  loadBadges();
}

function fillUsers(usersSection, users) {
  // Users table
  let tableHtml = `<h2>Users (${users.length})</h2>
    <table>
      <thead><tr><th>Name</th><th>Email</th><th>Terms</th><th>Venue Roles</th><th>Add Role</th><th></th></tr></thead>
      <tbody>`;

  for (const user of users) {
    const roles = (user.roles || []).map(r =>
      `<span class="role-badge role-${r.role}">${r.venue_name} - ${r.role}</span>
       <button class="btn btn-small btn-danger" onclick="removeRole('${r.id}')">x</button>`
    ).join(' ');

    /**
     * CHECKBOXES, NOT A DROPDOWN.
     *
     * Granting the same role at three venues meant three passes of: open a
     * native picker, choose, close, press Add, wait for the page to rebuild.
     * On a phone the picker is a full-screen modal, so it was fifteen taps and
     * three reloads to do one obvious thing. These are toggles, and Add applies
     * the role to everything ticked in one go.
     *
     * Nothing is pre-ticked or disabled by what the person already holds: the
     * role is chosen AFTER the venues, so a chip cannot know yet whether it
     * would be a change or a no-op. The grant upserts on (user, venue), so
     * ticking a venue they already hold CHANGES the role there, which is a
     * thing somebody legitimately wants to do. What they hold now is in the
     * column immediately to the left.
     */
    const venueChips = venues.map(v =>
      `<label class="venue-chip">
         <input type="checkbox" class="venue-pick" data-user="${user.id}" value="${v.id}" data-name="${esc(v.name)}">
         <span>${esc(v.name)}</span>
       </label>`
    ).join('');
    const isSelf = user.id === currentUserId;

    /**
     * Has this person agreed, and is it still current?
     *
     * A record only Supabase's SQL editor can show is most of the way to not
     * having one — the point of keeping it is being able to produce it. Expired
     * is called out separately from never, because the two need different
     * conversations.
     */
    const t = user.terms || { status: 'unknown' };
    const termsCell =
      t.status === 'accepted' ? `<span style="color:var(--success)" title="Expires ${esc((t.expires_at||'').slice(0,10))}">${esc((t.accepted_at||'').slice(0,10))}</span>`
      : t.status === 'expired' ? `<span style="color:var(--accent)" title="Last accepted ${esc((t.accepted_at||'').slice(0,10))}">expired</span>`
      : t.status === 'never' ? '<span style="color:var(--text-muted)">not yet</span>'
      : '<span style="color:var(--text-muted)" title="Run migration 042">—</span>';

    tableHtml += `<tr>
      <td data-label="Name">${esc(user.full_name || '-')}</td>
      <td data-label="Email">${esc(user.email)}</td>
      <td data-label="Terms" style="white-space:nowrap;font-size:12px">${termsCell}</td>
      <td data-label="Has access to"><div class="role-actions">${roles || '<span style="color:var(--text-muted)">No roles</span>'}</div></td>
      <td data-label="Grant access">
        <div class="venue-picker">${venueChips}</div>
        <div class="role-actions">
          <select id="role-${user.id}" onchange="showRoleAccess('${user.id}')">
            <option value="manager">Manager</option>
            <option value="staff">Staff</option>
            <option value="finance">Finance</option>
            <option value="owner">Owner</option>
          </select>
          <button class="btn btn-small" id="add-role-${user.id}" onclick="assignRole('${user.id}')">Add</button>
        </div>
        <!--
          What the selected role grants, shown before it is granted.
          Rendered from /admin/api/roles, which COMPUTES it from ROLE_DOMAINS
          and mayRead() -- the same functions the tool layer enforces with.
          Nothing here is hand-written, so it cannot drift away from what the
          server actually does and tell somebody the opposite with confidence.
        -->
        <div class="role-access" id="role-access-${user.id}"></div>
      </td>
      <td>
        <div class="user-actions">
          <button class="btn btn-small btn-outline" onclick="showResetPassword('${user.id}', '${esc(user.email)}')">Reset pw</button>
          ${isSelf ? '' : `<button class="btn btn-small btn-danger" onclick="confirmDeleteUser('${user.id}', '${esc(user.email)}')">Delete</button>`}
        </div>
      </td>
    </tr>`;
  }

  tableHtml += '</tbody></table>';
  usersSection.innerHTML = tableHtml;

  // Deliberately NOT pre-filled for every row any more. The grid above covers
  // what the roles mean; a line appears under a row only once somebody touches
  // its dropdown, so a page of a hundred users stays a page of a hundred users.

}

function renderSystem(root, system) {
  // System health
  const sysSection = el('div', 'section');
  sysSection.innerHTML = '<h2>System Health</h2>';

  const gapsCard = el('div', 'system-card');
  gapsCard.innerHTML = '<h4>Data Gaps (last 3 days)</h4>';
  if (system.missing && system.missing.length > 0) {
    for (const gap of system.missing) {
      const gapEl = el('div', 'gap-item');
      gapEl.textContent = `${gap.venue} (${gap.date}): missing ${gap.missing.join(', ')}`;
      gapsCard.appendChild(gapEl);
    }
  } else {
    const ok = el('div', 'no-gaps');
    ok.textContent = 'No data gaps detected.';
    gapsCard.appendChild(ok);
  }
  sysSection.appendChild(gapsCard);

  /**
   * Is the Meta ingest still running?
   *
   * Placed second, above the error list, because it is the only card here
   * watching for the ABSENCE of work. Everything else on this page reports a
   * fault in something that happened; on 20 Aug 2026 the Ingest-Meta service
   * crashed on startup, ran nothing for hours, produced no error to list, and
   * was found by accident. Stories expire in about 24 hours and Meta serves no
   * history for followers_count, so an outage here destroys data rather than
   * delaying it.
   */
  const socialCard = el('div', 'system-card');
  socialCard.innerHTML = '<h4>Social Ingest</h4>';
  const social = system.social;
  if (!social) {
    const unknown = el('div', 'gap-item');
    unknown.textContent = 'Not reported — the server may be running an older build.';
    socialCard.appendChild(unknown);
  } else if (social.ok) {
    const ok = el('div', 'no-gaps');
    ok.textContent = social.checked === 0
      ? 'No active social accounts are mapped.'
      : `All ${social.checked} account(s) written within ${social.max_age_hours}h.`;
    socialCard.appendChild(ok);
  } else {
    for (const s of social.stale) {
      const row = el('div', 'gap-item');
      row.textContent = s.hours_stale === null
        ? `${s.venue} (${s.platform}): NEVER ingested`
        : `${s.venue} (${s.platform}): last written ${s.hours_stale}h ago`;
      socialCard.appendChild(row);
    }
    // The consequence, not just the fact. "Stale" on its own reads as a delay,
    // and this is the one job here whose downtime is not recoverable.
    const why = el('div', 'gap-item');
    why.style.color = 'var(--text-muted)';
    why.textContent = 'Stories expire after ~24h and followers_count has no history at Meta — these are lost, not delayed. Check the Ingest-Meta service on Railway.';
    socialCard.appendChild(why);
  }
  sysSection.appendChild(socialCard);

  /**
   * Table protection, read from the live catalogue.
   *
   * Placed with the other absence-watchers rather than with the error lists,
   * because it reports a thing that never happened: reconciliation_alerts and
   * ingestion_log were created without row-level security and stayed that way
   * for about a year, one of them holding daily revenue per venue. The anon key
   * is public by design, so RLS is the only barrier between it and a table, and
   * the thing that eventually noticed was a vendor's scanner.
   *
   * Deny-all is shown in muted text and never in red. xero_connections is
   * correctly configured that way, and a card that is permanently red is a card
   * nobody reads.
   */
  const rlsCard = el('div', 'system-card');
  rlsCard.innerHTML = '<h4>Table Protection</h4>';
  const rls = system.rls;
  if (!rls) {
    const unknown = el('div', 'gap-item');
    unknown.textContent = 'Not reported — the server may be running an older build.';
    rlsCard.appendChild(unknown);
  } else {
    if (rls.ok) {
      const ok = el('div', 'no-gaps');
      ok.textContent = `All ${rls.checked} table(s) in public have row-level security.`;
      rlsCard.appendChild(ok);
    } else {
      for (const f of rls.exposed) {
        const row = el('div', 'gap-item');
        row.textContent = `public.${f.table}: ${f.detail}`;
        rlsCard.appendChild(row);
      }
      const fix = el('div', 'gap-item');
      fix.style.color = 'var(--text-muted)';
      fix.textContent = 'Fix in a migration: alter table ... enable row level security, plus a policy. Until then these rows are readable and writable by anyone who loads the login page.';
      rlsCard.appendChild(fix);
    }

    if (rls.deny_all && rls.deny_all.length > 0) {
      const note = el('div', 'gap-item');
      note.style.color = 'var(--text-muted)';
      note.textContent = `${rls.deny_all.length} table(s) deny every client and are readable only by the server: ${rls.deny_all.map(f => f.table).join(', ')}. Correct for secrets; check each is meant to be invisible.`;
      rlsCard.appendChild(note);
    }
  }
  sysSection.appendChild(rlsCard);

  const errCard = el('div', 'system-card');
  errCard.innerHTML = '<h4>Recent Errors</h4>';
  if (system.recent_errors && system.recent_errors.length > 0) {
    /**
     * UNRESOLVED FIRST. A failure a later run already repaired is history, not
     * a task, and leaving it interleaved at the top by timestamp means the
     * thing needing attention can sit below three that do not.
     */
    const ordered = system.recent_errors.slice().sort((a, b) => {
      const ar = a.resolved_at ? 1 : 0, br = b.resolved_at ? 1 : 0;
      return ar - br || String(b.created_at).localeCompare(String(a.created_at));
    });

    for (const err of ordered) {
      /**
       * WHAT IT MEANS FIRST, then what it said.
       *
       * "SevenRooms auth failed: HTTP 503" is precise and useless to most
       * people who will read this page: it does not say whether our password is
       * wrong or their server is down, and those need opposite responses — one
       * is a thing to fix, the other a thing to wait out. Somebody who cannot
       * tell them apart either escalates every blip or ignores a real outage.
       *
       * The raw message STAYS, underneath. It is what you quote to a vendor's
       * support desk and what you search for, and replacing it would move the
       * problem rather than solve it. Where we do not recognise an error there
       * is no sentence and the raw message appears alone, exactly as before.
       */
      const row = el('div', 'ingestion-error' + (err.resolved_at ? ' ie-is-resolved' : ''));

      /**
       * A RESOLVED FAILURE SAYS SO INSTEAD OF SAYING WHAT TO DO.
       *
       * The SevenRooms auth error of 29 Sep was still presented as a live
       * problem on 3 Oct, four days after the data it missed had been re-read
       * and loaded. Accurate about the past, misleading about the present — and
       * a panel full of those stops being read.
       *
       * It is marked rather than hidden, deliberately: a week of blips that
       * each self-healed is a pattern about the vendor that somebody should be
       * able to see. What changes is that it no longer looks like a task, and
       * no longer counts on the tab.
       */
      const label = err.resolved_at ? 'Resolved'
        : err.action === 'fix' ? 'Needs fixing'
        : err.action === 'wait' ? 'Should clear itself'
        : err.action === 'watch' ? 'Worth a look'
        : '';
      const kind = err.resolved_at ? 'resolved' : err.action;

      row.innerHTML =
        '<div class="ie-head">' +
          '<span class="status-err">' + esc(err.status) + '</span>' +
          (label ? '<span class="ie-action ie-' + esc(kind) + '">' + label + '</span>' : '') +
          '<span class="ie-when">' + fmtTime(err.created_at) + '</span>' +
        '</div>' +
        (err.explanation ? '<div class="ie-plain">' + esc(err.explanation) + '</div>' : '') +
        (err.resolved_at
          ? '<div class="ie-fixed">Already put right — ' + esc(err.resolved_because || 'a later run succeeded') +
            ' on ' + fmtTime(err.resolved_at) + '.</div>'
          : '') +
        '<div class="ie-raw">' + esc(err.status_raw || err.status) + ' · ' + esc(err.filename) + (err.error ? ' — ' + esc(err.error) : '') + '</div>';
      errCard.appendChild(row);
    }
  } else {
    const ok = el('div', 'no-gaps');
    ok.textContent = 'No recent errors.';
    errCard.appendChild(ok);
  }
  sysSection.appendChild(errCard);

  const ingCard = el('div', 'system-card');
  ingCard.innerHTML = '<h4>Recent Ingestions</h4>';
  if (system.recent_ingestions && system.recent_ingestions.length > 0) {
    for (const ing of system.recent_ingestions) {
      const row = el('div', 'ingestion-row');
      const cls = ing.status === 'success' ? 'status-ok' : 'status-err';
      row.innerHTML = `<span class="${cls}">${esc(ing.status)}</span>
        <span>${esc(ing.filename)}</span>
        <span style="color:var(--text-muted)">${ing.business_date || ''}</span>
        <span style="color:var(--text-muted)">${ing.row_count ? ing.row_count + ' rows' : ''}</span>
        <span style="color:var(--text-muted)">${fmtTime(ing.created_at)}</span>`;
      ingCard.appendChild(row);
    }
  }
  sysSection.appendChild(ingCard);

  root.appendChild(sysSection);

}

/** How many alerts are drawn at once. */
const ALERTS_PER_PAGE = 5;

function renderAlerts(root, alerts) {
  // Reconciliation alerts. These are data problems, not job failures -- the
  // Monday cron kept working while reporting them, and showed as failed for
  // days because a non-zero exit was conflating the two.
  if (!alerts || alerts.length === 0) return;

  const a = el('div', 'section');
  a.id = 'alerts-section';
  root.appendChild(a);
  drawAlerts(a, alerts, 0);
}

/**
 * One page of alerts.
 *
 * WHY PAGED. There are 272 open at the time of writing, and all 272 were drawn
 * on the default tab of the page people open first. That is a slow render of a
 * list nobody reads to the end, on the tab whose whole job is to be quick. Five
 * is about what fits on a phone without scrolling past the section.
 *
 * NOT TRUNCATED — PAGED. A silent cap would hide work, which is the failure
 * this codebase keeps writing down; the count and the page position are both on
 * screen, and every alert is still reachable.
 */
function drawAlerts(a, alerts, page) {
  const pages = Math.max(1, Math.ceil(alerts.length / ALERTS_PER_PAGE));
  const current = Math.min(Math.max(0, page), pages - 1);
  const from = current * ALERTS_PER_PAGE;
  const slice = alerts.slice(from, from + ALERTS_PER_PAGE);

  a.innerHTML = '<h2>Reconciliation alerts (' + alerts.length + ')</h2>' +
      '<p style="color:var(--text-muted);font-size:13px;margin-bottom:16px">Days where the numbers disagree &mdash; click one to see what moved. A post-lock change means Monday.com was edited after that month had closed (final from the 15th of the following month), so the edit was not taken and the two systems now hold different figures. Corrections made before close are applied normally and never appear here. Resolving clears every duplicate of the same finding.</p>' +
      slice.map(function (al) {
        const changeRows = (al.changes || []).map(function (c) {
          return '<div style="font-size:12px;color:var(--text-muted)">' +
            escapeHtml(c.period) + ' &middot; ' + escapeHtml(c.field) + ': ' +
            '<span style="color:var(--error)">' + escapeHtml(String(c.from)) + '</span> &rarr; ' +
            '<span style="color:var(--success)">' + escapeHtml(String(c.to)) + '</span></div>';
        }).join('');
        const dupes = al.duplicates > 1
          ? '<span title="' + al.duplicates + ' identical alerts for this day" style="font-size:11px;color:var(--text-muted);border:1px solid var(--border);border-radius:4px;padding:0 5px;margin-left:8px">&times;' + al.duplicates + '</span>'
          : '';
        const diff = (al.difference !== null && al.difference !== undefined)
          ? '<span style="font-size:12px;color:var(--text-muted);margin-left:8px">$' + escapeHtml(String(al.difference)) + '</span>'
          : '';
        return '<details class="alert-card" data-id="' + al.id + '" style="border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:8px">' +
          '<summary style="cursor:pointer;font-size:13px">' +
            '<span style="font-weight:600">' + escapeHtml(al.venue || 'Unknown venue') + '</span>' +
            '<span style="color:var(--text-muted)"> &middot; ' + escapeHtml(al.business_date) +
            ' &middot; ' + escapeHtml(al.alert_type.replace(/_/g, ' ')) + '</span>' +
            dupes + diff +
          '</summary>' +
          '<div style="margin-top:10px">' +
            (changeRows || '<div style="font-size:12px;color:var(--text-muted)">No field-level detail recorded for this alert.</div>') +
            '<div style="display:flex;gap:6px;margin-top:8px;align-items:center">' +
              '<input class="al-note" placeholder="What did you decide? (optional)" style="flex:1;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:6px 10px;color:var(--text);font-size:12px;font-family:inherit">' +
              '<button class="al-resolve btn btn-small">Resolve</button>' +
            '</div>' +
          '</div></details>';
      }).join('') +
      (pages > 1
        ? '<div class="pager">' +
            '<button class="btn btn-small btn-outline" data-page="' + (current - 1) + '"' + (current === 0 ? ' disabled' : '') + '>Previous</button>' +
            '<span class="pager-pos">' + (from + 1) + '&ndash;' + (from + slice.length) + ' of ' + alerts.length + '</span>' +
            '<button class="btn btn-small btn-outline" data-page="' + (current + 1) + '"' + (current === pages - 1 ? ' disabled' : '') + '>Next</button>' +
          '</div>'
        : '');

  a.querySelectorAll('.pager button[data-page]').forEach(function (b) {
    b.addEventListener('click', function () { drawAlerts(a, alerts, Number(b.dataset.page)); });
  });

  a.querySelectorAll('.alert-card').forEach(function (card) {
    card.querySelector('.al-resolve').addEventListener('click', async function () {
      const res = await api('POST', '/admin/api/alerts/' + card.dataset.id + '/resolve', {
        notes: card.querySelector('.al-note').value || null,
      });
      if (res.error) { toast('error', res.error); return; }

      /**
       * Refetch the ALERTS, not the tab.
       *
       * Resolving used to rebuild the whole Attention panel, which meant
       * waiting for the system-health check — the slowest read on the page —
       * after every click, and losing your place in the list. Resolving clears
       * every duplicate of the same finding, so the list genuinely has to come
       * back from the server rather than just dropping the one card.
       */
      const fresh = await api('GET', '/admin/api/alerts');
      if (fresh.error) { toast('error', fresh.error); return; }

      const remaining = fresh.alerts || [];
      if (remaining.length === 0) { a.remove(); loadBadges(); return; }

      // Stay on the page you were on, unless resolving emptied it.
      drawAlerts(a, remaining, Math.min(current, Math.ceil(remaining.length / ALERTS_PER_PAGE) - 1));
      loadBadges();
    });
  });
}

function renderPending(root, pendingNotes) {
  // Review queue — notes captured from conversations, awaiting approval.
  // Nothing here has reached a prompt yet: the system must never write its own
  // lessons, because a confident wrong answer would become a stored fact.
  if (pendingNotes && pendingNotes.length > 0) {
    const q = el('div', 'section');
    q.innerHTML = '<h2>Awaiting review (' + pendingNotes.length + ')</h2>' +
      '<p style="color:var(--text-muted);font-size:13px;margin-bottom:16px">Captured from conversations. Nothing here is used by Sauron until you approve it. Edit as you approve — correcting it is the point of the queue.</p>' +
      pendingNotes.map(function (n) {
        return '<div class="pending-note" data-id="' + n.id + '" style="border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:10px">' +
          (n.source_question ? '<div style="color:var(--text-muted);font-size:12px;margin-bottom:6px">Asked: ' + escapeHtml(n.source_question) + '</div>' : '') +
          '<textarea class="pn-text" rows="3" style="width:100%">' + escapeHtml(n.note) + '</textarea>' +
          '<div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;align-items:center">' +
            '<span style="color:var(--text-muted);font-size:12px">' + (n.venues ? escapeHtml(n.venues.name) : 'All venues') + ' &middot; ' + escapeHtml(n.confidence) + '</span>' +
            '<select class="pn-port"><option value="dandy_specific">Specific to us</option><option value="universal">General F&amp;B truth</option></select>' +
            '<button class="pn-approve">Approve</button>' +
            '<button class="pn-reject">Reject</button>' +
          '</div></div>';
      }).join('');
    root.appendChild(q);

    q.querySelectorAll('.pending-note').forEach(function (card) {
      const id = card.dataset.id;
      const send = async function (status) {
        const res = await api('POST', '/admin/api/notes/' + id + '/review', {
          status: status,
          note: card.querySelector('.pn-text').value,
          portability: card.querySelector('.pn-port').value,
        });
        if (res.error) { alert(res.error); return; }
        await loadAll();
      };
      card.querySelector('.pn-approve').addEventListener('click', function () { send('approved'); });
      card.querySelector('.pn-reject').addEventListener('click', function () { send('rejected'); });
    });
  }

}

function renderNotes(root, notes) {
  // Venue Notes section (AI context)
  const notesSection = el('div', 'section');
  const venueOpts2 = '<option value="">All venues</option>' + venues.map(v => `<option value="${v.id}">${v.name}</option>`).join('');
  let notesHtml = `<h2>AI Context Notes</h2>
    <p style="color:var(--text-muted);font-size:13px;margin-bottom:16px">Notes you add here are fed to the AI on every query. Use them for what the numbers can never say — who a venue is for, what you would never do, why something exists, and how you'd phrase it. The most valuable are the <strong>never do</strong> rules: one note stops every future briefing suggesting something you'd reject out of hand. Keep each note short and about one thing; fifty sharp notes beat one long document.</p>
    <div class="invite-form" id="note-form-container">
      <select id="note-venue" style="min-width:140px">${venueOpts2}</select>
      <select id="note-category" style="min-width:150px">
        <optgroup label="Who this venue is">
          <option value="positioning">Positioning — who it's for</option>
          <option value="voice">Voice — how we say things</option>
          <option value="intent">Intent — why something exists</option>
        </optgroup>
        <optgroup label="What we would never do">
          <option value="never_do">Never do — a hard rule</option>
          <option value="constraint">Constraint — can't, not won't</option>
        </optgroup>
        <optgroup label="Operating context">
          <option value="general">General</option>
          <option value="operations">Operations</option>
          <option value="menu">Menu</option>
          <option value="events">Events</option>
          <option value="promotions">Promotions</option>
          <option value="goals">Goals</option>
        </optgroup>
      </select>
      <input type="text" id="note-text" placeholder="e.g. Fat Prince runs happy hour 5-7pm weekdays with 20% off drinks" style="flex:2;min-width:240px">
      <button class="btn" id="note-add-btn">Add</button>
    </div>`;

  if (notes.length > 0) {
    notesHtml += '<div style="margin-top:12px">';
    for (const n of notes) {
      const venueName = n.venues?.name || 'All venues';
      notesHtml += `<div class="file-item" style="margin-bottom:6px">
        <span class="role-badge role-${n.category === 'operations' ? 'manager' : n.category === 'promotions' ? 'owner' : n.category === 'goals' ? 'finance' : 'staff'}">${esc(n.category)}</span>
        <span style="color:var(--accent);font-size:12px;flex-shrink:0">${esc(venueName)}</span>
        <span class="fname">${esc(n.note)}</span>
        <span class="fsize">${fmtTime(n.created_at)}</span>
        <button class="fremove" onclick="deleteNote('${n.id}')">&times;</button>
      </div>`;
    }
    notesHtml += '</div>';
  } else {
    notesHtml += '<div style="color:var(--text-muted);font-size:13px;margin-top:12px">No notes yet. Add context to make the AI smarter about your business.</div>';
  }

  notesSection.innerHTML = notesHtml;
  root.appendChild(notesSection);

  /**
   * Attached HERE, beside the form it drives.
   *
   * It used to sit four hundred lines below, after the Meta handlers, because
   * render() built everything into one page and the order did not matter. It
   * matters now: the form is on the Knowledge tab and those handlers are on
   * Connections, so this ran when a tab that has no note form was opened and
   * took the whole tab down with "Cannot read properties of null".
   */
  document.getElementById('note-add-btn').addEventListener('click', async () => {
    const noteText = document.getElementById('note-text').value.trim();
    if (!noteText) return;
    const venueId = document.getElementById('note-venue').value;
    const category = document.getElementById('note-category').value;
    const res = await api('POST', '/admin/api/notes', { venue_id: venueId || null, note: noteText, category });
    if (res.error) {
      toast('error', res.error);
    } else {
      toast('success', 'Note added');
      document.getElementById('note-text').value = '';
      await loadAll();
    }
  });

}

function renderXero(root, xeroConnections) {
  // Xero section
  const xeroSection = el('div', 'section');
  const connRows = (xeroConnections || []).map(cn => {
    const mapped = cn.venues ? cn.venues.name : null;
    // A Xero organisation is a legal entity, so the name will not match the
    // venue's. Nothing is ingested until a human says which is which.
    const venueSelect = '<option value="">— not mapped —</option>' +
      venues.map(v => `<option value="${v.id}"${cn.venue_id === v.id ? ' selected' : ''}>${v.name}</option>`).join('');
    return `<tr>
      <td><strong>${cn.tenant_name || '(unnamed)'}</strong><br><span style="color:var(--text-muted);font-size:11px">${cn.tenant_id}</span></td>
      <td><select data-conn="${cn.id}" class="xero-venue" style="min-width:150px">${venueSelect}</select></td>
      <td>${mapped ? 'active' : 'awaiting mapping'}${cn.last_error ? `<br><span style="color:#c00;font-size:11px">${cn.last_error}</span>` : ''}</td>
    </tr>`;
  }).join('');

  xeroSection.innerHTML = `<h2>Xero</h2>
    <p style="color:var(--text-muted);font-size:13px;margin-bottom:16px">
      Connect a Xero login to pull P&amp;L and cost data. One Xero organisation per venue.
      Organisations are legal entities and their names will not match venue names, so each
      one has to be mapped by hand — nothing is ingested against an unmapped organisation.
    </p>
    <button id="xero-connect-btn" class="btn">Connect Xero</button>
    ${connRows ? `<table style="margin-top:16px"><thead><tr><th>Xero organisation</th><th>Venue</th><th>Status</th></tr></thead><tbody>${connRows}</tbody></table>` : '<p style="color:var(--text-muted);font-size:13px;margin-top:12px">No organisations connected yet.</p>'}`;
  root.appendChild(xeroSection);

  document.getElementById('xero-connect-btn').addEventListener('click', async () => {
    // The session token cannot ride a browser navigation, so the URL is
    // fetched with it and the redirect happens here.
    const res = await api('GET', '/xero/connect');
    if (res.error) { alert('Could not start Xero connection: ' + res.error); return; }
    window.location = res.url;
  });

  for (const sel of document.querySelectorAll('.xero-venue')) {
    sel.addEventListener('change', async (e) => {
      const venueId = e.target.value;
      if (!venueId) return;
      const res = await api('POST', `/admin/api/xero/connections/${e.target.dataset.conn}/venue`, { venue_id: venueId });
      if (res.error) { alert('Could not map: ' + res.error); return; }
      await loadAll();
    });
  }

}

function renderAccountMap(root) {
  /**
   * Account map. The three ledgers spell the same cost differently, so this is
   * what makes a cross-venue comparison mean anything.
   *
   * Unmapped accounts are shown FIRST and in the error colour. An unmapped
   * account is not broken -- it resolves to its own name, merges nothing and
   * moves no figure -- but it will not match the equivalent account at another
   * venue, and that is invisible in an answer. So it is visible here.
   */
  const mapSection = el('div', 'section');
  mapSection.innerHTML = '<h2>Account Map</h2>' +
    '<p style="color:var(--text-muted);font-size:13px;margin-bottom:16px">' +
    'Each venue\'s ledger name, and the shared name it rolls up to. Sauron compares venues on the shared name — Fat Prince writes "Public Relations / Marketing costs" where the others write "fees", and without this they never add up. ' +
    'Business line separates a sub-business that still belongs in the venue\'s P&amp;L: Neon Pigeon\'s sushi rolls into Potus Pte Ltd and can also be reported on its own.' +
    '</p><div id="map-body">Loading…</div>';
  root.appendChild(mapSection);
  loadAccountMap();

}

function renderFees(root) {
  /**
   * Fee months somebody has explained.
   *
   * feeAnomalies() found Neon Pigeon's June 2026 fee at 1.99% of income and put
   * it on the briefing. Finance answered: the rate was set lower by the founder.
   * With no way to record that, the check would flag the same month every Monday
   * for the rest of the year -- and a monitor that cries wolf weekly is one
   * nobody reads by the time it catches a real error.
   *
   * The reason is required, and the briefing STATES it rather than going quiet:
   * a check that falls silent is indistinguishable from one that broke.
   */
  const feeSection = el('div', 'section');
  feeSection.innerHTML = '<h2>Explained Fee Months</h2>' +
    '<p style="color:var(--text-muted);font-size:13px;margin-bottom:16px">' +
    'Sauron checks the fee each venue pays the group against that venue\'s own history, and flags a month that is out of line. ' +
    'When a month is out of line for a known reason — a rate set differently by decision — record it here. ' +
    'The briefing still shows the month and states your reason; it just stops calling it a finding. ' +
    '<strong>One month at a time, never a whole venue</strong> — otherwise the same month next year goes unchecked too.' +
    '</p><div id="fee-body">Loading…</div>';
  root.appendChild(feeSection);
  loadFeeAcks();

}

function renderIntegrations(root) {
  // Meta. Not loaded with the page -- it is several Graph calls plus a probe
  // per Instagram account, and the answer only changes while someone is
  // actually setting this up.
  const metaSection = el('div', 'section');
  metaSection.innerHTML = '<h2>Meta (Instagram &amp; Facebook)</h2>' +
    '<p style="color:var(--text-muted);font-size:13px;margin-bottom:12px">Lists every Page and Instagram account the System User token can reach, and asks each Instagram account for one day of data. Having an account id is not the same as being able to read it &mdash; only the probe tells you which.</p>' +
    '<div class="btn-row">' +
      '<button id="meta-discover-btn" class="btn">Discover accounts</button>' +
      '<button id="meta-ingest-btn" class="btn">Pull last 30 days</button>' +
      '<button id="meta-probe-btn" class="btn">Probe metric names</button>' +
      '<button id="meta-sample-btn" class="btn">Sample raw response</button>' +
      '<button id="meta-calibrate-btn" class="btn">Calibrate day alignment</button>' +
    '</div>' +
    '<div id="meta-result" style="margin-top:16px"></div>';
  root.appendChild(metaSection);

  // StaffAny. Same shape as the Meta probes above and here for the same reason:
  // it is nine calls to a third party, so it runs on a click rather than on
  // page load. It replaced a terminal script that needed a local clone and a
  // CLI login, which was the one diagnostic in this system that did not ship
  // through GitHub.
  const staffSection = el('div', 'section');
  staffSection.innerHTML = '<h2>StaffAny (rosters &amp; labour)</h2>' +
