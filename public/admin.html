    '<p style="color:var(--text-muted);font-size:13px;margin-bottom:12px">Asks StaffAny what this token can actually reach, for the last complete week. Reads only &mdash; nothing is written, and no payroll, compensation or staff endpoint is called. Re-run it whenever StaffAny change something on their side; the answer is expected to move.</p>' +
    // Dates, because a single empty week proves nothing on its own. The
    // endpoint has always accepted them; only the button did not pass them, so
    // testing another week meant shipping a commit.
    '<div class="btn-row">' +
      '<input type="date" id="staffany-start">' +
      '<input type="date" id="staffany-end">' +
      '<button id="staffany-probe-btn" class="btn">Probe StaffAny</button>' +
    '</div>' +
    '<div style="color:var(--text-muted);font-size:12px;margin-top:6px">Leave the dates blank for the last complete week.</div>' +
    '<div id="staffany-result" style="margin-top:16px"></div>' +
    // The mapping, on the same panel as the probe, because the probe is what
    // tells you a new section exists and this is where you act on it.
    '<h4 style="margin-top:24px">Section mapping</h4>' +
    '<button id="staffany-refresh-btn" class="btn" style="margin-bottom:10px">Refresh sections from StaffAny</button>' +
    '<p style="color:var(--text-muted);font-size:13px;margin-bottom:12px">Which venue each StaffAny section belongs to, and whether it is kitchen or floor. Nothing is guessed from the name &mdash; two of the three legal entities here are called Potus and 20 Craig Road. <strong>An unmapped section is not ingested</strong>, so its labour is missing until somebody confirms it here. Timesheets can be re-fetched, so mapping it later loses nothing.</p>' +
    '<div id="staffany-sections">Loading&hellip;</div>';
  root.appendChild(staffSection);

  async function loadStaffAnySections() {
    const out = document.getElementById('staffany-sections');
    const res = await take('/admin/api/staffany/sections');
    const list = res.sections || [];

    if (res.error) {
      out.innerHTML = '<p style="font-size:13px;color:var(--error)">' + escapeHtml(res.error) + '</p>';
      return;
    }
    if (list.length === 0) {
      // Sections are recorded by the ingest, so an empty list means it has not
      // run rather than that StaffAny has none.
      out.innerHTML = '<p style="font-size:13px;color:var(--text-muted)">No sections recorded yet. They appear the first time the labour ingest runs.</p>';
      return;
    }

    const opts = '<option value="">— unmapped —</option>' +
      venues.map(function (v) { return '<option value="' + v.id + '">' + escapeHtml(v.name) + '</option>'; }).join('');

    out.innerHTML = list.map(function (s) {
      // GROUP is mapped WITHOUT a venue. Those hours belong to every venue and
      // are stored unallocated, so requiring one would keep the group section
      // permanently red.
      const mapped = s.area === 'GROUP' || (s.venue_id && s.area);
      return '<div class="file-item" style="margin-bottom:6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">' +
        '<span style="min-width:200px">' + escapeHtml(s.section_name) +
          (s.section_tag ? ' <span style="color:var(--text-muted)">[' + escapeHtml(s.section_tag) + ']</span>' : '') + '</span>' +
        '<select data-section="' + escapeHtml(s.staffany_section_id) + '" class="sa-venue" style="min-width:150px">' + opts + '</select>' +
        '<select data-section="' + escapeHtml(s.staffany_section_id) + '" class="sa-area" style="min-width:110px">' +
          '<option value="">— area —</option>' +
          '<option value="BOH">BOH</option><option value="FOH">FOH</option><option value="GROUP">Group</option>' +
        '</select>' +
        (mapped
          ? '<span style="color:var(--success);font-size:12px">' + (s.area === 'GROUP' ? 'group — no venue' : 'mapped') + '</span>'
          : '<span style="color:var(--error);font-size:12px">NOT INGESTED</span>') +
        '</div>';
    }).join('');

    // Selects are populated after insertion rather than by marking `selected`
    // in the markup, which keeps the option strings identical for every row.
    for (const s of list) {
      const v = out.querySelector('.sa-venue[data-section="' + s.staffany_section_id + '"]');
      const a = out.querySelector('.sa-area[data-section="' + s.staffany_section_id + '"]');
      if (v) v.value = s.venue_id || '';
      if (a) a.value = s.area || '';
    }

    for (const el2 of out.querySelectorAll('.sa-venue, .sa-area')) {
      el2.addEventListener('change', async function () {
        const id = this.getAttribute('data-section');
        const venueEl = out.querySelector('.sa-venue[data-section="' + id + '"]');
        const areaEl = out.querySelector('.sa-area[data-section="' + id + '"]');
        const r = await api('PUT', '/admin/api/staffany/sections', {
          staffany_section_id: id,
          venue_id: venueEl.value || null,
          area: areaEl.value || null,
        });
        if (r.error) alert(r.error);
        loadStaffAnySections();
      });
    }
  }
  loadStaffAnySections();

  document.getElementById('staffany-refresh-btn').addEventListener('click', async () => {
    const out = document.getElementById('staffany-sections');
    out.innerHTML = '<p style="font-size:13px;color:var(--text-muted)">Asking StaffAny&hellip;</p>';
    const r = await api('POST', '/admin/api/staffany/sections/refresh');
    if (r.error) {
      out.innerHTML = '<p style="font-size:13px;color:var(--error)">' + escapeHtml(r.error) + '</p>';
      return;
    }
    loadStaffAnySections();
  });

  document.getElementById('staffany-probe-btn').addEventListener('click', async () => {
    const out = document.getElementById('staffany-result');
    out.innerHTML = '<p style="color:var(--text-muted);font-size:13px">Asking StaffAny. Nine calls, so give it a few seconds&hellip;</p>';

    const s = document.getElementById('staffany-start').value;
    const e = document.getElementById('staffany-end').value;
    const qs = s && e ? '?start=' + encodeURIComponent(s) + '&end=' + encodeURIComponent(e) : '';

    const r = await api('GET', '/admin/api/staffany/probe' + qs);
    if (r.error) {
      out.innerHTML = '<p style="font-size:13px;color:var(--error);white-space:normal">' + escapeHtml(r.error) + '</p>';
      return;
    }

    // A refusal is an ANSWER, not a failure, so a non-OK line is coloured as a
    // finding rather than as a fault. A 403 on schedule-costs settles a design
    // decision and is worth more than most successes.
    function status(o, label, extra) {
      const state = o.ok
        ? '<span style="color:var(--success)">OK</span>'
        : '<span style="color:var(--error)">' + escapeHtml(String(o.status)) + '</span>';
      return '<tr><td style="padding:4px 12px 4px 0">' + escapeHtml(label) + '</td>' +
        '<td style="padding:4px 12px 4px 0">' + state + '</td>' +
        '<td style="padding:4px 0;color:var(--text-muted);white-space:normal">' +
        escapeHtml(o.ok ? (extra || '') : (o.error || '')) + '</td></tr>';
    }

    const counts = function (rows) {
      return (rows || []).map(function (s) {
        return escapeHtml(s.name) + ' ' + s.count;
      }).join(' &middot; ');
    };

    const ts = r.timesheets_v1;
    const cost = r.schedule_costs;

    out.innerHTML =
      '<div style="font-size:13px;color:var(--text-muted);margin-bottom:12px">' +
        escapeHtml(r.organisation || 'organisation not named') + ' &middot; week of ' +
        escapeHtml(r.window.start) + ' to ' + escapeHtml(r.window.end) +
      '</div>' +

      // The conclusions first. The counts below are the evidence for them, and
      // a reader who stops after the first block should still have the answer.
      (r.verdicts.length
        ? '<div style="margin-bottom:16px">' + r.verdicts.map(function (v) {
            return '<div class="gap-item" style="white-space:normal;margin-bottom:6px">' + escapeHtml(v) + '</div>';
          }).join('') + '</div>'
        : '<div class="gap-item" style="margin-bottom:16px">Nothing conclusive. Read the counts below.</div>') +

      '<table style="font-size:13px;border-collapse:collapse;width:100%">' +
        status(r.me, 'me', r.organisation || '') +
        status(r.permissions, 'access level', (r.permissions.access_level || 'none reported') + ' · ' + (r.permissions.scopes.length + ' scope(s)')) +
        // NONE in the section column is the whole answer when the rosters come
        // back empty, so it is stated rather than left as an absent list.
        status(r.groups, 'my sections', r.groups.sections.length ? r.groups.sections.join(', ') : 'NONE') +
        status(r.sections, 'sections', r.sections.items.length + ' section(s)') +
        status(r.roles, 'roles', r.roles.names.length + ' role(s)') +
        // Which request form worked is carried on the row, because it is what
        // the ingest has to copy exactly and it is invisible otherwise.
        status(r.shifts, 'shifts' + (r.shifts.attempt ? ' (' + escapeHtml(r.shifts.attempt) + ')' : ''),
          r.shifts.total + ' shift(s) over ' + r.shifts.pages + ' page(s)' + (r.shifts.truncated ? ' — TRUNCATED' : '') +
          ': ' + r.shifts.published + ' published, ' + r.shifts.unpublished + ' unpublished') +
        status(r.shift_slots, 'shift-slots', r.shift_slots.published_only + ' published-only, ' + r.shift_slots.incl_unpublished + ' incl. unpublished; ' + r.shift_slots.assigned + ' assigned') +
        status(cost, 'schedule-costs', cost.rows + ' row(s), section total ' + (cost.total === null ? 'n/a' : cost.total.toFixed(2))) +
        status(ts, 'timesheets v1' + (ts.encoding ? ' (' + escapeHtml(ts.encoding) + ')' : ''),
          ts.work_hours + ' work-hour row(s) over ' + ts.pages + ' page(s)' + (ts.truncated ? ' — TRUNCATED' : '') +
          ', ' + ts.distinct_staff + ' distinct staff') +
        // Cost on the ungated endpoint, which the spec does not document. The
        // row says how many carried a number, never what any person earned.
        status(ts, 'labour cost', ts.cost_rows > 0
          ? ts.cost_rows + ' of ' + ts.work_hours + ' rows carry a cost'
          : (ts.cost_field_type ? 'field present, type ' + ts.cost_field_type + ', did not sum' : 'no cost field')) +
      '</table>' +

      (r.shifts.by_section.length
        ? '<div style="margin-top:12px;font-size:12px;color:var(--text-muted);white-space:normal"><strong>Shifts by section:</strong> ' + counts(r.shifts.by_section) + '</div>'
        : '') +
      (ts.by_section.length
        ? '<div style="margin-top:6px;font-size:12px;color:var(--text-muted);white-space:normal"><strong>Work-hour rows by section:</strong> ' + counts(ts.by_section) + '</div>'
        : '') +
      (ts.hours_by_section.length
        ? '<div style="margin-top:6px;font-size:12px;color:var(--text-muted);white-space:normal"><strong>Hours by section:</strong> ' + counts(ts.hours_by_section) + '</div>'
        : '') +
      // SECTION totals only. A per-person figure is that person's earnings and
      // never reaches this page.
      (ts.cost_by_section.length
        ? '<div style="margin-top:6px;font-size:12px;color:var(--text-muted);white-space:normal"><strong>Cost by section:</strong> ' + counts(ts.cost_by_section) + '</div>'
        : '') +
      // Basic against overtime against weekend. A total says labour was
      // expensive; the split says why, and overtime is the part with a lever
      // on it.
      // What StaffAny USED, beside what we can divide. Distinct values with row
      // counts, never a row: a rate attached to a person is their pay.
      (ts.calculation_inputs && ts.calculation_inputs.length
        ? '<div style="margin-top:12px;font-size:12px;color:var(--text-muted);white-space:normal"><strong>Calculation inputs:</strong><br>' +
          ts.calculation_inputs.map(function (f) {
            return escapeHtml(f.field) + ' &mdash; ' + escapeHtml(f.values.join(', ')) +
              (f.distinct > f.values.length ? ' &hellip; (' + f.distinct + ' distinct)' : '');
          }).join('<br>') + '</div>'
        : '') +
      (ts.cost_components && ts.cost_components.length
        ? '<div style="margin-top:6px;font-size:12px;color:var(--text-muted);white-space:normal"><strong>Cost components:</strong> ' + counts(ts.cost_components) + '</div>'
        : '') +
      // The real field list decides whether hours are a subtraction or must be
      // rebuilt from clock attempts, and the published spec understates it.
      (ts.work_hour_fields.length
        ? '<div style="margin-top:6px;font-size:12px;color:var(--text-muted);white-space:normal"><strong>Work-hour fields:</strong> ' + escapeHtml(ts.work_hour_fields.join(', ')) + '</div>'
        : '') +
      (r.sections.items.length
        ? '<div style="margin-top:12px;font-size:12px;color:var(--text-muted);white-space:normal"><strong>Sections:</strong> ' +
          r.sections.items.map(function (s) { return escapeHtml(s.name + (s.tag ? ' [' + s.tag + ']' : '')); }).join(' &middot; ') + '</div>'
        : '') +
      (r.roles.names.length
        ? '<div style="margin-top:6px;font-size:12px;color:var(--text-muted);white-space:normal"><strong>Roles:</strong> ' + escapeHtml(r.roles.names.join(', ')) + '</div>'
        : '') +
      // The scope list is what StaffAny will ask for by name if any are
      // missing, so it is printed in full rather than counted.
      (r.permissions.scopes.length
        ? '<div style="margin-top:6px;font-size:12px;color:var(--text-muted);white-space:normal"><strong>Permission scopes:</strong> ' + escapeHtml(r.permissions.scopes.join(', ')) + '</div>'
        : '') +

      // Stated on the page, not only in the code. With Xero the protection is a
      // scope we refused and cannot use by accident; here every payroll
      // endpoint is on the free surface and reachable with this token, so not
      // calling them is the whole of it, and the next person to edit this
      // should know that before they add one.
      '<div style="margin-top:16px;font-size:12px;color:var(--text-muted);white-space:normal">' +
        '<strong>Never called:</strong> ' + escapeHtml(r.not_called.join(', ')) + '. ' +
        'None of them is gated &mdash; every one is reachable with this token. Not calling them is the entire protection.' +
      '</div>';
  });

  document.getElementById('meta-discover-btn').addEventListener('click', async () => {
    const out = document.getElementById('meta-result');
    out.innerHTML = '<p style="color:var(--text-muted);font-size:13px">Asking Meta&hellip;</p>';

    const res = await api('GET', '/admin/api/meta/discover');
    const accounts = res.accounts || [];
    const errors = res.errors || [];

    const rows = accounts.map(function (a) {
      const readable = a.insights_readable === true
        ? '<span style="color:var(--success)">readable</span>'
        : a.insights_readable === false
          ? '<span style="color:var(--error)">no data</span>'
          : '<span style="color:var(--text-muted)">not probed</span>';
      return '<tr>' +
        '<td>' + escapeHtml(a.platform) + '</td>' +
        '<td>' + escapeHtml(a.account_name || '(unnamed)') + '</td>' +
        '<td style="font-family:monospace;font-size:12px">' + escapeHtml(a.account_id) + '</td>' +
        '<td><select class="meta-venue" data-platform="' + escapeHtml(a.platform) + '" data-account="' + escapeHtml(a.account_id) + '" data-name="' + escapeHtml(a.account_name || '') + '" style="min-width:150px">' +
          '<option value="">&mdash; not mapped &mdash;</option>' +
          venues.map(function (v) {
            return '<option value="' + v.id + '"' + (a.mapped_venue === v.name ? ' selected' : '') + '>' + escapeHtml(v.name) + '</option>';
          }).join('') +
        '</select></td>' +
        '<td>' + readable + '</td>' +
        '<td style="font-size:12px;color:var(--text-muted);max-width:340px;white-space:normal">' + escapeHtml(a.error || '') + '</td>' +
        '</tr>';
    }).join('');

    out.innerHTML =
      (accounts.length
        ? '<table><thead><tr><th>Platform</th><th>Name</th><th>Account id</th><th>Venue</th><th>Insights</th><th>Detail</th></tr></thead><tbody>' + rows + '</tbody></table>'
        : '<p style="color:var(--text-muted);font-size:13px">No accounts returned.</p>') +
      (errors.length
        ? '<div style="margin-top:14px"><div style="font-size:12px;font-weight:600;margin-bottom:6px">Notes</div>' +
          errors.map(function (e) {
            return '<div style="font-size:12px;color:var(--text-muted);margin-bottom:4px;white-space:normal">' + escapeHtml(e) + '</div>';
          }).join('') + '</div>'
        : '');

    // Attached here, not at render time: these selects only exist once the
    // discovery call has come back.
    for (const sel of out.querySelectorAll('.meta-venue')) {
      sel.addEventListener('change', async function (e) {
        const t = e.target;
        if (!t.value) return;
        const res = await api('POST', '/admin/api/meta/map', {
          platform: t.dataset.platform,
          account_id: t.dataset.account,
          account_name: t.dataset.name || null,
          venue_id: t.value,
        });
        if (res.error) { alert('Could not map: ' + res.error); return; }
        t.style.outline = '2px solid var(--success)';
      });
    }
  });

  document.getElementById('meta-ingest-btn').addEventListener('click', async () => {
    const out = document.getElementById('meta-result');
    out.innerHTML = '<p style="color:var(--text-muted);font-size:13px">Pulling&hellip; this takes a few seconds per account.</p>';

    const res = await api('POST', '/admin/api/meta/ingest', { days: 30 });
    if (res.error && !(res.results || []).length) {
      out.innerHTML = '<p style="font-size:13px;color:var(--error)">' + escapeHtml(res.error) + '</p>';
      return;
    }

    const rows = (res.results || []).map(function (r) {
      // A metric Graph refused is reported even when the pull succeeded --
      // storing two metrics out of three and calling it clean is how a feed
      // goes quietly half-dark.
      const failed = r.failed_metrics ? Object.keys(r.failed_metrics) : [];
      return '<tr>' +
        '<td>' + escapeHtml(r.account_name || r.account_id || '') + '</td>' +
        // A deliberate skip is not a failure. Colouring it red teaches people
        // to ignore red, and then the real one goes unread too.
        '<td>' + (r.stored
          ? '<span style="color:var(--success)">' + r.rows + ' rows</span>'
          : r.skipped
            ? '<span style="color:var(--text-muted)">skipped</span>'
            : '<span style="color:var(--error)">not stored</span>') + '</td>' +
        '<td style="font-size:12px;color:var(--text-muted);white-space:normal;max-width:420px">' +
          escapeHtml(r.error || '') +
          (failed.length ? '<br>Metrics refused: ' + escapeHtml(failed.join(', ')) : '') +
          ((r.missing_days || []).length ? '<br>No data on ' + r.missing_days.length + ' day(s)' : '') +
        '</td></tr>';
    }).join('');

    out.innerHTML = '<p style="font-size:13px;color:var(--text-muted)">' + escapeHtml(res.since || '') + ' to ' + escapeHtml(res.until || '') + '</p>' +
      '<table><thead><tr><th>Account</th><th>Stored</th><th>Detail</th></tr></thead><tbody>' + rows + '</tbody></table>';
  });

  document.getElementById('meta-calibrate-btn').addEventListener('click', async () => {
    const out = document.getElementById('meta-result');
    out.innerHTML = '<p style="color:var(--text-muted);font-size:13px">Pulling reach both ways over a week&hellip;</p>';

    const res = await api('GET', '/admin/api/meta/calibrate');
    if (res.error) {
      out.innerHTML = '<p style="font-size:13px;color:var(--error)">' + escapeHtml(res.error) + '</p>';
      return;
    }

    const dates = Object.keys(res.per_day_total_value || {}).sort();
    const rows = dates.map(function (d) {
      const a = (res.daily_series || {})[d];
      const b = (res.per_day_total_value || {})[d];
      const same = a === b;
      return '<tr><td>' + escapeHtml(d) + '</td>' +
        '<td class="r">' + (a === undefined ? '&mdash;' : a) + '</td>' +
        '<td class="r">' + (b === undefined ? '&mdash;' : b) + '</td>' +
        '<td>' + (same ? '<span style="color:var(--success)">same</span>' : '<span style="color:var(--text-muted)">differs</span>') + '</td></tr>';
    }).join('');

    const colour = res.verdict === 'aligned' ? 'var(--success)' : res.verdict === 'off_by_one' ? 'var(--error)' : 'var(--text-muted)';
    out.innerHTML =
      '<p style="font-size:14px;font-weight:600;color:' + colour + '">' + escapeHtml(res.verdict || '') + '</p>' +
      '<p style="font-size:13px;color:var(--text-muted);white-space:normal;max-width:70ch">' + escapeHtml(res.note || '') + '</p>' +
      '<p style="font-size:12px;color:var(--text-muted)">Same-day agreements: ' + res.matches + ' &middot; agreements one day back: ' + res.matches_shifted_back + '</p>' +
      '<table><thead><tr><th>Date asked for</th><th class="r">Dated series</th><th class="r">total_value</th><th>Agreement</th></tr></thead><tbody>' + rows + '</tbody></table>';
  });

  document.getElementById('meta-sample-btn').addEventListener('click', async () => {
    const out = document.getElementById('meta-result');
    out.innerHTML = '<p style="color:var(--text-muted);font-size:13px">Fetching one raw response&hellip;</p>';

    // `views` over three days: enough to show whether Meta returns one total or
    // a value per day, which is the whole question.
    const res = await api('GET', '/admin/api/meta/sample?platform=instagram&metric=views&form=total_value&days=3');
    out.innerHTML =
      '<p style="font-size:13px;color:var(--text-muted)">' +
        escapeHtml(res.account || '') + ' &middot; ' + escapeHtml(res.metric || '') +
        ' (' + escapeHtml(res.form || '') + ') &middot; ' + escapeHtml(res.since || '') + ' to ' + escapeHtml(res.until || '') +
      '</p>' +
      '<pre style="background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:12px;font-size:11px;overflow-x:auto;white-space:pre-wrap;word-break:break-word">' +
        escapeHtml(JSON.stringify(res.raw || res.error || res, null, 2)) +
      '</pre>';
  });

  document.getElementById('meta-probe-btn').addEventListener('click', async () => {
    const out = document.getElementById('meta-result');
    out.innerHTML = '<p style="color:var(--text-muted);font-size:13px">Trying every candidate metric name against the API. This takes a minute&hellip;</p>';

    const res = await api('POST', '/admin/api/meta/probe-metrics');
    if (res.error && !(res.results || []).length) {
      out.innerHTML = '<p style="font-size:13px;color:var(--error)">' + escapeHtml(res.error) + '</p>';
      return;
    }

    out.innerHTML = (res.results || []).map(function (r) {
      const ok = (r.probes || []).filter(function (p) { return p.ok; });
      const bad = (r.probes || []).filter(function (p) { return !p.ok; });
      return '<div style="margin-bottom:20px">' +
        '<div style="font-weight:600;margin-bottom:6px">' + escapeHtml(r.platform) + ' &middot; ' + escapeHtml(r.account_name || '') + '</div>' +
        (ok.length
          ? '<div style="font-size:13px;margin-bottom:6px"><span style="color:var(--success)">Accepted:</span> ' +
            ok.map(function (p) { return escapeHtml(p.metric) + ' <span style="color:var(--text-muted);font-size:11px">(' + escapeHtml(p.form) + ')</span>'; }).join(', ') +
            '</div>'
          : '<div style="font-size:13px;color:var(--error);margin-bottom:6px">Nothing accepted.</div>') +
        (bad.length
          ? '<div style="font-size:12px;color:var(--text-muted)">Rejected: ' + bad.map(function (p) { return escapeHtml(p.metric); }).join(', ') +
            // The reason matters: "not a valid metric" is a name problem,
            // anything about permissions is an access problem, and they send
            // you to completely different screens.
            (bad[0].error ? '<div style="margin-top:4px;white-space:normal">Reason given: ' + escapeHtml(bad[0].error) + '</div>' : '') +
            '</div>'
          : '') +
        (r.hint
          ? '<div style="margin-top:8px;font-size:12px;color:var(--text-muted);white-space:normal">' +
            '<strong>Meta&rsquo;s own list of what it accepts:</strong><br>' + escapeHtml(r.hint) + '</div>'
          : '') +
        (r.error ? '<div style="font-size:12px;color:var(--error)">' + escapeHtml(r.error) + '</div>' : '') +
        '</div>';
    }).join('');
  });

}

function renderUpload(root) {
  // Upload section
  const uploadSection = el('div', 'section');
  uploadSection.innerHTML = `
    <h2>Upload Reports</h2>
    <div class="drop-zone" id="drop-zone">
      <strong>Drop CSV/XLSX files here or click to browse</strong>
      <p>Product_Mix, Operations_Report, Hourly_Sales_Report files</p>
    </div>
    <input type="file" id="file-input" multiple accept=".csv,.xlsx" style="display:none">
    <div id="upload-file-list"></div>
    <div class="upload-actions" id="upload-actions" style="display:none">
      <button class="btn btn-small" id="upload-btn">Upload All</button>
      <button class="btn btn-small btn-outline" id="upload-clear">Clear</button>
      <span id="upload-count" style="color:var(--text-muted);font-size:12px"></span>
    </div>
    <div class="upload-progress" id="upload-progress"><div class="fill" id="upload-progress-fill"></div></div>
    <div class="upload-summary" id="upload-summary"></div>
  `;
  root.appendChild(uploadSection);
  initUpload();
}


function initUpload() {
  const dropZone = document.getElementById('drop-zone');
  const fileInput = document.getElementById('file-input');
  let uploadFiles = [];

  dropZone.addEventListener('click', () => fileInput.click());
  dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
  dropZone.addEventListener('drop', (e) => { e.preventDefault(); dropZone.classList.remove('dragover'); addUploadFiles(e.dataTransfer.files); });
  fileInput.addEventListener('change', () => { addUploadFiles(fileInput.files); fileInput.value = ''; });

  document.getElementById('upload-btn').addEventListener('click', () => doUpload());
  document.getElementById('upload-clear').addEventListener('click', () => { uploadFiles = []; renderUploadList(); document.getElementById('upload-summary').style.display = 'none'; document.getElementById('upload-progress').style.display = 'none'; });

  function addUploadFiles(newFiles) {
    for (const f of newFiles) {
      if (!uploadFiles.some(x => x.name === f.name && x.size === f.size)) uploadFiles.push(f);
    }
    renderUploadList();
  }

  function renderUploadList() {
    const list = document.getElementById('upload-file-list');
    list.innerHTML = '';
    uploadFiles.forEach((f, i) => {
      const valid = /^(Product_Mix|Operations_Report|Hourly_Sales_Report)/i.test(f.name);
      const item = document.createElement('div');
      item.className = 'file-item';
      item.id = 'ufile-' + i;
      const sz = f.size < 1024 ? f.size + ' B' : f.size < 1048576 ? (f.size/1024).toFixed(1) + ' KB' : (f.size/1048576).toFixed(1) + ' MB';
      item.innerHTML = `<span class="fname">${esc(f.name)}</span><span class="fsize">${sz}</span>
        <span class="fstatus ${valid ? 'fstatus-pending' : 'fstatus-warn'}">${valid ? 'Ready' : 'Unknown'}</span>
        <button class="fremove" onclick="this.closest('.file-item').remove(); void 0">&times;</button>`;
      list.appendChild(item);
    });
    document.getElementById('upload-actions').style.display = uploadFiles.length > 0 ? 'flex' : 'none';
    document.getElementById('upload-count').textContent = uploadFiles.length + ' file' + (uploadFiles.length !== 1 ? 's' : '');
  }

  async function doUpload() {
    const btn = document.getElementById('upload-btn');
    btn.disabled = true; btn.textContent = 'Uploading...';
    const progress = document.getElementById('upload-progress');
    const fill = document.getElementById('upload-progress-fill');
    progress.style.display = 'block';
    document.getElementById('upload-summary').style.display = 'none';

    let ok = 0, err = 0, warn = 0;
    const batchSize = 6;

    for (let i = 0; i < uploadFiles.length; i += batchSize) {
      const batch = uploadFiles.slice(i, i + batchSize);
      const formData = new FormData();
      batch.forEach(f => formData.append('files', f));

      batch.forEach((_, j) => { const el = document.getElementById('ufile-' + (i+j)); if (el) el.querySelector('.fstatus').textContent = 'Uploading...'; });

      try {
        const res = await fetch('/ingest/revel', { method: 'POST', body: formData });
        const data = await res.json();
        if (data.results) {
          data.results.forEach((r, j) => {
            const el = document.getElementById('ufile-' + (i+j));
            if (!el) return;
            const st = el.querySelector('.fstatus');
            if (r.status === 'ingested') { st.textContent = 'Ingested'; st.className = 'fstatus fstatus-ok'; ok++; }
            else if (r.status === 'reconciliation_failed') { st.textContent = 'Recon failed'; st.className = 'fstatus fstatus-warn'; warn++; }
            else { st.textContent = r.status; st.className = 'fstatus fstatus-err'; err++; }
          });
        }
      } catch (e) {
        batch.forEach((_, j) => { const el = document.getElementById('ufile-' + (i+j)); if (el) { const st = el.querySelector('.fstatus'); st.textContent = 'Error'; st.className = 'fstatus fstatus-err'; } err++; });
      }

      fill.style.width = Math.min(100, Math.round(((i + batch.length) / uploadFiles.length) * 100)) + '%';
    }

    fill.style.width = '100%';
    btn.disabled = false; btn.textContent = 'Upload All';

    const summary = document.getElementById('upload-summary');
    summary.style.display = 'block';
    summary.innerHTML = `<div class="ustat"><span class="ulabel">Total</span><span>${uploadFiles.length}</span></div>
      <div class="ustat"><span class="ulabel">Ingested</span><span style="color:var(--success)">${ok}</span></div>
      ${warn > 0 ? `<div class="ustat"><span class="ulabel">Warnings</span><span style="color:#e8c840">${warn}</span></div>` : ''}
      ${err > 0 ? `<div class="ustat"><span class="ulabel">Errors</span><span style="color:var(--error)">${err}</span></div>` : ''}`;
  }
}

/**
 * What each role grants, fetched once and shown under the selector.
 *
 * FETCHED, not hardcoded here. The server computes it from ROLE_DOMAINS and
 * mayRead() — the same functions the tool layer refuses calls with — so this
 * panel cannot drift away from the rules it describes. A copy written in this
 * file would still be showing the old matrix the day after somebody changed
 * the real one, and an access decision would be made from it.
 */
let roleAccess = null;

async function loadRoleAccess() {
  if (roleAccess) return roleAccess;
  try {
    const res = await fetch('/admin/api/roles', { headers: { Authorization: 'Bearer ' + token } });
    if (!res.ok) return null;
    const payload = await res.json();
    roleAccess = {};
    for (const r of payload.roles || []) roleAccess[r.role] = r;
    return roleAccess;
  } catch (e) {
    // The panel is an aid, not a gate. Losing it must not stop somebody
    // assigning a role, and the enforcement is server-side regardless.
    console.warn('[admin] could not load the role descriptions', e);
    return null;
  }
}

async function showRoleAccess(userId) {
  const box = document.getElementById('role-access-' + userId);
  const select = document.getElementById('role-' + userId);
  if (!box || !select) return;

  /**
   * Only the row being touched keeps its line.
   *
   * Otherwise a hundred users means a hundred lines, which is the thing this
   * rewrite exists to stop. The reference table at the top is where the full
   * picture lives; this is a reminder at the moment of the decision.
   */
  for (const other of document.querySelectorAll('.role-access')) {
    if (other !== box) other.innerHTML = '';
  }

  const map = await loadRoleAccess();
  const info = map && map[select.value];
  if (!info) { box.innerHTML = ''; return; }

  box.innerHTML =
    '<strong>' + esc(info.label) + '</strong> — ' + esc(info.summary) +
    (info.role === 'owner'
      ? '<span class="ra-warn">Owner ignores the venue chosen on the left: every venue, plus this console.</span>'
      : '');
}

/**
 * The reference, rendered once above the user list.
 *
 * Computed by the server from ROLE_DOMAINS and mayRead(), so it cannot drift
 * from what the tool layer actually refuses. The detail is collapsed because
 * the grid answers the question most of the time and the lists are for the one
 * occasion somebody wants to be sure.
 */
async function renderRoleMatrix(container) {
  const map = await loadRoleAccess();
  // The panel is an aid, not a gate. If it cannot load, the slot is removed
  // rather than left as an empty bordered box that looks like a fault.
  if (!map) { container.remove(); return; }

  const order = ['staff', 'manager', 'finance', 'owner'].filter(r => map[r]);
  const cell = (on) => on ? '<td class="yes">yes</td>' : '<td class="no">no</td>';

  let html =
    '<div class="role-matrix"><h2>What each role can see</h2>' +
    '<table><thead><tr>' +
      '<th>Role</th><th>Venues</th><th>Trading</th><th>Social</th>' +
      '<th>P&amp;L</th><th>Wage amounts</th><th>Admin</th>' +
    '</tr></thead><tbody>';

  for (const r of order) {
    const m = map[r].matrix;
    html += '<tr><td>' + esc(map[r].label) + '</td>' +
      '<td>' + esc(m.venues) + '</td>' +
      cell(m.operations) + cell(m.marketing) + cell(m.financial) + cell(m.payroll) + cell(m.admin) +
      '</tr>';
  }

  html += '</tbody></table>' +
    '<div class="note">Everyone except an owner sees only the venues assigned to them — a question about any ' +
    'other venue is refused by the server, not just discouraged. Anyone without wage amounts still sees labour ' +
    'as a percentage of sales, which is what running a shift needs.</div>' +
    '<details><summary>The detail, role by role</summary><div class="detail">';

  for (const r of order) {
    const info = map[r];
    const list = (items, cls) =>
      items.length ? '<ul class="' + cls + '">' + items.map(i => '<li>' + esc(i) + '</li>').join('') + '</ul>' : '';
    html += '<h4>' + esc(info.label) + '</h4>' + list(info.can, 'ra-can') + list(info.cannot, 'ra-cannot') +
      (info.blocked_tools.length
        ? '<div style="color:var(--text-muted);font-size:11px;margin-top:3px">Refused ' +
          info.blocked_tools.length + ' of ' + (info.tools.length + info.blocked_tools.length) +
          ' data tools: ' + esc(info.blocked_tools.join(', ')) + '</div>'
        : '');
  }

  html += '</div></details></div>';

  // Fills the slot render() already positioned, rather than appending a new one
  // wherever the page has got to by the time the fetch returns.
  container.innerHTML = html;
}

/**
 * Grant one role at every venue that is ticked.
 *
 * The requests go out TOGETHER rather than one after another: three venues
 * used to be three round trips in series with a full page rebuild between
 * each. They are independent grants and the server treats them as such.
 *
 * A PARTIAL FAILURE IS REPORTED AS ONE, naming the venues that did not take.
 * "Role assigned" after two of three succeeded is the kind of message that gets
 * believed and then quietly contradicted by the table underneath it.
 */
async function assignRole(userId) {
  const picks = [...document.querySelectorAll('.venue-pick[data-user="' + userId + '"]:checked')];
  if (picks.length === 0) {
    toast('error', 'Pick at least one venue first.');
    return;
  }

  const role = document.getElementById('role-' + userId).value;
  const btn = document.getElementById('add-role-' + userId);
  if (btn) { btn.disabled = true; btn.textContent = 'Adding…'; }

  const results = await Promise.all(picks.map(async (box) => {
    const res = await api('POST', `/admin/api/users/${userId}/roles`, { venue_id: box.value, role });
    return { name: box.dataset.name, error: res.error };
  }));

  const failed = results.filter(r => r.error);
  if (failed.length === 0) {
    toast('success', results.length === 1
      ? 'Added ' + role + ' at ' + results[0].name
      : 'Added ' + role + ' at ' + results.length + ' venues');
  } else if (failed.length === results.length) {
    toast('error', failed[0].error);
  } else {
    toast('error', 'Added ' + (results.length - failed.length) + ', failed at ' +
      failed.map(f => f.name).join(', '));
  }

  // Just this table, not the whole tab.
  await refreshUsers();
}

async function removeRole(roleId) {
  const res = await api('DELETE', `/admin/api/roles/${roleId}`);
  if (res.error) {
    toast('error', res.error);
  } else {
    toast('success', 'Role removed');
    await refreshUsers();
  }
}

function confirmDeleteUser(userId, email) {
  if (!confirm('Delete user ' + email + '? This removes all their roles and access.')) return;
  doDeleteUser(userId);
}

async function doDeleteUser(userId) {
  const res = await api('DELETE', `/admin/api/users/${userId}`);
  if (res.error) {
    toast('error', res.error);
  } else {
    toast('success', 'User deleted');
    await refreshUsers();
  }
}

function showResetPassword(userId, email) {
  const overlay = el('div', 'modal-overlay');
  overlay.innerHTML = `
    <div class="modal">
      <h3>Reset password</h3>
      <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px">${email}</p>
      <input type="password" id="reset-pw-input" placeholder="New password">
      <div class="modal-btns">
        <button class="btn btn-small btn-outline" id="reset-cancel">Cancel</button>
        <button class="btn btn-small" id="reset-confirm">Reset</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);

  document.getElementById('reset-cancel').onclick = () => overlay.remove();
  overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };

  document.getElementById('reset-confirm').onclick = async () => {
    const pw = document.getElementById('reset-pw-input').value;
    if (!pw) return;
    const res = await api('POST', `/admin/api/users/${userId}/reset-password`, { password: pw });
    overlay.remove();
    if (res.error) {
      toast('error', res.error);
    } else {
      toast('success', 'Password reset');
    }
  };
}

async function deleteNote(noteId) {
  const res = await api('DELETE', `/admin/api/notes/${noteId}`);
  if (res.error) {
    toast('error', res.error);
  } else {
    toast('success', 'Note deleted');
    await loadAll();
  }
}

/**
 * Escape text before it goes into innerHTML.
 *
 * Not cosmetic. Note text is submitted by any authenticated user through the
 * capture endpoint and rendered here, in the OWNER's admin page -- the most
 * privileged session in the product. Unescaped, a note is a stored script
 * injection aimed squarely at it.
 */
function escapeHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function el(tag, cls) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  return e;
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

function toast(type, msg) {
  const t = el('div', 'toast ' + type);
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}
