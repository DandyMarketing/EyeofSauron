<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Sauron</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0a0a0f;
    --surface: #14141f;
    --surface-hover: #1a1a2a;
    --border: #2a2a3a;
    --text: #e4e4ef;
    --text-muted: #8888a0;
    --accent: #e8933a;
    --accent-dim: #c47520;
    --error: #e84040;
    --success: #40c060;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }

  .logo {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: radial-gradient(circle, var(--accent) 0%, #8b3500 70%, #2a0e00 100%);
    box-shadow: 0 0 20px rgba(232, 147, 58, 0.3);
    flex-shrink: 0;
  }

  header h1 { font-size: 18px; font-weight: 600; }
  header .subtitle { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

  nav {
    margin-left: auto;
    display: flex;
    gap: 16px;
    font-size: 14px;
  }

  nav a { color: var(--text-muted); text-decoration: none; }
  nav a:hover, nav a.active { color: var(--accent); }

  .container {
    max-width: 960px;
    margin: 0 auto;
    padding: 24px 20px;
  }

  .section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    margin-bottom: 24px;
  }

  .section h2 {
    font-size: 16px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .invite-form {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }

  .invite-form input {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    outline: none;
    flex: 1;
    min-width: 180px;
  }

  .invite-form input:focus { border-color: var(--accent); }
  .invite-form input::placeholder { color: var(--text-muted); }

  .btn {
    background: var(--accent);
    color: #000;
    border: none;
    border-radius: 8px;
    padding: 10px 18px;
    font-size: 14px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: background 0.2s;
    white-space: nowrap;
  }

  .btn:hover { background: var(--accent-dim); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .btn-small {
    padding: 6px 12px;
    font-size: 12px;
    border-radius: 6px;
  }

  .btn-danger {
    background: var(--error);
    color: #fff;
  }

  .btn-danger:hover { background: #c03030; }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }

  th, td {
    padding: 10px 12px;
    text-align: left;
    border-bottom: 1px solid var(--border);
  }

  th {
    color: var(--text-muted);
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  tr:last-child td { border-bottom: none; }

  .role-badge {
    display: inline-block;
    padding: 3px 8px;
    border-radius: 4px;
    font-size: 12px;
    font-weight: 500;
  }

  .role-owner { background: rgba(232, 147, 58, 0.15); color: var(--accent); }
  .role-manager { background: rgba(100, 149, 237, 0.15); color: #6495ed; }
  .role-finance { background: rgba(64, 192, 96, 0.15); color: var(--success); }
  .role-staff { background: rgba(136, 136, 160, 0.15); color: var(--text-muted); }

  .role-actions {
    display: flex;
    gap: 6px;
    align-items: center;
    flex-wrap: wrap;
  }

  select {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 10px;
    color: var(--text);
    font-size: 12px;
    font-family: inherit;
    outline: none;
  }

  .toast {
    position: fixed;
    bottom: 20px;
    right: 20px;
    padding: 12px 20px;
    border-radius: 8px;
    font-size: 14px;
    z-index: 100;
    animation: slideIn 0.3s ease;
  }

  .toast.success { background: rgba(64, 192, 96, 0.9); color: #000; }
  .toast.error { background: rgba(232, 64, 64, 0.9); color: #fff; }

  @keyframes slideIn {
    from { transform: translateY(20px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  .system-card {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px;
    margin-bottom: 12px;
  }

  .system-card h4 {
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 8px;
  }

  .gap-item {
    font-size: 13px;
    padding: 4px 0;
    color: var(--error);
  }

  .no-gaps {
    font-size: 13px;
    color: var(--success);
  }

  .ingestion-row {
    font-size: 13px;
    padding: 4px 0;
    display: flex;
    gap: 12px;
  }

  .ingestion-row .status-ok { color: var(--success); }
  .ingestion-row .status-err { color: var(--error); }

  .loading {
    text-align: center;
    color: var(--text-muted);
    padding: 40px;
  }

  @media (max-width: 600px) {
    .invite-form { flex-direction: column; }
    .invite-form input { min-width: unset; }
    table { font-size: 13px; }
    th, td { padding: 8px 6px; }
  }
</style>
</head>
<body>
  <header>
    <div class="logo"></div>
    <div>
      <h1>Sauron Admin</h1>
      <div class="subtitle">The Dandy Collection</div>
    </div>
    <nav>
      <a href="/">Chat</a>
      <a href="/admin.html" class="active">Admin</a>
      <a href="#" id="logout-link">Logout</a>
    </nav>
  </header>

  <div class="container" id="app">
    <div class="loading">Loading...</div>
  </div>

<script>
let token = null;
let venues = [];

(async function init() {
  const cfg = await fetch('/api/config').then(r => r.json());
  if (!cfg.supabaseUrl || !cfg.supabaseAnonKey) {
    document.getElementById('app').innerHTML = '<div class="loading">Auth not configured.</div>';
    return;
  }

  const { createClient } = await import('https://esm.sh/@supabase/supabase-js@2');
  const supabase = createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);

  const { data: { session } } = await supabase.auth.getSession();
  if (!session) {
    window.location.href = '/login.html';
    return;
  }

  token = session.access_token;

  // Check admin access
  const meRes = await fetch('/api/me', { headers: { Authorization: 'Bearer ' + token } });
  if (!meRes.ok) {
    window.location.href = '/login.html';
    return;
  }

  const me = await meRes.json();
  if (!me.isOwner) {
    document.getElementById('app').innerHTML = '<div class="loading">Admin access required. You do not have the owner role.</div>';
    return;
  }

  document.getElementById('logout-link').addEventListener('click', async (e) => {
    e.preventDefault();
    await supabase.auth.signOut();
    window.location.href = '/login.html';
  });

  await loadAll();
})();

async function api(method, path, body) {
  const opts = {
    method,
    headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
  };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(path, opts);
  return res.json();
}

async function loadAll() {
  const [usersData, venuesData, systemData] = await Promise.all([
    api('GET', '/admin/api/users'),
    api('GET', '/admin/api/venues'),
    api('GET', '/admin/api/system?days=3'),
  ]);

  venues = venuesData.venues || [];
  render(usersData.users || [], systemData);
}

function render(users, system) {
  const app = document.getElementById('app');
  app.innerHTML = '';

  // Invite section
  const inviteSection = el('div', 'section');
  inviteSection.innerHTML = `
    <h2>Invite User</h2>
    <form class="invite-form" id="invite-form">
      <input type="email" id="invite-email" placeholder="Email address" required>
      <input type="text" id="invite-name" placeholder="Full name (optional)">
      <button type="submit" class="btn">Invite</button>
    </form>
  `;
  app.appendChild(inviteSection);

  document.getElementById('invite-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('invite-email').value.trim();
    const name = document.getElementById('invite-name').value.trim();
    if (!email) return;

    const res = await api('POST', '/admin/api/users/invite', { email, full_name: name });
    if (res.error) {
      toast('error', res.error);
    } else {
      toast('success', 'Invite sent to ' + email);
      document.getElementById('invite-email').value = '';
      document.getElementById('invite-name').value = '';
      await loadAll();
    }
  });

  // Users table
  const usersSection = el('div', 'section');
  let tableHtml = `<h2>Users (${users.length})</h2>
    <table>
      <thead><tr><th>Name</th><th>Email</th><th>Venue Roles</th><th>Actions</th></tr></thead>
      <tbody>`;

  for (const user of users) {
    const roles = (user.roles || []).map(r =>
      `<span class="role-badge role-${r.role}">${r.venue_name} - ${r.role}</span>
       <button class="btn btn-small btn-danger" onclick="removeRole('${r.id}')">x</button>`
    ).join(' ');

    const venueOpts = venues.map(v => `<option value="${v.id}">${v.name}</option>`).join('');

    tableHtml += `<tr>
      <td>${esc(user.full_name || '-')}</td>
      <td>${esc(user.email)}</td>
      <td><div class="role-actions">${roles || '<span style="color:var(--text-muted)">No roles</span>'}</div></td>
      <td>
        <div class="role-actions">
          <select id="venue-${user.id}">${venueOpts}</select>
          <select id="role-${user.id}">
            <option value="manager">Manager</option>
            <option value="staff">Staff</option>
            <option value="finance">Finance</option>
            <option value="owner">Owner</option>
          </select>
          <button class="btn btn-small" onclick="assignRole('${user.id}')">Add</button>
        </div>
      </td>
    </tr>`;
  }

  tableHtml += '</tbody></table>';
  usersSection.innerHTML = tableHtml;
  app.appendChild(usersSection);

  // System health
  const sysSection = el('div', 'section');
  sysSection.innerHTML = '<h2>System Health</h2>';

  const gapsCard = el('div', 'system-card');
  gapsCard.innerHTML = '<h4>Data Gaps (last 3 days)</h4>';
  if (system.missing && system.missing.length > 0) {
    for (const gap of system.missing) {
      const gapEl = el('div', 'gap-item');
      gapEl.textContent = `${gap.venue} (${gap.date}): missing ${gap.missing.join(', ')}`;
      gapsCard.appendChild(gapEl);
    }
  } else {
    const ok = el('div', 'no-gaps');
    ok.textContent = 'No data gaps detected.';
    gapsCard.appendChild(ok);
  }
  sysSection.appendChild(gapsCard);

  const errCard = el('div', 'system-card');
  errCard.innerHTML = '<h4>Recent Errors</h4>';
  if (system.recent_errors && system.recent_errors.length > 0) {
    for (const err of system.recent_errors) {
      const row = el('div', 'ingestion-row');
      row.innerHTML = `<span class="status-err">${esc(err.status)}</span>
        <span>${esc(err.filename)}</span>
        <span style="color:var(--text-muted)">${esc(err.error)}</span>`;
      errCard.appendChild(row);
    }
  } else {
    const ok = el('div', 'no-gaps');
    ok.textContent = 'No recent errors.';
    errCard.appendChild(ok);
  }
  sysSection.appendChild(errCard);

  const ingCard = el('div', 'system-card');
  ingCard.innerHTML = '<h4>Recent Ingestions</h4>';
  if (system.recent_ingestions && system.recent_ingestions.length > 0) {
    for (const ing of system.recent_ingestions) {
      const row = el('div', 'ingestion-row');
      const cls = ing.status === 'success' ? 'status-ok' : 'status-err';
      row.innerHTML = `<span class="${cls}">${esc(ing.status)}</span>
        <span>${esc(ing.filename)}</span>
        <span style="color:var(--text-muted)">${ing.business_date || ''}</span>
        <span style="color:var(--text-muted)">${ing.row_count ? ing.row_count + ' rows' : ''}</span>`;
      ingCard.appendChild(row);
    }
  }
  sysSection.appendChild(ingCard);

  app.appendChild(sysSection);
}

async function assignRole(userId) {
  const venueId = document.getElementById('venue-' + userId).value;
  const role = document.getElementById('role-' + userId).value;
  const res = await api('POST', `/admin/api/users/${userId}/roles`, { venue_id: venueId, role });
  if (res.error) {
    toast('error', res.error);
  } else {
    toast('success', 'Role assigned');
    await loadAll();
  }
}

async function removeRole(roleId) {
  const res = await api('DELETE', `/admin/api/roles/${roleId}`);
  if (res.error) {
    toast('error', res.error);
  } else {
    toast('success', 'Role removed');
    await loadAll();
  }
}

function el(tag, cls) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  return e;
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

function toast(type, msg) {
  const t = el('div', 'toast ' + type);
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}
</script>
</body>
</html>
