<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Sauron</title>
<!--
  Start the auth client downloading while the HTML is still being parsed.

  Without this the browser cannot know it needs the file until the script at the
  bottom of the page runs and reaches its dynamic import() -- so a 60 KB
  download that could have been in flight from the first byte waits for the
  whole document to parse first. A modulepreload is the only way to tell it
  earlier, because a dynamic import is invisible to the preload scanner.
-->
<link rel="modulepreload" href="/vendor/supabase.js">
<!--
  The Supabase config, substituted by the server (see injectConfig in
  src/server.ts). It used to be a fetch, which was a whole round trip at the
  front of the chain for two public values, and nothing could start until it
  came back.
-->
<!--SAURON_CONFIG-->
<script>
/* Light or dark, decided before anything draws so there is no flash: this
   browser's choice from the menu switch if it made one, else the device's own
   setting, followed live. theme.css holds both palettes. */
(function () {
  var d = document.documentElement, chosen = null, m = window.matchMedia ? matchMedia('(prefers-color-scheme: dark)') : null;
  try { chosen = localStorage.getItem('sauron.theme'); } catch (e) {}
  function system() { return m && m.matches ? 'dark' : 'light'; }
  function apply() { d.setAttribute('data-theme', chosen || system()); }
  apply();
  if (m && m.addEventListener) m.addEventListener('change', function () { if (!chosen) apply(); });
  window.sauronTheme = {
    current: function () { return d.getAttribute('data-theme'); },
    toggle: function () {
      var next = d.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      chosen = next === system() ? null : next;   // matching the device again means "follow the device"
      try { chosen ? localStorage.setItem('sauron.theme', chosen) : localStorage.removeItem('sauron.theme'); } catch (e) {}
      apply();
    },
  };
})();
</script>
<link rel="preload" href="/vendor/fonts/inter-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/theme.css?v=2">
<link rel="icon" href="/brand/sauron-eye.svg" type="image/svg+xml">
<link rel="icon" href="/brand/icon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/brand/apple-touch-icon.png">
<!-- Home-screen app (Khai, 13 Oct 2026): Android reads the manifest, iPhone the apple- tags. -->
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#f6f2ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1916" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sauron">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }


  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .login-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 40px;
    width: 100%;
    max-width: 400px;
    text-align: center;
  }


  h1 {
    font-size: 24px;
    margin-bottom: 4px;
  }

  .subtitle {
    color: var(--text-muted);
    font-size: 15px;
    margin-bottom: 32px;
  }

  .form-group {
    margin-bottom: 16px;
    text-align: left;
  }

  label {
    display: block;
    font-size: 14px;
    color: var(--text-muted);
    margin-bottom: 6px;
  }

  input[type="email"],
  input[type="password"], input[data-pw] {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px;
    color: var(--text);
    font-size: 15px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s;
  }

  input:focus { border-color: var(--accent); }
  input::placeholder { color: var(--text-muted); }

  .btn {
    width: 100%;
    background: var(--accent);
    color: var(--on-accent);
    border: none;
    border-radius: 10px;
    padding: 12px;
    font-size: 16px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: background 0.2s, opacity 0.2s;
    margin-top: 8px;
  }

  .btn:hover { background: var(--accent-dim); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .message {
    margin-top: 16px;
    font-size: 14px;
    padding: 10px 14px;
    border-radius: 8px;
    display: none;
  }

  .message.error {
    display: block;
    color: var(--error);
    background: rgba(179,38,30,0.08);
    border: 1px solid rgba(179,38,30,0.2);
  }

  .message.success {
    display: block;
    color: var(--success);
    background: rgba(47,125,74,0.08);
    border: 1px solid rgba(47,125,74,0.2);
  }
</style>
</head>
<body>
  <div class="login-card">
    <div class="sauron-watch" aria-hidden="true"><video autoplay muted loop playsinline preload="auto" poster="/brand/sauron-watch.jpg"><source src="/brand/sauron-watch.webm" type="video/webm"><source src="/brand/sauron-watch.mp4" type="video/mp4"></video></div>
    <h1>Sauron</h1>
    <div class="subtitle">The Dandy Collection</div>

    <form id="login-form">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@staydandy.com" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn" id="submit-btn">Sign in</button>
    </form>

    <div id="msg" class="message"></div>

    <div id="forgot-section" style="margin-top:20px">
      <a href="#" id="forgot-link" style="color:var(--text-muted);font-size:14px;text-decoration:none">Forgot password?</a>
      <div id="forgot-form" style="display:none;margin-top:12px">
        <input type="email" id="forgot-email" placeholder="Enter your email" style="width:100%;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:12px 16px;color:var(--text);font-size:15px;font-family:inherit;outline:none;margin-bottom:10px">
        <button class="btn" id="forgot-btn" style="font-size:14px;padding:10px">Send reset link</button>
      </div>
    </div>
  </div>

<script>
(async function init() {
  // Both at once. Neither needs the other, and this is the page an
  // unauthenticated person hits first — the one load nobody can skip.
  // Inlined by the server, so there is nothing to wait for. The fetch remains
  // as a fallback: if the substitution ever fails, the page authenticates the
  // way it always did rather than not at all.
  const [cfg, { createClient }] = await Promise.all([
    window.__SAURON_CONFIG__ ?? fetch('/api/config').then(r => r.json()),
    import('/vendor/supabase.js'),
  ]);
  if (!cfg.supabaseUrl || !cfg.supabaseAnonKey) {
    showMsg('error', 'Auth not configured. Contact your admin.');
    return;
  }
  const supabase = createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);

  // Check existing session
  const { data: { session } } = await supabase.auth.getSession();
  if (session) {
    window.location.href = '/';
    return;
  }

  const form = document.getElementById('login-form');
  const emailInput = document.getElementById('email');
  const passwordInput = document.getElementById('password');
  const submitBtn = document.getElementById('submit-btn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = emailInput.value.trim();
    const password = passwordInput.value;
    if (!email || !password) return;

    submitBtn.disabled = true;
    submitBtn.textContent = 'Signing in...';
    hideMsg();

    const { error } = await supabase.auth.signInWithPassword({ email, password });

    if (error) {
      showMsg('error', error.message);
      submitBtn.disabled = false;
      submitBtn.textContent = 'Sign in';
    } else {
      window.location.href = '/';
    }
  });

  // Forgot password
  document.getElementById('forgot-link').addEventListener('click', (e) => {
    e.preventDefault();
    document.getElementById('forgot-form').style.display = 'block';
    document.getElementById('forgot-link').style.display = 'none';
  });

  document.getElementById('forgot-btn').addEventListener('click', async () => {
    const email = document.getElementById('forgot-email').value.trim();
    if (!email) return;
    const forgotBtn = document.getElementById('forgot-btn');
    forgotBtn.disabled = true;
    forgotBtn.textContent = 'Sending...';

    const { error } = await supabase.auth.resetPasswordForEmail(email, {
      redirectTo: window.location.origin + '/reset-password.html',
    });

    if (error) {
      showMsg('error', error.message);
      forgotBtn.disabled = false;
      forgotBtn.textContent = 'Send reset link';
    } else {
      showMsg('success', 'Check your email for the password reset link.');
      forgotBtn.textContent = 'Sent';
    }
  });
})();

function showMsg(type, text) {
  const el = document.getElementById('msg');
  el.className = 'message ' + type;
  el.textContent = text;
}

function hideMsg() {
  document.getElementById('msg').className = 'message';
}
</script>
<script src="/password-reveal.js" defer></script>
</body>
</html>
