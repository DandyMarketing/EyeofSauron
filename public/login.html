<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Sauron</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0a0a0f;
    --surface: #14141f;
    --border: #2a2a3a;
    --text: #e4e4ef;
    --text-muted: #8888a0;
    --accent: #e8933a;
    --accent-dim: #c47520;
    --error: #e84040;
    --success: #40c060;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .login-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 40px;
    width: 100%;
    max-width: 400px;
    text-align: center;
  }

  .logo {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: radial-gradient(circle, var(--accent) 0%, #8b3500 60%, #2a0e00 100%);
    box-shadow: 0 0 40px rgba(232, 147, 58, 0.25);
    margin: 0 auto 20px;
  }

  h1 {
    font-size: 24px;
    margin-bottom: 4px;
  }

  .subtitle {
    color: var(--text-muted);
    font-size: 14px;
    margin-bottom: 32px;
  }

  .form-group {
    margin-bottom: 16px;
    text-align: left;
  }

  label {
    display: block;
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 6px;
  }

  input[type="email"],
  input[type="password"] {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px;
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s;
  }

  input:focus { border-color: var(--accent); }
  input::placeholder { color: var(--text-muted); }

  .btn {
    width: 100%;
    background: var(--accent);
    color: #000;
    border: none;
    border-radius: 10px;
    padding: 12px;
    font-size: 15px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: background 0.2s, opacity 0.2s;
    margin-top: 8px;
  }

  .btn:hover { background: var(--accent-dim); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .message {
    margin-top: 16px;
    font-size: 13px;
    padding: 10px 14px;
    border-radius: 8px;
    display: none;
  }

  .message.error {
    display: block;
    color: var(--error);
    background: rgba(232, 64, 64, 0.08);
    border: 1px solid rgba(232, 64, 64, 0.2);
  }

  .message.success {
    display: block;
    color: var(--success);
    background: rgba(64, 192, 96, 0.08);
    border: 1px solid rgba(64, 192, 96, 0.2);
  }
</style>
</head>
<body>
  <div class="login-card">
    <div class="logo"></div>
    <h1>Sauron</h1>
    <div class="subtitle">The Dandy Collection</div>

    <form id="login-form">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@staydandy.com" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter your password" required>
      </div>
      <button type="submit" class="btn" id="submit-btn">Sign in</button>
    </form>

    <div id="msg" class="message"></div>

    <div id="forgot-section" style="margin-top:20px">
      <a href="#" id="forgot-link" style="color:var(--text-muted);font-size:13px;text-decoration:none">Forgot password?</a>
      <div id="forgot-form" style="display:none;margin-top:12px">
        <input type="email" id="forgot-email" placeholder="Enter your email" style="width:100%;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:12px 16px;color:var(--text);font-size:14px;font-family:inherit;outline:none;margin-bottom:10px">
        <button class="btn" id="forgot-btn" style="font-size:13px;padding:10px">Send reset link</button>
      </div>
    </div>
  </div>

<script>
(async function init() {
  const cfg = await fetch('/api/config').then(r => r.json());
  if (!cfg.supabaseUrl || !cfg.supabaseAnonKey) {
    showMsg('error', 'Auth not configured. Contact your admin.');
    return;
  }

  const { createClient } = await import('https://esm.sh/@supabase/supabase-js@2');
  const supabase = createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);

  // Check existing session
  const { data: { session } } = await supabase.auth.getSession();
  if (session) {
    window.location.href = '/';
    return;
  }

  const form = document.getElementById('login-form');
  const emailInput = document.getElementById('email');
  const passwordInput = document.getElementById('password');
  const submitBtn = document.getElementById('submit-btn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = emailInput.value.trim();
    const password = passwordInput.value;
    if (!email || !password) return;

    submitBtn.disabled = true;
    submitBtn.textContent = 'Signing in...';
    hideMsg();

    const { error } = await supabase.auth.signInWithPassword({ email, password });

    if (error) {
      showMsg('error', error.message);
      submitBtn.disabled = false;
      submitBtn.textContent = 'Sign in';
    } else {
      window.location.href = '/';
    }
  });

  // Forgot password
  document.getElementById('forgot-link').addEventListener('click', (e) => {
    e.preventDefault();
    document.getElementById('forgot-form').style.display = 'block';
    document.getElementById('forgot-link').style.display = 'none';
  });

  document.getElementById('forgot-btn').addEventListener('click', async () => {
    const email = document.getElementById('forgot-email').value.trim();
    if (!email) return;
    const forgotBtn = document.getElementById('forgot-btn');
    forgotBtn.disabled = true;
    forgotBtn.textContent = 'Sending...';

    const { error } = await supabase.auth.resetPasswordForEmail(email, {
      redirectTo: window.location.origin + '/reset-password.html',
    });

    if (error) {
      showMsg('error', error.message);
      forgotBtn.disabled = false;
      forgotBtn.textContent = 'Send reset link';
    } else {
      showMsg('success', 'Check your email for the password reset link.');
      forgotBtn.textContent = 'Sent';
    }
  });
})();

function showMsg(type, text) {
  const el = document.getElementById('msg');
  el.className = 'message ' + type;
  el.textContent = text;
}

function hideMsg() {
  document.getElementById('msg').className = 'message';
}
</script>
</body>
</html>
